# XcodeGen 設定：產生 MobileLabs.xcodeproj（執行 ./generate.sh）。
# 只有一個 App target；演練程式都在 Practice／Solution 兩個 Swift Package 裡，新增檔案不用重新產生專案。
name: MobileLabs
options:
  bundleIdPrefix: tw.harry
  deploymentTarget:
    iOS: "17.0"
packages:
  LabKit:
    path: LabKit
  Practice:
    path: Practice
  Solution:
    path: Solution
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MobileLabs:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: LabKit
      - package: Practice
      - package: Solution
    # 演練用到的 Info.plist 設定（XcodeGen 會產生 App/Info.plist，不要直接改那個檔案）
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: tw.harry.MobileLabs
            CFBundleURLSchemes: [mobilelabs]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [tw.harry.MobileLabs.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.harry.MobileLabs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mobile Labs
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: 演練：用 Face ID 解鎖金鑰
        INFOPLIST_KEY_NSCameraUsageDescription: 演練：掃描付款 QR code
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
