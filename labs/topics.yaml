# 四大主題：行動端面試最常考的四項（記憶體管理、效能優化、架構設計、UI/UX）各自對應哪些演練。
# 順序建議由最容易被問倒的開始：記憶體 → 效能 → 架構 → UI/UX。
#
# 這個檔案是單一來源，`npm run topics:gen` 會產生 App 首頁「四大主題」排序用的
#   labs/ios/LabKit/Sources/LabKit/JdFocus.swift、labs/android/labkit/.../JdFocus.kt
# labs 用「代號 L編號」；units 是複習站的單元 id（App 不用，留給網站）。順序就是建議的練習順序。
topics:
  - id: memory
    title: 記憶體管理
    short: 記憶體
    why: >-
      交易所 App 常駐行情畫面、圖片多、WebSocket 常開，記憶體問題最容易在線上才爆。面試會問：洩漏怎麼發生、怎麼找、怎麼證明修好了；圖片為什麼最吃記憶體；App 為什麼被系統殺掉。
    units:
      - swift-arc-capture
      - swift-value-semantics-cow
      - advanced-memory
      - kotlin-coroutines-structured
      - kotlin-flow
      - advanced-app-size
      - advanced-stability-crash
    groups:
      - title: iOS：參考計數與 retain cycle
        note: 先把 ARC 的洩漏寫過一輪。每個演練都用 LiveObjects 看物件有沒有被釋放，再用 Xcode 的 Memory Graph 看是誰抓著。
        labs:
          - Swift02ARC L01
          - Swift02ARC L02
          - Swift02ARC L04
          - Swift02ARC L05
          - Swift02ARC L06
          - Swift02ARC L07
          - Swift02ARC L08
          - Swift02ARC L09
          - Swift02ARC L10
          - Swift02ARC L11
          - Swift02ARC L13
          - Swift04StructuredConcurrency L01
          - Swift06AsyncStream L04
          - Swift08SwiftUIIdentity L06
          - Swift09UIKitInterop L02
          - Swift09UIKitInterop L04
          - Swift09UIKitInterop L05
          - Swift11ObjC L01
          - Swift11ObjC L03
      - title: Android：被活得更久的東西抓著
        note: Android 有 GC，洩漏是「該回收的物件被單例、scope、listener 抓著」。用 LeakCanary 或 WeakReference 加 GC 驗證。
        labs:
          - Kotlin03Coroutines L01
          - Kotlin03Coroutines L05
          - Kotlin05Flow L07
          - Kotlin05Flow L09
          - Kotlin07SideEffects L06
          - Platform01Lifecycle L05
          - Advanced03Memory L03
          - Advanced03Memory L05
          - Advanced03Memory L06
          - Platform08Modules L01
      - title: 記憶體用量：圖片、快取、累積
        note: 洩漏之外的另一半：不是沒釋放，而是用太多。圖片解碼後的大小、快取沒有上限、長時間累積。
        labs:
          - Advanced03Memory L02
          - Advanced07AppSize L02
          - Advanced03Memory L01
          - Advanced03Memory L04
          - Swift02ARC L12
          - Kotlin01Types L04
          - Swift03Generics L04
          - Swift01ValueSemantics L02
          - Swift01ValueSemantics L04
      - title: 線上怎麼看
        note: 被系統殺掉不會有 crash 報告。OOM 怎麼算、怎麼和 crash 分開看。
        labs:
          - Advanced06Crash L06
    gaps:
      - 兩邊的 heap dump／Memory Graph 操作只寫在演練步驟裡，要自己開工具走一次。
      - Android 的 Bitmap 記憶體在電腦上是用公式算的，手機上請用 Memory Profiler 看真的數字。

  - id: performance
    title: 效能優化
    short: 效能
    why: >-
      面試最常從「畫面卡」追問：卡在哪一格、怎麼量、怎麼證明優化有效。行情列表每秒幾十次更新是交易所 App 的招牌問題。
    units:
      - advanced-startup
      - advanced-rendering-jank
      - platform-threading
      - advanced-high-frequency-streams
      - swift-swiftui-identity-performance
      - kotlin-compose-runtime-stability
      - kotlin-compose-performance
      - exchange-realtime-ui
      - advanced-app-size
    groups:
      - title: 先會量：沒有數字就沒有優化
        note: 平均值會騙人。先學會看 p90／p95、hitch、frame budget，再動手改。
        labs:
          - Advanced01Startup L01
          - Advanced01Startup L05
          - Advanced02Jank L01
          - Platform02Threading L02
          - Advanced10Observability L03
      - title: 啟動時間
        labs:
          - Advanced01Startup L02
          - Advanced01Startup L03
          - Advanced01Startup L04
      - title: 主執行緒：什麼都不該在上面做
        note: 卡頓的根源九成是主執行緒被占住：同步 I/O、重運算、鎖、runBlocking。
        labs:
          - Platform02Threading L01
          - Platform02Threading L03
          - Platform02Threading L05
          - Platform02Threading L06
          - Swift05Actors L04
          - Swift05Actors L07
          - Kotlin04CoroutineSync L06
          - Advanced04Races L04
          - Advanced06Crash L05
      - title: 高頻行情：合併、節流、背壓
        note: 每一筆都更新畫面一定卡。只留最新、固定頻率送到畫面、慢的消費者不能拖慢別人。
        labs:
          - Platform02Threading L08
          - Advanced05HighFrequency L01
          - Advanced05HighFrequency L02
          - Advanced05HighFrequency L04
          - Swift06AsyncStream L01
          - Swift06AsyncStream L06
          - Kotlin05Flow L04
          - Kotlin05Flow L08
          - Kotlin11ComposeState L07
          - Kotlin08ComposePerformance L04
          - Exchange06RealtimeUI L01
          - Design02MarketData L03
      - title: 列表與重組：只重畫有變的那一列
        note: SwiftUI 的 body 重算、Compose 的重組，都用計數器證明「改了之後只有那一列重畫」。
        labs:
          - Swift07SwiftUIState L05
          - Swift07SwiftUIState L06
          - Swift08SwiftUIIdentity L03
          - Swift08SwiftUIIdentity L04
          - Swift08SwiftUIIdentity L05
          - Swift08SwiftUIIdentity L07
          - Kotlin06Recomposition L01
          - Kotlin06Recomposition L03
          - Kotlin06Recomposition L04
          - Kotlin08ComposePerformance L01
          - Kotlin08ComposePerformance L02
          - Kotlin08ComposePerformance L03
          - Kotlin08ComposePerformance L05
          - Kotlin09ComposeArchitecture L02
          - Kotlin09ComposeArchitecture L04
          - Advanced02Jank L02
          - Advanced02Jank L03
          - Advanced02Jank L04
          - Swift09UIKitInterop L01
          - Exchange05OrderBook L08
          - Exchange06RealtimeUI L04
      - title: 演算法與資料結構的成本
        note: Live coding 也會考：資料變 10 倍，成本變幾倍？用計數器算比較次數，不猜。
        labs:
          - Swift01ValueSemantics L02
          - Swift01ValueSemantics L04
          - Swift03Generics L04
          - Kotlin01Types L04
          - Coding01DataStructures L03
          - Coding01DataStructures L05
          - Coding02TimeStreams L04
          - Coding02TimeStreams L05
          - Exchange07Kline L07
          - Advanced05HighFrequency L05
      - title: App 體積
        labs:
          - Advanced07AppSize L01
          - Advanced07AppSize L03
          - Advanced07AppSize L04
    gaps:
      - 網路層的效能（HTTP 快取、圖片的記憶體＋磁碟快取、請求合併）沒有演練。
      - Baseline Profile、R8／-Osize 這類建置期優化在 Debug 看不出差別，只有筆記寫怎麼量。
      - 電池與資料庫查詢效能沒有涵蓋。

  - id: architecture
    title: 行動端架構設計
    short: 架構
    why: >-
      這一項面試多半用「講」的：怎麼切層、狀態放哪、怎麼讓三個畫面的數字一致、舊程式怎麼逐步換掉。演練負責讓你講的時候有具體的 bug 可以舉。系統設計案例也歸在這裡。
    units:
      - advanced-architecture-evolution
      - kotlin-compose-architecture
      - swift-swiftui-state
      - swift-swiftui-uikit-interop
      - platform-modularization
      - sysdesign-framework
      - sysdesign-market
      - sysdesign-order
      - sysdesign-alerts
      - sysdesign-greenfield
    groups:
      - title: 單一資料來源與單向資料流
        note: 狀態只有一份、只從一個方向改。三個畫面數字不一樣、按鈕狀態對不上，都是這裡出錯。
        labs:
          - Design03OrderAssets L01
          - Design03OrderAssets L02
          - Design03OrderAssets L03
          - Advanced09Architecture L03
          - Kotlin09ComposeArchitecture L01
          - Swift07SwiftUIState L01
          - Swift07SwiftUIState L02
          - Swift07SwiftUIState L03
          - Exchange08OrderFlow L01
          - Exchange08OrderFlow L03
          - Kotlin11ComposeState L08
      - title: 依賴方向、DI、模組邊界
        note: 誰可以 import 誰。依賴反了，測一個畫面要起整個 App。
        labs:
          - Advanced09Architecture L04
          - Advanced09Architecture L06
          - Advanced09Architecture L07
          - Platform08Modules L01
          - Advanced09Architecture L02
          - Kotlin09ComposeArchitecture L03
          - Swift09UIKitInterop L03
          - Swift09UIKitInterop L05
          - Testing01Strategy L01
          - Testing01Strategy L02
          - Testing03AndroidTesting L02
      - title: 多畫面共用一條連線（Repository 層）
        note: 系統設計案例一的核心：訂閱的引用計數、快取和推送的先後、慢的訂閱者。
        labs:
          - Design02MarketData L01
          - Design02MarketData L02
          - Design02MarketData L04
          - Kotlin05Flow L01
          - Swift06AsyncStream L03
          - Swift06AsyncStream L05
      - title: 架構演進與風險控制
        note: strangler 式替換、adapter 隔離舊 SDK、feature flag 的一致性、kill switch。
        labs:
          - Advanced09Architecture L01
          - Advanced09Architecture L05
          - Advanced10Observability L05
          - Platform07Release L03
      - title: 系統設計案例三：提醒要放在伺服器
        labs:
          - Design04PriceAlerts L01
          - Design04PriceAlerts L03
          - Design04PriceAlerts L04
          - Design03OrderAssets L04
    gaps:
      - 離線與快取策略（Repository 同時有本機與遠端）只有 Design02 L04。
      - 「從 0 到 1」的案例四沒有演練，是純設計討論，用計時作答練。

  - id: uiux
    title: UI/UX
    short: UI/UX
    why: >-
      交易所 App 的 UI 有自己的規矩：價格閃爍方向、數字格式、輸入的數量不能被清掉、舊資料要標示。面試官會從「這個畫面哪裡會讓使用者下錯單」追問。
    units:
      - swift-swiftui-state
      - swift-swiftui-identity-performance
      - kotlin-compose-runtime-stability
      - kotlin-compose-side-effects
      - kotlin-compose-state-api
      - exchange-realtime-ui
      - exchange-precision
      - exchange-localization-numbers
      - platform-lifecycle
      - exchange-kline
    groups:
      - title: 狀態不能莫名其妙消失或重置
        note: identity 錯了、key 錯了、effect 的 key 寫錯，使用者打到一半的數量就不見。
        labs:
          - Swift08SwiftUIIdentity L01
          - Swift08SwiftUIIdentity L02
          - Kotlin06Recomposition L02
          - Kotlin06Recomposition L05
          - Kotlin06Recomposition L06
          - Kotlin06Recomposition L07
          - Kotlin09ComposeArchitecture L05
          - Kotlin11ComposeState L01
          - Kotlin11ComposeState L02
          - Kotlin11ComposeState L03
          - Kotlin11ComposeState L04
          - Kotlin11ComposeState L05
          - Kotlin11ComposeState L06
          - Platform01Lifecycle L03
          - Platform01Lifecycle L04
          - Kotlin05Flow L03
      - title: 副作用放錯地方，畫面行為就怪
        labs:
          - Kotlin07SideEffects L01
          - Kotlin07SideEffects L02
          - Kotlin07SideEffects L03
          - Kotlin07SideEffects L05
          - Kotlin07SideEffects L07
          - Kotlin07SideEffects L08
          - Kotlin07SideEffects L09
          - Kotlin07SideEffects L10
          - Swift07SwiftUIState L04
      - title: 交易畫面的體驗：不能讓人下錯單
        note: 價格過期要說、成交一半要說「部分」、取消中不能說「已取消」、滑價要看得到。
        labs:
          - Exchange01Orders L01
          - Exchange01Orders L02
          - Exchange01Orders L04
          - Exchange04Reconnect L06
          - Exchange08OrderFlow L05
          - Exchange06RealtimeUI L02
          - Exchange06RealtimeUI L03
          - Exchange05OrderBook L03
          - Exchange05OrderBook L07
          - Coding02TimeStreams L02
          - Coding02TimeStreams L03
      - title: 數字與文字怎麼顯示、放大、唸出來
        note: 日圓沒有小數、万／億、全形輸入、科學記號、捨入方向，顯示錯了就是金額錯了；字體放大不能截斷，螢幕閱讀器要唸得出漲跌。
        labs:
          - Exchange02Precision L05
          - Exchange02Precision L06
          - Exchange02Precision L07
          - Exchange13Localization L01
          - Exchange13Localization L02
          - Exchange13Localization L03
          - Exchange13Localization L05
          - Exchange13Localization L06
          - Swift10LanguageFeatures L01
          - Exchange06RealtimeUI L05
          - Exchange06RealtimeUI L06
      - title: 圖表
        labs:
          - Exchange07Kline L06
          - Exchange07Kline L07
          - Exchange07Kline L09
      - title: 安全相關的畫面行為
        labs:
          - Advanced08Security L03
          - Advanced08Security L04
          - Advanced08Security L05
    gaps:
      - 載入中、錯誤、空狀態的設計，以及鍵盤遮住輸入框，沒有演練。
      - 動畫、觸覺回饋、不同螢幕尺寸的排版沒有涵蓋。
