- id: sysdesign-greenfield-01
  type: open
  level: 3
  priority: P0
  tags: [system-design, architecture]
  prompt: |
    「如果讓你從零設計我們交易所 App 的 iOS／Android 架構，你會怎麼做？要不要用 KMP？怎麼確保品質與發布速度？」
  promptJa: |
    「当社の取引所アプリの iOS／Android のアーキテクチャをゼロから設計するとしたら、どうしますか？KMP は採用しますか？品質とリリース速度をどう両立しますか？」
  keyPoints:
    - 先問團隊規模、現有 App 的狀況（全部重寫或逐步改）、發布頻率、法規要求
    - 模組：功能模組（行情、交易、資產、帳號）＋基礎模組（設計系統、網路、資料、安全、分析、測試工具），功能模組之間不互相依賴
    - 分層與單向資料流；行情、訂單、資產各一個 Store；用依賴注入讓測試能換成假的實作
    - KMP：只共用兩個平台必須一致的純邏輯（精度、訂單狀態機、協定解析、簽名），UI 和平台 API 維持原生；先拿一個小模組試行
    - 設計系統：顏色和字體的規則、等寬數字、漲跌顏色做成設定、深色模式、字體縮放、多種語言
    - 品質：PR 跑 lint、單元測試、截圖比對（AI review 只當輔助）；夜間跑端到端測試；分階段發布，用指標決定要不要擴大；上線後監控
    - AI：規則檔規範架構；AI 產生的測試要先驗證能抓到錯、再人工 review；用 MCP 讓 AI 操作模擬器做探索式測試；用 ADR 記錄設計決策
    - 連結自己的經驗（KMP、重構既有 App、從零開發）
  modelAnswer: |
    我會先確認團隊規模、現在的 App 是要重寫還是漸進演進、發布頻率和合規要求。以下假設是雙平台各幾位工程師、漸進演進。

    模組上，兩個平台用同一張圖：行情、交易、資產、帳號四個 feature 模組，加上 design system、網路、資料、安全、分析、測試工具這些 core 模組。feature 之間不互相依賴，導航在 app 層組起來。iOS 用 SPM 的 local package，Android 用 Gradle 多模組加 convention plugin。每個功能模組內部用單向資料流，行情、訂單、資產各有一個 Store 當唯一的資料來源。

    KMP 的部分，我會共用「兩邊必須完全一致」的純邏輯：金額精度與捨入、訂單狀態的合併規則、WebSocket 協定解析和 API 簽名。UI、Keychain、生物辨識、推播、NFC 還是原生。我用過 KMP，也知道 iOS 端的痛點，所以會先挑精度規則這種小模組試行，量 iOS 的建置時間和開發體驗，再決定要不要擴大。

    Design system 除了顏色和字體，數字的顯示規則要集中，漲跌的紅綠也做成設定，因為不同市場的慣例不同。

    品質和速度靠流程：PR 跑 lint、單元和 snapshot 測試，AI review 當輔助；夜間在 device farm 跑登入、下單、入出金這些關鍵路徑的 E2E；發布用分階段，先給一小部分使用者，看 crash-free 比例和下單成功率決定要不要擴大。AI 的部分，架構規範寫進規則檔讓 agent 遵守，AI 產生的測試要先驗證它真的能抓到錯（例如故意改壞程式看測試會不會失敗），再經過人工 review 才合併。

    加入後的前 30 天我會先熟悉現有架構和發布流程，60 天提出模組化與測試策略，90 天讓第一版 AI 自動化測試上線。
  modelAnswerJa: |
    まずチーム規模、既存アプリを作り直すのか段階的に改善するのか、リリース頻度、コンプライアンス要件を確認します。ここでは段階的な改善を前提とします。

    モジュールは両OSで同じ構成にします。相場、取引、資産、アカウントの4つの機能モジュールと、デザインシステム、通信、データ、セキュリティ、分析、テスト用の共通モジュールです。機能モジュール同士は依存させず、画面遷移はアプリ層で組み立てます。各機能は単方向データフローで、相場、注文、資産はそれぞれ一つのストアを唯一の情報源にします。

    KMP は、金額の精度や丸め、注文状態のマージ規則、WebSocket のプロトコル解析、API 署名など「両OSで完全に一致すべき純粋なロジック」に限定して共有します。UI やキーチェーン、生体認証、プッシュ通知はネイティブです。KMP を使った経験から iOS 側の課題も分かっているので、まず小さなモジュールで試し、ビルド時間や開発体験を測ってから広げるか判断します。

    品質とスピードはプロセスで担保します。PR では lint、ユニットテスト、スナップショットテストを実行し、AI レビューは補助として使います。夜間にはデバイスファームでログイン、注文、入出金などの重要導線の E2E を実行し、リリースは段階的に行い、クラッシュフリー率や注文成功率を判断基準にします。

    入社後は、30日で既存のアーキテクチャとリリースフローを把握し、60日でモジュール化とテスト戦略を提案し、90日で AI を活用したテスト自動化の第一版を動かすことを目標にします。
  followUps:
    - iOS 團隊不熟 Kotlin，你怎麼推動 KMP？
    - 模組化之後建置變慢，你怎麼處理？
    - 既有 App 很大，漸進演進的第一步是什麼？
  timeLimitSec: 600

- id: sysdesign-greenfield-02
  type: multi
  level: 2
  priority: P0
  tags: [kmp]
  prompt: |
    在交易所 App 導入 KMP，下列哪些**最適合**放進共用模組？（複選）
  options:
    - "價格與數量的精度、捨入規則"
    - "訂單狀態機與事件合併規則"
    - "SwiftUI／Compose 的畫面"
    - "API 簽名（HMAC-SHA256）與 WebSocket 訊息解析"
    - "マイナンバーカード的 NFC 讀取"
  answer: [0, 1, 3]
  explain: |
    最值得共用的是「兩個平台必須完全一致」的純邏輯：金額規則不一致就是客訴，狀態機不一致就是 bug。
    UI（第 3 項）和平台硬體的 API（第 5 項的 NFC，還有生物辨識、Keychain）用原生比較好。KMP 要用 expect/actual（共用模組宣告介面、每個平台各自實作）來接這些 API，反而更複雜。

- id: sysdesign-greenfield-03
  type: single
  level: 2
  priority: P1
  tags: [modularization]
  prompt: |
    模組化時，「功能（feature）模組之間不互相依賴」最主要的好處是什麼？
  options:
    - "App 的安裝容量會變小"
    - "每個功能模組可以獨立開發、測試與建置；改一個功能不會牽動其他功能，建置也能同時進行並重用快取"
    - "不再需要依賴注入"
    - "可以完全不寫測試"
  answer: 1
  explain: |
    依賴方向清楚（功能模組 → 基礎模組），才能同時開發、只重新建置改到的部分、各自獨立測試。功能之間要溝通時，透過 app 層的導航，或基礎模組裡定義的介面。
    其他選項都不對：模組化不會讓安裝容量變小、仍然需要依賴注入、也仍然要寫測試。

- id: sysdesign-greenfield-04
  type: flash
  level: 1
  priority: P0
  tags: [plan]
  front: 加入後的 30／60／90 天計畫
  back: |
    30 天：讀懂架構和發布流程，從修 bug 熟悉程式碼，盤點測試和 CI 的現況。
    60 天：提出模組化和測試策略（寫成 ADR），先改善最痛的一塊並建立基本的測試。
    90 天：AI 自動化測試的第一版上線（關鍵流程的端到端測試＋AI 輔助），有指標可以追蹤。
