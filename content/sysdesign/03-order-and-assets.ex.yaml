- id: sysdesign-order-01
  type: open
  level: 3
  priority: P0
  tags: [system-design, order]
  prompt: |
    「請設計取引所的下單流程：從使用者按下『買』到訂單成交、資產更新。特別說明網路逾時、連點、App 被殺掉時怎麼避免重複下單，以及訂單頁和資產頁怎麼保持一致。」
  promptJa: |
    「取引所の注文フローを設計してください。ユーザーが『買い』を押してから約定し、資産が更新されるまでです。特に、タイムアウト、連打、アプリ終了時の二重注文防止と、注文画面と資産画面の整合性について説明してください。」
  keyPoints:
    - 送出前檢查：價格和數量的精度、最小下單量、可用餘額；確認畫面（成行注文要顯示滑價提醒）
    - 按下時產生 clientOrderId、立刻鎖住按鈕；重試一律用同一個編號
    - 狀態機：送出中 → 已接受／被拒絕／不確定（unknown）；不確定時用 clientOrderId 對帳（若交易所沒有用 client id 查單筆的 API，要查未成交列表和訂單紀錄比對）
    - 事件順序顛倒時的合併規則：結束的狀態不能退回、成交數量只增不減、以伺服器的時間或版本為準
    - 單一資料來源：OrderStore、BalanceStore，由 REST 回覆和私有 WebSocket 推送更新，各畫面只讀
    - 資產以伺服器為準；回到前景、重連、成交後重新查詢對帳
    - App 被系統關掉：送出前把「送出中」的訂單存到本機，重開後用 clientOrderId 對帳
    - 斷線時不排隊下單；被限流（429）時等待後再試；測試與監控（不確定狀態的比例、重複下單警報）
  modelAnswer: |
    使用者按下「買」時，先在 App 端檢查：價格對齊最小跳動單位，數量往下對齊最小單位、檢查最小下單量和可用餘額，成行注文在確認畫面顯示預估成交價與滑價提醒。

    確認後產生一個 clientOrderId，立刻鎖定按鈕，並把這筆「送出中」的訂單存在本機，再送出簽名的下單請求。訂單在 client 端有一個狀態機：送出中、已受理、被拒絕，或「未知」。網路逾時不代表失敗，所以會進入未知狀態，UI 顯示「確認中」，背景用同一個 clientOrderId 對帳（若交易所沒有用 client id 查單筆的 API，就查未成交列表和訂單紀錄比對），絕對不會用新的編號重送。逾時重試也只帶同一個編號，伺服器會認出是同一筆。App 如果被系統關掉，下次開啟時看到本機有「送出中」的紀錄，就用編號去查。

    一致性的部分，訂單和資產各有一個 Store 當唯一的資料來源，REST 的回覆和私有 WebSocket 的推送都寫進 Store，訂單頁、資產頁、交易對頁都只讀它，不各自打 API。事件的順序可能顛倒，例如推送比 REST 回覆先到，所以合併時有幾個規則：結束的狀態不能退回、成交數量只增不減、以伺服器的更新時間為準。資產以伺服器為準，我不在 App 端自己算最終餘額；回前景、重連、收到成交後都會重新對帳。

    斷線時不讓使用者下單，也不排隊補送。測試會把事件順序的各種排列組合寫成單元測試，上線後監控「不確定」狀態的比例和解決時間，並對疑似重複下單設告警。
  modelAnswerJa: |
    「買い」が押されたら、まずクライアント側で事前チェックをします。価格をティックサイズに合わせ、数量は刻みに合わせて切り捨て、最小注文数量と利用可能残高を確認します。成行注文の場合は確認画面で想定約定価格とスリッページの注意を表示します。

    確定時に clientOrderId を生成してボタンをロックし、未確定の注文として端末に保存してから、署名付きの注文リクエストを送ります。クライアント側のステートマシンは「送信中」「受付済み」「拒否」「不明」を持ちます。タイムアウトは失敗とは限らないので「不明」とし、画面には「確認中」と表示して、同じ clientOrderId で未約定の注文一覧と注文履歴を照合します。新しい ID で再送することは絶対にしません。アプリが終了した場合も、次回起動時に保存した ID で照会します。

    整合性については、注文と資産それぞれにストアを一つだけ持ち、REST の応答とプライベート WebSocket の通知をすべてそこに反映します。各画面はストアを読むだけです。イベントの順序が入れ替わることもあるので、終了状態からは戻らない、約定数量は減らない、サーバーの更新時刻を正とする、といったルールでマージします。資産はサーバーを正とし、復帰時や約定時に照合します。

    切断中は注文を受け付けず、後から自動送信もしません。テストではイベント順序のパターンを網羅し、リリース後は「不明」状態の割合と解消時間を監視します。
  followUps:
    - 伺服器不支援 clientOrderId 的話怎麼辦？
    - 撤單和成交同時發生，UI 會怎麼顯示？
    - 販売所（固定報價）的下單流程和取引所有什麼不同？
  timeLimitSec: 600

- id: sysdesign-order-02
  type: single
  level: 2
  priority: P0
  tags: [idempotency]
  prompt: |
    使用者送出下單請求後 10 秒逾時，沒有收到回覆。App 應該怎麼做？
  options:
    - "顯示「下單失敗」，請使用者重新下單"
    - "自動產生新的 clientOrderId 重送一次"
    - "標記為「確認中」，用同一個 clientOrderId 對帳（查未成交列表和訂單紀錄比對，或帶同一個編號重試），依結果更新狀態"
    - "什麼都不顯示，等使用者自己去訂單頁看"
  answer: 2
  explain: |
    逾時代表「不知道」：伺服器可能已經收到並建立訂單，只是回覆沒送到。
    - 顯示「失敗」（第 1 項）：使用者會再下一次，變成兩筆。
    - 用新編號重送（第 2 項）：伺服器認不出是同一筆，也會變成兩筆。
    - 什麼都不顯示（第 4 項）：使用者不知道發生什麼事，體驗很差。
    正確做法是進入「不確定」狀態、告訴使用者正在確認，並用同一個編號對帳。

- id: sysdesign-order-03
  type: multi
  level: 3
  priority: P0
  tags: [state-machine, ordering]
  prompt: |
    訂單事件的順序可能顛倒，也可能重複到達（REST 回覆、私有 WebSocket 推送、查詢結果）。合併時應該遵守哪些規則？（複選）
  options:
    - "訂單已經結束（filled、canceled、rejected）之後，收到未結束的事件要忽略"
    - "已成交數量只增不減"
    - "以最後到達的事件為準，直接覆蓋"
    - "以伺服器提供的更新時間或版本號判斷新舊"
    - "同一個事件套用一次或很多次，結果都要一樣（冪等）"
  answer: [0, 1, 3, 4]
  explain: |
    第 3 項錯：「最後到達的直接覆蓋」在順序顛倒時會讓狀態倒退，例如已經 filled，之後才收到比較早的 partiallyFilled 推送，狀態就退回部分成交。
    把合併邏輯寫成「輸入目前狀態和事件、輸出新狀態」的純函式（reducer），就能用單元測試列出各種事件順序來驗證。

- id: sysdesign-order-04
  type: order
  level: 1
  priority: P1
  tags: [flow]
  prompt: |
    使用者按下撤單，到 UI 顯示最終結果的流程。
  items:
    - 狀態改為「取消中」，撤單按鈕鎖住
    - 送出撤單請求（簽名）
    - 收到撤單請求的受理回覆（不代表已經取消）
    - 從私有 WebSocket 收到最終狀態：canceled，或撤單途中已經成交（filled，或部分成交後 canceled）
    - 更新訂單與資產 Store，所有畫面同步更新
  explain: |
    「撤單請求被受理」和「訂單已取消」是兩件事。撤單途中訂單可能剛好成交，最終狀態一定以伺服器為準。

- id: sysdesign-order-05
  type: single
  level: 2
  priority: P1
  tags: [offline]
  prompt: |
    使用者在地下鐵、網路斷線時按下「買」。最好的做法是？
  options:
    - "把訂單存起來，網路恢復後自動送出"
    - "直接告知目前無法連線、不能下單；保留表單內容，網路恢復後讓使用者自己確認再送"
    - "先在本機顯示「已成交」，網路恢復後再同步"
    - "持續重試直到成功"
  answer: 1
  explain: |
    行情隨時在變，網路恢復時價格可能已經完全不同。自動補送（第 1、4 項）等於替使用者做交易決定，風險很高；先顯示「已成交」（第 3 項）更是錯誤資訊。
    保留表單、讓使用者看到最新價格後自己再確認一次，才是安全的做法。
