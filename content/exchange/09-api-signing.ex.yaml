- id: exchange-api-signing-01
  type: single
  level: 1
  priority: P1
  tags: [signature-v2, post]
  prompt: |
    依這套交易所 API 文件的 Signature V2，對 `POST /v1/order/orders/place` 簽名時，**簽名字串**要包含哪些參數？
  options:
    - "JSON body 的全部欄位（`symbol`、`amount`、`price`、`type`…）加上 4 個認證參數"
    - "只簽 4 個認證參數（`AccessKeyId`、`SignatureMethod`、`SignatureVersion`、`Timestamp`）；其他資料放在 JSON body，**不參與簽名**"
    - "什麼都不簽，POST 請求靠 HTTPS（加密的網路連線）保護就夠了"
    - "只簽 `Timestamp` 與 `Signature`"
  answer: 1
  explain: |
    文件明說：GET 請求的 URL 參數也要放進簽名字串；POST 請求只簽 4 個認證參數，其餘的參數放在 Request Body 的 JSON 裡。簽名字串的格式是 `POST\n<小寫 host>\n<path>\n<排序且 URL 編碼的 4 個參數>`。
    - 第 1 項錯：那是 GET 的做法（GET 的 query 要一起簽）；POST 的 body 欄位不進簽名字串。
    - 第 3 項錯：需要簽名的 API 都要簽，HTTPS 只負責加密傳輸，不能取代簽名。
    - 第 4 項錯：`Signature` 是簽名的結果，不能放進簽名字串裡；而且 4 個認證參數缺一不可。
    這代表 body 的內容不受簽名保護（仍受 HTTPS 保護），這是這套簽名的設計特性，面試時可以點出來。

- id: exchange-api-signing-02
  type: multi
  level: 2
  priority: P1
  tags: [url-encode, rfc3986]
  prompt: |
    關於簽名時的 URL 編碼，哪些敘述正確？（複選）
  options:
    - "空白要編成 `%20`，不是 `+`；`+` 是表單編碼的慣例"
    - "十六進位要用大寫（`%3A`），`%3a` 會讓簽名字串不同"
    - "Java 的 `URLEncoder.encode` 可以直接使用，因為它就是標準的 URL 編碼"
    - "`Signature`（Base64）含有 `+`、`/`、`=`，放進 query 時必須編成 `%2B`、`%2F`、`%3D`"
    - "Swift 的 `addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed)` 會編碼 `&`、`=`、`+`，可以直接用"
  answer: [0, 1, 3]
  explain: |
    - 第 1 項正確：RFC 3986（定義網址格式的標準）規定空白是 `%20`；`+` 是表單編碼（`application/x-www-form-urlencoded`）的慣例，兩邊不一致，簽名就會不同。
    - 第 2 項正確：簽名字串是逐字元比對的，`%3A` 和 `%3a` 是不同的字串。
    - 第 3 項錯：`URLEncoder` 是表單編碼，空白變 `+`、`~` 變成 `%7E`、`*` 不編碼，與 RFC 3986 不同，不能直接用。
    - 第 4 項正確：Base64 的結果含有 `+`、`/`、`=`，不編碼的話，伺服器會把 `+` 當成空白，解出不同的簽名。
    - 第 5 項錯：`.urlQueryAllowed` 是為「整個 query 字串」設計的，保留了 `&`、`=`、`+`、`/`、`:` 等字元不編碼；簽名需要的是只保留 unreserved 字元（`A-Z a-z 0-9 - . _ ~`）的自建集合。
    - 本機實測：`"a b+c/d=e:f~g"` 用 `.urlQueryAllowed` 得到 `a%20b+c/d=e:f~g`，用 unreserved 集合得到 `a%20b%2Bc%2Fd%3De%3Af~g`。

- id: exchange-api-signing-03
  type: predict
  level: 2
  priority: P1
  tags: [url-encode, swift]
  prompt: |
    下列程式依序印出什麼？
  codeLang: swift
  code: |
    import Foundation

    let s = "a b+c/d=e:f~g"
    print(s.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed)!)

    let unreserved = CharacterSet(
        charactersIn:
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~"
    )
    print(s.addingPercentEncoding(withAllowedCharacters: unreserved)!)
    print("日".addingPercentEncoding(withAllowedCharacters: unreserved)!)
  answer: |
    a%20b+c/d=e:f~g a%20b%2Bc%2Fd%3De%3Af~g %E6%97%A5
  explain: |
    - 第一行：`.urlQueryAllowed` 只編碼空白（變成 `%20`），`+`、`/`、`=`、`:`、`~` 都保留不編碼。用在簽名會得到錯誤的簽名字串。
    - 第二行：只允許 unreserved 字元的集合，其他字元都編碼成大寫的十六進位。`~` 屬於 unreserved，所以不編碼；`+`、`/`、`=`、`:` 都被編碼。
    - 第三行：非 ASCII 字元先轉成 UTF-8 的 3 個 byte（`E6 97 A5`），再逐個 byte 編碼，變成 `%E6%97%A5`。

- id: exchange-api-signing-04
  type: fill
  level: 2
  priority: P1
  tags: [hmac, cryptokit]
  prompt: |
    補上 Swift（CryptoKit）計算 HMAC-SHA256 簽名並轉成 Base64 的程式。
  codeLang: swift
  code: |
    import CryptoKit
    import Foundation

    func hmacBase64(_ stringToSign: String, secret: String) -> String {
        let key = SymmetricKey(data: Data(secret.utf8))
        let mac = HMAC<____>.authenticationCode(
            for: Data(stringToSign.utf8),
            using: key
        )
        return Data(mac).____()
    }
  blanks:
    - [SHA256]
    - [base64EncodedString]
  explain: |
    `HMAC<SHA256>.authenticationCode(for:using:)` 會回傳一個 `HashedAuthenticationCode`，把它轉成 `Data` 之後，用 `base64EncodedString()` 編成 Base64 文字。
    Kotlin 對應的寫法是：`Mac.getInstance("HmacSHA256")` 搭配 `SecretKeySpec` 初始化，再用 `java.util.Base64` 編碼。
    進入 HMAC 之前的原始輸入都是 UTF-8 的 byte；金鑰和字串不要 `trim`（去掉前後空白）或重新編碼，否則算出的簽名會不同。

- id: exchange-api-signing-05
  type: single
  level: 2
  priority: P1
  tags: [clock-skew, server-time]
  prompt: |
    客服回報：部分使用者所有需要簽名的請求都失敗（回傳 `api-signature-not-valid` 之類的錯誤），重新登入也沒用。這些人的手機時間比實際時間快了 10 分鐘。下列哪個處理最合理？
  options:
    - "在 App 的說明頁，請使用者自己把手機時間改對"
    - "放寬簽名的時間格式，不要帶 `Timestamp`"
    - "App 啟動與回前景時，請求 `GET /v1/common/timestamp` 取得伺服器的毫秒時間，計算 `offset`，簽名用「本機時間 + offset」；經過的時間用單調時鐘量，簽名失敗時重新校時並重試一次"
    - "改用本機時間的前一個整點當作 Timestamp"
  answer: 2
  explain: |
    API 文件提供 `GET /v1/common/timestamp`（回傳毫秒的 Unix timestamp）。以伺服器時間為準算出 offset，簽名就不受使用者手機時間影響。經過的時間要用單調時鐘（單調時鐘是只會往前走、不受使用者調整系統時間影響的時鐘；iOS 的 `systemUptime`、Android 的 `elapsedRealtime`），否則使用者在校時之後又調整了系統時間，offset 就失效了。iOS 的 `systemUptime` 不含裝置睡眠的時間，所以回到前景時也要重新校時。
    - 第 1 項不理想：只靠使用者自己改時間，很多人不知道問題在哪裡，客服成本高；App 自己校正才是根本的解法。
    - 第 2 項錯：`Timestamp` 是簽名必要的欄位，不能省略。
    - 第 4 項錯：把時間改成前一個整點，和伺服器的時間一樣差很多，而且還可能被判定為過期的請求。
    伺服器容許的時間差有多大，文件沒有寫（未證實），所以不要自己猜一個數字。

- id: exchange-api-signing-06
  type: multi
  level: 3
  priority: P1
  tags: [private-ws, signature-2-1]
  prompt: |
    關於私有 WebSocket（`/ws/v2`）的簽名（依 API 文件），哪些敘述正確？（複選）
  options:
    - "認證訊息裡的參數名稱是小寫開頭的駝峰：`accessKey`、`signatureMethod`、`signatureVersion`、`timestamp`"
    - "`signatureVersion` 是 `2.1`，簽名字串的 path 固定為 `/ws/v2`"
    - "認證訊息 JSON 裡的值（例如 `timestamp`）也必須先做 URL 編碼"
    - "簽名字串的 method 是 `POST`"
    - "簽名字串的 query 部分，仍然是排序後、URL 編碼的參數組合"
  answer: [0, 1, 4]
  explain: |
    文件的 golang 範例：用 `url.Values`（會排序並編碼）組出 `accessKey`、`signatureMethod`、`signatureVersion=2.1`、`timestamp`，簽名字串是 `GET\n<host>\n/ws/v2\n<query>`，再做 HMAC-SHA256 與 Base64。
    - 第 1、2、5 項正確：參數名稱、版本號、固定的 path 和排序編碼的 query，都和上面的範例一致。
    - 第 3 項錯：文件註明「JSON 裡不需要 URL 編碼」。意思是送出的 JSON，值用原始字串；只有簽名字串內部的 query 才要編碼。
    - 第 4 項錯：簽名字串的 method 是 `GET`（WebSocket 的連線是從 GET 請求升級而來）。
    另外，`authType: "api"` 是訊息本身的欄位，不在簽名的參數之中。

