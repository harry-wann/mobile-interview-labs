    solution: |
      import Foundation
      import CryptoKit

      struct SignedRequest: Equatable {
          let stringToSign: String
          let signature: String
          let query: String
      }

      func percentEncode(_ s: String) -> String {
          let hex = Array("0123456789ABCDEF")
          var out = ""
          for b in s.utf8 {
              switch b {
              case 0x30...0x39, 0x41...0x5A, 0x61...0x7A, 0x2D, 0x2E, 0x5F, 0x7E:
                  out.unicodeScalars.append(UnicodeScalar(b))
              default:
                  out.append("%")
                  out.append(hex[Int(b >> 4)])
                  out.append(hex[Int(b & 0x0F)])
              }
          }
          return out
      }

      func formatTimestamp(epochMs: Int64) -> String {
          var calendar = Calendar(identifier: .gregorian)
          calendar.timeZone = TimeZone(identifier: "UTC")!
          let date = Date(timeIntervalSince1970: TimeInterval(epochMs / 1000))
          let c = calendar.dateComponents(
              [.year, .month, .day, .hour, .minute, .second],
              from: date
          )
          return String(format: "%04d-%02d-%02dT%02d:%02d:%02d",
                        c.year!, c.month!, c.day!, c.hour!, c.minute!, c.second!)
      }

      func signRequest(method: String, host: String, path: String,
                       accessKeyId: String, secretKey: String,
                       timestamp: String, params: [String: String]) -> SignedRequest {
          var pairs: [(String, String)] = [
              ("AccessKeyId", accessKeyId),
              ("SignatureMethod", "HmacSHA256"),
              ("SignatureVersion", "2"),
              ("Timestamp", timestamp),
          ]
          let m = method.uppercased()
          if m == "GET" {
              for (k, v) in params {
                  pairs.append((k, v))
              }
          }
          pairs.sort { Array($0.0.utf8).lexicographicallyPrecedes(Array($1.0.utf8)) }
          let canonical = pairs.map {
              "\(percentEncode($0.0))=\(percentEncode($0.1))"
          }.joined(separator: "&")
          let stringToSign = "\(m)\n\(host.lowercased())\n\(path)\n\(canonical)"
          let key = SymmetricKey(data: Data(secretKey.utf8))
          let mac = HMAC<SHA256>.authenticationCode(
              for: Data(stringToSign.utf8),
              using: key
          )
          let signature = Data(mac).base64EncodedString()
          return SignedRequest(
              stringToSign: stringToSign,
              signature: signature,
              query: canonical + "&Signature=" + percentEncode(signature)
          )
      }
    tests: |
      let host = "api.example-exchange.com"
      let ak = "test-access-key-0001"
      let sk = "test-secret-key-0001"
      let ts = "2017-05-11T15:19:30"
      let base4 = "AccessKeyId=test-access-key-0001&SignatureMethod=HmacSHA256&SignatureVersion=2&Timestamp=2017-05-11T15%3A19%3A30"

      check("percentEncode：unreserved 不編碼、空白 %20、保留字元大寫 hex") {
          percentEncode("") == "" && percentEncode("A-z_0.9~") == "A-z_0.9~"
              && percentEncode("a b") == "a%20b"
              && percentEncode("+/=:*") == "%2B%2F%3D%3A%2A"
      }

      check("percentEncode：非 ASCII 先轉 UTF-8 再逐 byte 編碼") {
          percentEncode("日") == "%E6%97%A5" && percentEncode("é") == "%C3%A9"
      }

      check("formatTimestamp：UTC、24 小時制、忽略毫秒") {
          formatTimestamp(epochMs: 1494516006000) == "2017-05-11T15:20:06"
              && formatTimestamp(epochMs: 1494516006999) == "2017-05-11T15:20:06"
              && formatTimestamp(epochMs: 0) == "1970-01-01T00:00:00"
              && formatTimestamp(epochMs: 4102444799000) == "2099-12-31T23:59:59"
      }

      check(
          "GET：query 一起簽，Timestamp 的冒號編成 %3A，order-id 排在大寫開頭的參數之後"
      ) {
          let r = signRequest(
              method: "GET",
              host: host,
              path: "/v1/order/orders",
              accessKeyId: ak,
              secretKey: sk,
              timestamp: ts,
              params: ["order-id": "1234567890"]
          )
          return r.stringToSign
              == "GET\napi.example-exchange.com\n/v1/order/orders\n\(base4)&order-id=1234567890"
              && r.signature == "KLn4U/Au9BfxNEAqNebkXqZGpgjxOmyhMwOi+FmMfdg="
              && r.query
                  == "\(base4)&order-id=1234567890&Signature=KLn4U%2FAu9BfxNEAqNebkXqZGpgjxOmyhMwOi%2BFmMfdg%3D"
      }

      check("POST：只簽 4 個認證參數（忽略 params），host 轉小寫、method 轉大寫") {
          let r = signRequest(
              method: "post",
              host: "API.Example-Exchange.com",
              path: "/v1/order/orders/place",
              accessKeyId: ak,
              secretKey: sk,
              timestamp: ts,
              params: ["symbol": "btcjpy", "amount": "1"]
          )
          return r.stringToSign
              == "POST\napi.example-exchange.com\n/v1/order/orders/place\n\(base4)"
              && r.signature == "zwVrzld/U+nC8m9CEzxGWbX7TMyGsK6AgtkPFEHCOXM="
              && r.query
                  == "\(base4)&Signature=zwVrzld%2FU%2BnC8m9CEzxGWbX7TMyGsK6AgtkPFEHCOXM%3D"
      }

      check("特殊字元：空白 %20、* → %2A、/ → %2F、~ 不編碼") {
          let r = signRequest(method: "GET", host: host, path: "/v1/account/accounts",
                              accessKeyId: ak, secretKey: sk, timestamp: ts,
                              params: ["symbol": "btc jpy", "note": "a~b-c_d.e*f/g"])
          return r.stringToSign
              == "GET\napi.example-exchange.com\n/v1/account/accounts\n\(base4)&note=a~b-c_d.e%2Af%2Fg&symbol=btc%20jpy"
              && r.signature == "vQgltpP9ItCkYjqTs2xwdKQSKchwSnAKRvDdsuTbSTk="
      }

      check("ASCII 排序（大寫在小寫之前）與非 ASCII 值") {
          let r = signRequest(method: "GET", host: host, path: "/v1/account/accounts",
                              accessKeyId: ak, secretKey: sk, timestamp: ts,
                              params: ["alpha": "2", "Zeta": "1", "memo": "日本 語"])
          return r.signature == "p+Ap28XMr9xE48g0EG+HAiomvVL0xi8P8a8i8dbC12w="
              && r.query
                  == "\(base4)&Zeta=1&alpha=2&memo=%E6%97%A5%E6%9C%AC%20%E8%AA%9E&Signature=p%2BAp28XMr9xE48g0EG%2BHAiomvVL0xi8P8a8i8dbC12w%3D"
      }
  kotlin:
    starter: |
      data class SignedRequest(
          val stringToSign: String,
          // Base64，尚未 URL encode
          val signature: String,
          // 排序後的 query，結尾是 &Signature=<編碼後的簽名>
          val query: String
      )

      fun percentEncode(s: String): String {
          // TODO
          return s
      }

      fun formatTimestamp(epochMs: Long): String {
          // TODO
          return ""
      }

      fun signRequest(
          method: String, host: String, path: String,
          accessKeyId: String, secretKey: String,
          timestamp: String, params: Map<String, String>
      ): SignedRequest {
          // TODO
          return SignedRequest("", "", "")
      }
    solution: |
      import java.time.Instant
      import java.time.ZoneOffset
      import java.time.format.DateTimeFormatter
      import java.util.Base64
      import java.util.Locale
      import javax.crypto.Mac
      import javax.crypto.spec.SecretKeySpec

      data class SignedRequest(
          val stringToSign: String,
          val signature: String,
          val query: String,
      )

      private const val HEX = "0123456789ABCDEF"

      fun percentEncode(s: String): String {
          val sb = StringBuilder()
          for (b in s.toByteArray(Charsets.UTF_8)) {
              val c = b.toInt() and 0xFF
              val unreserved = (c in 0x30..0x39) ||
                  (c in 0x41..0x5A) ||
                  (c in 0x61..0x7A) ||
                  c == 0x2D || c == 0x2E || c == 0x5F || c == 0x7E
              if (unreserved) {
                  sb.append(c.toChar())
              } else {
                  sb.append('%').append(HEX[c shr 4]).append(HEX[c and 0x0F])
              }
          }
          return sb.toString()
      }

      private val timestampFormatter: DateTimeFormatter =
          DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ss", Locale.ROOT)

      fun formatTimestamp(epochMs: Long): String =
          Instant.ofEpochMilli(epochMs)
              .atOffset(ZoneOffset.UTC)
              .format(timestampFormatter)

      fun signRequest(
          method: String, host: String, path: String,
          accessKeyId: String, secretKey: String,
          timestamp: String, params: Map<String, String>
      ): SignedRequest {
          val pairs = mutableListOf(
              "AccessKeyId" to accessKeyId,
              "SignatureMethod" to "HmacSHA256",
              "SignatureVersion" to "2",
              "Timestamp" to timestamp
          )
          val m = method.uppercase()
          if (m == "GET") {
              pairs.addAll(params.map { it.key to it.value })
          }
          pairs.sortWith { a, b -> a.first.compareTo(b.first) }
          val canonical = pairs.joinToString("&") {
              "${percentEncode(it.first)}=${percentEncode(it.second)}"
          }
          val stringToSign = "$m\n${host.lowercase()}\n$path\n$canonical"
          val mac = Mac.getInstance("HmacSHA256")
          mac.init(SecretKeySpec(secretKey.toByteArray(Charsets.UTF_8), "HmacSHA256"))
          val signature = Base64.getEncoder()
              .encodeToString(mac.doFinal(stringToSign.toByteArray(Charsets.UTF_8)))
          return SignedRequest(
              stringToSign,
              signature,
              canonical + "&Signature=" + percentEncode(signature),
          )
      }
    tests: |
      val host = "api.example-exchange.com"
      val ak = "test-access-key-0001"
      val sk = "test-secret-key-0001"
      val ts = "2017-05-11T15:19:30"
      val base4 = "AccessKeyId=test-access-key-0001&SignatureMethod=HmacSHA256&SignatureVersion=2&Timestamp=2017-05-11T15%3A19%3A30"

      check("percentEncode：unreserved 不編碼、空白 %20、保留字元大寫 hex") {
          percentEncode("") == "" && percentEncode("A-z_0.9~") == "A-z_0.9~" &&
              percentEncode("a b") == "a%20b" &&
              percentEncode("+/=:*") == "%2B%2F%3D%3A%2A"
      }

      check("percentEncode：非 ASCII 先轉 UTF-8 再逐 byte 編碼") {
          percentEncode("日") == "%E6%97%A5" && percentEncode("é") == "%C3%A9"
      }

      check("formatTimestamp：UTC、24 小時制、忽略毫秒") {
          formatTimestamp(1494516006000) == "2017-05-11T15:20:06" &&
              formatTimestamp(1494516006999) == "2017-05-11T15:20:06" &&
              formatTimestamp(0) == "1970-01-01T00:00:00" &&
              formatTimestamp(4102444799000) == "2099-12-31T23:59:59"
      }

      check(
          "GET：query 一起簽，Timestamp 的冒號編成 %3A，order-id 排在大寫開頭的參數之後",
      ) {
          val r = signRequest(
              "GET",
              host,
              "/v1/order/orders",
              ak,
              sk,
              ts,
              mapOf("order-id" to "1234567890"),
          )
          r.stringToSign ==
              "GET\napi.example-exchange.com\n/v1/order/orders\n$base4&order-id=1234567890" &&
              r.signature == "KLn4U/Au9BfxNEAqNebkXqZGpgjxOmyhMwOi+FmMfdg=" &&
              r.query ==
                  "$base4&order-id=1234567890&Signature=KLn4U%2FAu9BfxNEAqNebkXqZGpgjxOmyhMwOi%2BFmMfdg%3D"
      }

      check("POST：只簽 4 個認證參數（忽略 params），host 轉小寫、method 轉大寫") {
          val r = signRequest(
              "post",
              "API.Example-Exchange.com",
              "/v1/order/orders/place",
              ak,
              sk,
              ts,
              mapOf("symbol" to "btcjpy", "amount" to "1"),
          )
          r.stringToSign ==
              "POST\napi.example-exchange.com\n/v1/order/orders/place\n$base4" &&
              r.signature == "zwVrzld/U+nC8m9CEzxGWbX7TMyGsK6AgtkPFEHCOXM=" &&
              r.query ==
                  "$base4&Signature=zwVrzld%2FU%2BnC8m9CEzxGWbX7TMyGsK6AgtkPFEHCOXM%3D"
      }

      check("特殊字元：空白 %20、* → %2A、/ → %2F、~ 不編碼") {
          val r = signRequest("GET", host, "/v1/account/accounts", ak, sk, ts,
              mapOf("symbol" to "btc jpy", "note" to "a~b-c_d.e*f/g"))
          r.stringToSign ==
              "GET\napi.example-exchange.com\n/v1/account/accounts\n$base4&note=a~b-c_d.e%2Af%2Fg&symbol=btc%20jpy" &&
              r.signature == "vQgltpP9ItCkYjqTs2xwdKQSKchwSnAKRvDdsuTbSTk="
      }

      check("ASCII 排序（大寫在小寫之前）與非 ASCII 值") {
          val r = signRequest("GET", host, "/v1/account/accounts", ak, sk, ts,
              mapOf("alpha" to "2", "Zeta" to "1", "memo" to "日本 語"))
          r.signature == "p+Ap28XMr9xE48g0EG+HAiomvVL0xi8P8a8i8dbC12w=" &&
              r.query ==
                  "$base4&Zeta=1&alpha=2&memo=%E6%97%A5%E6%9C%AC%20%E8%AA%9E&Signature=p%2BAp28XMr9xE48g0EG%2BHAiomvVL0xi8P8a8i8dbC12w%3D"
      }

- id: exchange-api-signing-08
  type: open
  level: 2
  priority: P1
  tags: [signing, security]
  prompt: |
    如果要在 App 裡實作這套交易所的簽名請求（例如讓使用者匯入自己的 API 金鑰），你會怎麼設計簽名模組、怎麼測試、怎麼處理手機時間不準和金鑰保存？並說明你相關的實務經驗，以及到交易所的 App 你會怎麼做。
  promptJa: |
    アプリ内で取引所の署名付きリクエスト（たとえばユーザーが自分の API キーを取り込む機能）を実装する場合、署名モジュールをどう設計し、どうテストし、端末時刻のずれとキーの保管をどう扱いますか。関連する経験と、取引所アプリでどう進めるかも説明してください。
  keyPoints:
    - "簽名寫成純函式（輸入：method、host、path、參數、金鑰、timestamp；輸出：簽名字串、簽名、query），不依賴語言設定、時區、系統狀態"
    - "細節：ASCII 排序、RFC 3986 的大寫十六進位、空白 `%20`、Base64 的特殊字元要再編碼、GET 簽 query、POST 只簽 4 個認證參數"
    - "測試：固定的 test vector，用獨立的實作（Python 或 openssl）與雙平台交叉驗證；加上非 ASCII、保留字元、排序的案例"
    - "時間：`GET /v1/common/timestamp` 取得伺服器時間，算 offset，用單調時鐘計算經過的時間；回前景時重新校時；簽名失敗時重新校時並只重試一次"
    - "金鑰：不內嵌長期 Secret；若支援使用者匯入，存 Keychain（ThisDeviceOnly）或 Keystore 加密空間，使用時要求生物辨識，不進 log"
    - "權限與限流：只授予必要的權限（讀取、取引、出金），可綁定來源 IP；每個 API key 每秒 10 次"
    - "經驗連結：社交 App 的 token 過期時單一刷新、最多重試一次，登入憑證存 Keychain；行情分析 App 的 Android 用 Tink 加密、主金鑰放 Keystore"
  modelAnswer: |
    我會把簽名寫成純函式：輸入 method、host、path、參數、金鑰與 timestamp，輸出簽名字串、簽名和完整的 query，不依賴語言設定、時區或系統狀態。細節有幾個：參數名稱依 ASCII 排序；名稱與值依 RFC 3986 編碼，十六進位用大寫；空白是 `%20`，不是 `+`；Base64 簽名裡的 `+`、`/`、`=` 要再編碼；GET 要簽 query，POST 只簽四個認證參數。

    測試用固定的 test vector，並且用獨立的實作交叉驗證，例如 openssl，雙平台用同一組案例，另外加入非 ASCII、保留字元和排序的案例。

    時間方面，使用者手機時間不準，會讓簽名全部失敗，所以我用 `/v1/common/timestamp` 取得伺服器時間算 offset，經過的時間用單調時鐘計算，回前景時重新校時；簽名失敗時重新校時並只重試一次。金鑰的部分，App 不內嵌長期的 Secret；如果產品允許使用者匯入 API 金鑰，就存在 Keychain 的 ThisDeviceOnly 或 Keystore 加密空間，使用時要生物辨識，也不能進 log。

    相關的經驗是：在一個社交 App 的 iOS 端，token 過期時只讓一個請求去刷新、每個請求最多重試一次，登入憑證存在 Keychain；在一個行情分析 App 的 Android 端，把登入 cookie 用 Tink 加密，主金鑰放在 Keystore。到交易所的 App，簽名請求我會用同樣的原則來做。
  modelAnswerJa: |
    署名は純粋関数にします。入力は method、host、path、パラメータ、秘密鍵、timestamp で、出力は署名対象の文字列、署名、完成した query です。言語設定、タイムゾーン、システムの状態には依存させません。細かい点は次のとおりです。パラメータ名は ASCII 順にソートし、名前と値は RFC 3986 に従って、16 進数は大文字でエンコードします。空白は `+` ではなく `%20` です。Base64 の署名に含まれる `+`、`/`、`=` は再度エンコードします。GET は query も署名の対象にし、POST は 4 つの認証パラメータだけを署名します。

    テストは固定のテストベクターを使い、openssl などの独立した実装で相互に検証します。iOS と Android で同じケースを使い、非 ASCII、予約文字、ソート順のケースも加えます。

    時刻については、ユーザーの端末の時刻がずれていると署名がすべて失敗するため、`/v1/common/timestamp` でサーバー時刻を取得して offset を計算します。経過時間は単調増加のクロックで測り、フォアグラウンドに戻ったときは再校正します。署名に失敗したら再校正して、一度だけ再試行します。キーについては、長期の Secret はアプリに埋め込みません。ユーザーが API キーを取り込む機能がある場合は、Keychain の ThisDeviceOnly か Keystore で暗号化した領域に保存し、使うときは生体認証を求め、ログには出しません。

    関連する経験としては、ソーシャルアプリの iOS で、トークンの期限切れ時に更新するリクエストを 1 つに絞り、リクエストごとに再試行を最大 1 回にしていました。ログイン情報は Keychain に保存していました。相場分析アプリの Android では、ログイン用の cookie を Tink で暗号化し、マスターキーを Keystore に置いていました。取引所の署名付きリクエストでも、同じ考え方で進めます。
  followUps:
    - "簽名失敗時，怎麼判斷原因是手機時間不準、編碼錯誤，還是金鑰錯誤？"
    - "怎麼避免簽名字串被寫進 log？"
    - "Kronos 這類 NTP 函式庫，和交易所的伺服器時間，你會選哪個？為什麼？"
  timeLimitSec: 150

- id: exchange-api-signing-09
  type: flash
  level: 1
  priority: P1
  tags: [signing]
  front: Signature V2（Huobi 相容的交易所 API）的 5 個步驟與 3 個最常見的編碼錯誤
  back: |
    **5 個步驟**：(1) 4 個認證參數（GET 再加上 query，POST 只簽這 4 個）→ (2) 參數名稱依 ASCII 排序、名稱與值做 URL 編碼、用 `&` 連接 → (3) 組成 `METHOD\n小寫host\npath\nquery` → (4) HMAC-SHA256 再 Base64 → (5) `Signature` 再做 URL 編碼，附加在 query 最後。
    **Timestamp**：UTC 的 `yyyy-MM-ddTHH:mm:ss`（`:` 要編成 `%3A`）。**私有 WebSocket**：SignatureVersion 是 `2.1`、path 是 `/ws/v2`、參數名稱是小寫開頭的駝峰。
    **三個最常見的錯**：空白編成 `+`（要用 `%20`）；十六進位用小寫（要用大寫）；忘了編碼 `Signature` 裡的 `+`、`/`、`=`。另外不要用 Java 的 `URLEncoder` 和 Swift 的 `urlQueryAllowed`。
    **手機時間不準**：`GET /v1/common/timestamp` 取得伺服器時間 → 算 offset → 用單調時鐘計算經過的時間。
