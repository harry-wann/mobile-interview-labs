- id: exchange-business-101-01
  type: single
  level: 1
  priority: P0
  tags: [hanbaijo, torihikijo, spread]
  prompt: |
    假設某個幣種的販売所頁面標示「手續費 0 円」，同一個幣種在取引所有 maker／taker 手續費（掛單方／吃單方的手續費）。下列哪個說明最準確？
  options:
    - "販売所標示手續費 0 円，所以成本一定比取引所低"
    - "販売所是跟交易所自己買賣，成本藏在買價與賣價的差額（spread）裡，要和取引所的手續費加滑價一起比較"
    - "取引所的價格由交易所報價，販売所的價格由使用者之間撮合"
    - "兩者只有 UI 不同，後端都是同一個撮合引擎（把買單賣單配對的系統），成本結構相同"
  answer: 1
  explain: |
    販売所（店頭）是跟交易所自己買賣，畫面上有「購入價格」（你買進付的價）與「売却價格」（你賣出拿的價）兩個價，兩個價的差額就是 spread。例如購入 10,100,000 円、売却 9,900,000 円，買進後馬上賣掉就少了 200,000 円。就算手續費欄位是 0，使用者實際付出的仍然是這個 spread。
    取引所是板取引（使用者之間撮合），價格由訂單簿決定，成本是 maker／taker 手續費，加上成行單（市價單）吃板造成的滑價。
    - 第 1 項錯：手續費欄位是 0，不代表整體成本比較低，成本只是換了地方藏。
    - 第 3 項錯：說反了。報價的是販売所，由訂單簿決定價格的是取引所。
    - 第 4 項錯：兩者的資料來源和成交方式都不同。這套交易所 API 有獨立的販売所 WebSocket（`/retail/ws`），和一般行情的 WebSocket 分開，就是因為兩者本來就是不同的服務。

- id: exchange-business-101-02
  type: single
  level: 2
  priority: P0
  tags: [maker-taker, order-book]
  prompt: |
    取引所的賣板：最低賣價 10,000,000 円（數量 0.2 BTC），次低 10,010,000 円。使用者送出**指値買單** 0.5 BTC @ 10,005,000 円（一般指値，不是 post-only；post-only 是「只准掛單、不准吃單」的特殊選項）。結果是？
  options:
    - "整張單進買板成為 maker，完全不成交"
    - "0.5 BTC 全部以 10,010,000 円成交"
    - "先以 10,000,000 円吃掉 0.2 BTC（taker），剩下 0.3 BTC 以 10,005,000 円掛在買板（maker）"
    - "價格不在最佳賣價上，伺服器會拒單"
  answer: 2
  explain: |
    指値買單的價格只要不低於賣方最低的要價，就會立即成交。10,005,000 高於最低賣價 10,000,000，所以先吃掉 0.2 BTC，這一段是 taker（吃單），成交價是**板上的價格** 10,000,000，不是你的委託價。
    次低賣價 10,010,000 高於你的委託價，吃不到，所以剩下的 0.3 BTC 留在買板，這部分之後成交就是 maker（掛單）。結果是 PartiallyFilled（部分成交）。
    - 第 1 項錯：你的買價比最低賣價高，一送出就能成交，不會整張都在板上等。
    - 第 2 項錯：10,010,000 比你願意出的 10,005,000 還貴，你不會買；而且 0.2 BTC 會先以更便宜的 10,000,000 成交。
    - 第 4 項錯：指値單的價格不需要剛好等於最佳賣價，價格可以跨過對手價，跨過去的部分就直接成交。
    如果想確保整張都是 maker，需要 post-only（只准掛單、不准吃單）之類的選項，各家交易所是否提供不一定。

- id: exchange-business-101-03
  type: multi
  level: 2
  priority: P0
  tags: [hanbaijo, ux]
  prompt: |
    在 App 實作**販売所**的購入／売却（買進／賣出）畫面，下列哪些是一般會注意的重點？（複選）
  options:
    - "同時顯示購入價格（你買進付的價）與売却價格（你賣出拿的價），兩者不能顛倒，也不能只顯示其中一個"
    - "報價有有效時間：要做倒數，過期後重新取得報價，讓使用者重新確認"
    - "價格直接取取引所板的中間價顯示，App 自己算就好，不需要伺服器報價"
    - "確認畫面的價格和送出時伺服器的價格不同時，要明確提示（例如「価格が変動しました」）並要求重新確認"
    - "販売所也要用成行單的滑價警告，因為一樣是吃板"
  answer: [0, 1, 3]
  explain: |
    - 第 1 項對：兩個價格的差額（spread）就是使用者判斷成本的依據，缺一個或顛倒都會誤導使用者。
    - 第 2 項對：報價有時效是這類報價式交易的一般設計，過期後要重新報價，並且禁止用過期的價格送單。實際秒數與機制各家不同，面試時用「一般的做法」描述。
    - 第 3 項錯：販売所的價格是交易所報給你的，不是 App 從板上推算出來的。
    - 第 4 項對：價格在使用者按下確認的這幾秒內可能變動，要明確告訴使用者並重新確認，不能默默用新價格成交。
    - 第 5 項錯：販売所不是吃板（不是去吃別人掛在板上的單），沒有板深度造成的滑價，滑價警告是取引所成行單的功能。
    這套交易所 API 有獨立的販売所 WebSocket（`/retail/ws`），和取引所行情分開，也反映了兩者資料來源不同。

- id: exchange-business-101-04
  type: predict
  level: 2
  priority: P1
  tags: [partial-fill, order-book, decimal]
  prompt: |
    賣板（別人掛著要賣的單）有三層：10,000,000 円 × 0.2、10,010,000 円 × 0.3、10,030,000 円 × 0.5。使用者送出指値買單 0.6 BTC @ 10,010,000 円。下列程式依序印出什麼？（已成交數量、剩餘數量、平均成交價）
  codeLang: swift
  code: |
    import Foundation

    func D(_ s: String) -> Decimal { Decimal(string: s)! }

    struct Level { let price: Decimal; var qty: Decimal }

    var asks = [
        Level(price: D("10000000"), qty: D("0.2")),
        Level(price: D("10010000"), qty: D("0.3")),
        Level(price: D("10030000"), qty: D("0.5")),
    ]

    let limitPrice = D("10010000")
    var remaining = D("0.6")
    var cost = Decimal(0)
    for i in asks.indices where asks[i].price <= limitPrice && remaining > 0 {
        let take = min(remaining, asks[i].qty)
        cost += take * asks[i].price
        asks[i].qty -= take
        remaining -= take
    }
    let filled = D("0.6") - remaining
    print(filled)
    print(remaining)
    print(cost / filled)
  answer: |
    0.5 0.1 10006000
  explain: |
    迴圈的條件是「賣價不高於 10,010,000」，所以只會吃前兩層：
    - 第一層：0.2 BTC × 10,000,000 = 2,000,000 円
    - 第二層：0.3 BTC × 10,010,000 = 3,003,000 円
    - 合計花 5,003,000 円，已成交 0.5 BTC，平均成交價 5,003,000 ÷ 0.5 = 10,006,000 円。
    第三層 10,030,000 高於委託價，吃不到，所以還剩 0.1 BTC 沒買到，這 0.1 BTC 會留在買板（狀態是 PartiallyFilled，也就是部分成交；之後成交算 maker）。
    App 要顯示的是「已成交 0.5／剩餘 0.1／平均成交價 10,006,000」，而不是只有委託價。取消這張單只會取消剩下的 0.1 BTC，已經成交的 0.5 BTC 不會回復。

- id: exchange-business-101-05
  type: single
  level: 2
  priority: P0
  tags: [stop-order, order-types]
  prompt: |
    使用者持有 BTC，現價 10,000,000 円，想在跌到 9,500,000 円時停損賣出。下列哪個做法正確？
  options:
    - "賣出指値，價格 9,500,000 円，等價格跌下來就會成交"
    - "賣出逆指値，觸發價 10,500,000 円，因為停損要設在高於現價的位置"
    - "App 每秒比對最新價，跌破 9,500,000 円就由 App 送出成行賣單"
    - "賣出逆指値，觸發價 9,500,000 円；App 驗證觸發價低於現價，並標示用哪個價格判定觸發，觸發由伺服器負責"
  answer: 3
  explain: |
    - 第 1 項錯：賣出指値 9,500,000 在現價 10,000,000 時，你開的賣價比買方出的價還低，會**立刻成交**（而且是 taker），完全不是停損。
    - 第 2 項錯：賣出逆指値（價格到了才啟動的條件單）的觸發價應該**低於**現價。設成 10,500,000 會立即觸發（或被伺服器拒絕）。
    - 第 3 項錯：由 App 監看價格再下單，App 在背景、斷線、被系統關掉時就不會觸發，所以逆指値必須是伺服器端的條件單。
    - 第 4 項對：欄位分清楚「觸發價」與「委託價」（若觸發後轉成指値）、驗證方向，並標示用哪個價格來判定觸發（最新成交價或買賣價，各家不同，以該交易所的規格為準）。

- id: exchange-business-101-06
  type: multi
  level: 2
  priority: P1
  tags: [leverage, margin, risk]
  prompt: |
    交易所 App 要做槓桿交易畫面（槓桿＝用保證金做更大的買賣）。下列哪些設計是合理的？（複選）
  options:
    - "追証與ロスカット的門檻數字，直接沿用其他交易所的公開數字，反正法規一致"
    - "倍率輸入在 UI 與送單前驗證都擋在 2 倍以內（個人客戶的法規上限），伺服器仍會再驗證"
    - "維持率、評価損益、ロスカット價格以伺服器推送的值為準，畫面要即時更新"
    - "為了減少 API 呼叫，App 用最後一次價格推算維持率，並據此決定是否允許追加建倉"
    - "被強制平倉後，要用推播與畫面通知使用者，並在歷史中顯示平倉價格與損益"
  answer: [1, 2, 4]
  explain: |
    - 第 1 項錯：法規只規定倍率上限等基本框架，有沒有追証（補保證金的要求）、ロスカット（強制平倉）的水準，是各家自訂的，面試時不要背別家的數字。
    - 第 2 項對：2 倍上限是法規；UI 先擋住是為了使用者體驗，真正的檢查在伺服器。
    - 第 3 項對：保證金該怎麼算，以伺服器的結果為準，App 只負責顯示與提示風險。
    - 第 4 項錯：用過期的價格自己推算並做決策，會讓使用者在已經危險的時候看到安全的數字。
    - 第 5 項對：強制平倉對使用者影響最大，通知與事後說明是必要的。

- id: exchange-business-101-07
  type: order
  level: 1
  priority: P1
  tags: [withdrawal, travel-rule]
  prompt: |
    暗号資産「出庫」（提幣）流程，限定為「地址需事先登錄並經過審核」的版本。依正確順序排列。（實際畫面順序以各家 App 為準）
  items:
    - "登錄出庫地址：選擇網路，依トラベルルール申告對方是其他交易所還是自己的錢包"
    - "地址通過審核（承認）"
    - "選擇已承認的地址與幣種，顯示該網路的手續費與最小出庫量"
    - "輸入數量，App 預檢（可用餘額、最小量、數量精度）並顯示確認畫面"
    - "2FA（二階段驗證）／生物辨識確認後送出，狀態從審査中到處理中再到完了"
  explain: |
    這個版本的前提是「地址要先登錄並審核」：登錄與審核要等一段時間才有結果（非同步），所以排在輸入數量之前；已承認的地址之後可以重複使用。
    網路選錯（例如同一種幣有好幾條區塊鏈可以轉帳）是最常見也最難挽回的錯誤，在登錄地址時就要選定，並在確認畫面再次顯示網路名稱。若流程是「先輸入數量再臨時填地址」，順序會不同，各家與各幣種的設計也不一樣，所以題目限定了前提。
    最後的 2FA 或生物辨識一定放在送出之前，因為出庫送出後幾乎無法撤回。數量的預檢只是 App 端的預估，伺服器仍會再驗證，手續費與實際到帳以處理結果為準。

- id: exchange-business-101-08
  type: open
  level: 2
  priority: P0
  tags: [hanbaijo, torihikijo, ux, architecture]
  prompt: |
    請說明販売所與取引所在 **App 上的 UX（使用者體驗）與技術實作**有什麼差異？
  promptJa: |
    販売所と取引所では、アプリ上の UX と技術実装（データ取得、状態管理、エラー処理）にどのような違いがありますか。
  keyPoints:
    - "交易對手不同：販売所顯示買價與賣價兩個報價，成本是 spread；取引所是訂單簿，成本是 maker／taker 手續費加滑價"
    - "販売所是「報價、確認、成交」，報價有時效，要做倒數與重新報價；取引所要做板、成交明細、K 線與各種注文類型"
    - "資料來源：公開 API 有獨立的販売所 WebSocket（`/retail/ws`），和取引所的 depth（板的深度）／bbo（最佳買賣價）／trade（成交）分開"
    - "取引所行情是 gzip 壓縮的二進位資料，要處理 ping／pong（心跳）、重連與重新訂閱；每秒更新很多次的畫面要限制刷新頻率，或只更新有變動的部分，避免整頁重繪"
    - "訂單狀態：取引所有 New、PartiallyFilled（部分成交）、Filled（全部成交）、Cancelled（已取消），取消與成交可能同時發生，以伺服器推送為準"
    - "輸入驗證：取引所要對齊 tick size、step size（價格、數量的最小跳動單位）與最小下單量；販売所多是金額或數量加額度限制"
    - "行情斷線時要禁止用過期價格下單，或明確標示資料已過期"
  modelAnswer: |
    先從「跟誰買賣」說起。販売所是跟交易所自己買賣，畫面上有買價與賣價兩個報價，成本藏在兩個價的差額（spread）裡；取引所是使用者之間的板取引，成本是 maker／taker 手續費（掛單方／吃單方的手續費）加成行單（市價單）的滑價。這會直接影響 App：

    1. **UI**：販売所是「報價、確認、成交」，報價有時效，要做倒數與重新報價；取引所要做訂單簿、成交明細、K 線、各種注文類型，以及部分約定（只成交一部分）的顯示。
    2. **資料**：這套交易所 API 有獨立的販売所 WebSocket，和取引所的 depth（板的深度）、bbo（最佳買賣價）、trade（成交）分開。取引所的行情是 gzip 壓縮的二進位資料，要處理 ping／pong（心跳）、重連、重新訂閱；每秒更新很多次的畫面要限制刷新頻率，或只更新有變動的部分，不要整頁重繪。
    3. **狀態與錯誤**：取引所的訂單有 New、PartiallyFilled、Filled、Cancelled 這幾種狀態，取消和成交可能同時發生，一律以伺服器推送為準；販売所的主要錯誤是報價過期和額度不足。
    4. **驗證**：取引所要對齊 tick size、step size（價格、數量的最小跳動單位）與最小下單量。

    即時資料的連線管理，我在一個即時行情 App 的 K 線（用 SSE，伺服器單向推送資料的 HTTP 串流）和一個社交 App 的聊天室（用 Socket.IO）都做過，包含斷線重連和 App 進出背景時的處理。金額精度的部分，前一個行情分析 App 只顯示資料，App 端沒有金額運算；到交易所，金額的路徑我會改用 Decimal（十進位小數，不會有浮點誤差），用字串解析、數量往下捨入。
  modelAnswerJa: |
    まず相手方の違いから整理します。販売所は取引所自身が相手方で、購入価格と売却価格の 2 つを提示し、コストはスプレッド（売買価格の差額）に含まれます。取引所は板取引で、コストはメイカー・テイカー手数料と成行注文のスリッページです。アプリへの影響は次の 4 点です。

    1. **UI**：販売所は「見積もり、確認、約定」の流れで、見積もりに有効時間があるため、カウントダウンと再見積もりが必要です。取引所は板、約定履歴、チャート、各種注文、部分約定の表示が必要です。
    2. **データ**：公開 API には販売所専用の WebSocket があり、取引所の depth（板の深さ）や bbo（最良気配）、trade（約定）とは別です。取引所側は gzip で圧縮されたバイナリのデータを扱い、ping/pong（ハートビート）、再接続と再購読が必要です。高頻度で更新される画面は、更新頻度を制限するか、変化した部分だけを更新して、画面全体の再描画を避けます。
    3. **状態とエラー**：取引所の注文は New、PartiallyFilled、Filled、Cancelled の状態を持ち、取消と約定が同時に起こり得るため、サーバーからの通知を正とします。販売所では見積もりの期限切れや限度額超過が主なエラーです。
    4. **入力検証**：取引所では tick size、step size（価格・数量の最小単位）、最小注文数量に合わせます。

    リアルタイムデータの接続管理は、リアルタイム相場アプリのローソク足（SSE）とソーシャルアプリのチャット（Socket.IO）で経験があり、再接続やバックグラウンドの出入りの処理も行いました。金額の精度については、以前のアプリは閲覧専用の分析アプリで、アプリ側に金額の計算はありませんでした。取引所の金額の経路では Decimal を使い、文字列でパースして、数量は切り捨てにします。
  followUps:
    - "販売所で見積もりが期限切れになったとき、UI はどう振る舞うべき？"
    - "板の更新が秒間数十回来る場合、画面側でどう間引く？"
    - "取消ボタンを押した直後に約定通知が来たらどう表示する？"
  timeLimitSec: 120

- id: exchange-business-101-09
  type: open
  level: 2
  priority: P0
  tags: [travel-rule, withdrawal, kyc, security]
  prompt: |
    トラベルルール（旅行規則）會讓暗号資産的**出庫流程**多出哪些步驟？從 App 工程師的角度，你會怎麼設計？
  promptJa: |
    トラベルルールにより、暗号資産の出庫フローにはどのようなステップが加わりますか。アプリエンジニアの立場から、どう設計しますか。
  keyPoints:
    - "2023 年 6 月起，交易所之間轉帳要交換送方與收方資訊"
    - "出庫地址登錄要多一步申告：目的地是其他交易所還是自己的錢包，其他交易所要選名稱"
    - "地址需要審核，出庫變成多步驟、非同步的流程，要畫出審査中／承認／否認的狀態並用推播通知結果"
    - "錯誤文案要具體：網路選錯、地址格式錯誤、缺 memo／tag（部分幣種轉帳時要加填的備註欄位）、審核不通過"
    - "安全：2FA（二階段驗證）或生物辨識確認，地址完整顯示讓使用者核對；新增地址是否要冷卻時間（新增後隔一段時間才能出庫）要向產品確認"
    - "工程：當成狀態機，App 被系統終止後重新開啟，也能回到正確的步驟；記錄不含敏感資料的事件給客服查詢"
  modelAnswer: |
    トラベルルール（旅行規則）是 2023 年 6 月起的規定，為了防制洗錢，交易所之間轉帳時要交換送方與收方的資訊。對出庫流程的影響：

    1. **地址登錄多一步申告**：目的地是其他交易所還是自己的錢包；如果是其他交易所要選名稱。
    2. **審核要等一段時間**：地址要審核，所以出庫變成多步驟流程，結果不是馬上有。App 要把「審査中（審核中）、承認（通過）、否認（不通過）」畫出來並推播結果，不然使用者會以為卡住。
    3. **錯誤文案要具體**：網路選錯、地址格式錯誤、缺 memo／tag、審核未通過的原因。
    4. **安全**：2FA 或生物辨識確認、完整顯示地址讓使用者核對。新增地址後要不要冷卻時間，我會向產品和法遵確認，不會自己決定。
    5. **工程面**：把它當成狀態機（把流程拆成幾個狀態，並規定每個狀態遇到什麼事件會換到哪個狀態），App 被系統終止後重新開啟，也能回到正確的步驟，並記錄不含敏感資料的事件，方便客服查詢。

    這種多步驟、要等伺服器確認的流程，我在一個社交 App 處理過 WalletConnect 簽名綁定錢包，以及 IAP（In-App Purchase，App 內購）在付款與伺服器授權之間的狀態，邊界情況的思路是一樣的，我會用同樣的方式設計出庫流程。
  modelAnswerJa: |
    トラベルルールは 2023 年 6 月から適用され、マネーロンダリング対策として、取引所間の送付時に送付人と受取人の情報を交換する必要があります。出庫フローへの影響は次のとおりです。

    1. **出庫先アドレスの登録で申告が増えます**：宛先が他の取引所か自己管理ウォレットかを選び、他の取引所なら事業者名も選びます。
    2. **審査は非同期です**：アドレスの審査があるため、出庫は複数ステップの非同期フローになります。「審査中、承認、否認」を画面に出し、結果をプッシュ通知しないと、ユーザーは止まっていると感じてしまいます。
    3. **エラーメッセージは具体的に**：ネットワークの選択ミス、アドレス形式の誤り、memo/tag の漏れ、審査不承認の理由などです。
    4. **セキュリティ**：2FA や生体認証での確認、アドレスを全文表示して照合できるようにします。新規アドレスの追加後にクーリング期間を設けるかは、プロダクトとコンプライアンスに確認します。
    5. **実装面**：状態機械（フローをいくつかの状態に分け、各状態でどのイベントが起きたらどの状態に移るかを決めたもの）として扱い、アプリがシステムに終了されたあとでも正しいステップに復帰できるようにします。機密情報を含まないイベントを記録し、カスタマーサポートが調査できるようにします。

    このような複数ステップでサーバーの確認を待つフローは、ソーシャルアプリで WalletConnect の署名によるウォレット連携や、IAP（アプリ内課金）の決済とサーバー付与の間の状態管理を担当した際に扱いました。境界ケースの考え方は同じなので、出庫フローも同じ方針で設計します。
  followUps:
    - "出庫先アドレスの審査に数時間かかる場合、画面と通知をどう設計する？"
    - "アドレスの入力ミス（1 文字違い）をアプリ側で防ぐには？"
    - "ユーザーがアプリを kill した後に審査結果が出たらどうなる？"
  timeLimitSec: 120

- id: exchange-business-101-10
  type: flash
  level: 1
  priority: P0
  tags: [hanbaijo, torihikijo]
  front: 販売所（店頭）與取引所（板取引）的差別是什麼？App 各要注意什麼？
  back: |
    販売所：跟交易所自己買賣，顯示購入／売却兩個報價，成本是 **spread**（買賣價差）；App 要做報價倒數、重新報價、價格變動提示。
    取引所：使用者之間的板取引，成本是 **maker／taker 手續費＋滑價**；App 要做板、部分約定（只成交一部分）、注文種類（下單類型）與 tick size／step size（價格、數量的最小跳動單位）驗證。

- id: exchange-business-101-11
  type: flash
  level: 1
  priority: P0
  tags: [order-types]
  front: 成行／指値／逆指値／OCO／IFD／IFDOCO 各是什麼？
  back: |
    - **成行**：市價單，不指定價格，吃板（吃掉板上的掛單），有滑價。
    - **指値**：限價單；價格跨過對手價會立即成交（那部分是 taker）。
    - **逆指値**：價格到了**觸發價**才送出實際委託，由伺服器判定，App 關掉也生效。
    - **OCO**：兩張單二選一，一張成交另一張就取消（指値＋逆指値）。
    - **IFD**：第一張成交後才送出第二張。
    - **IFDOCO**：進場成交後，第二段是 OCO（同時掛停利、停損）。
    實際提供哪些，依各家交易所而定。

- id: exchange-business-101-12
  type: flash
  level: 1
  priority: P0
  tags: [leverage, margin]
  front: 追証、ロスカット、証拠金維持率、個人槓桿上限
  back: |
    - **証拠金維持率**＝有効証拠金（保證金加浮動損益）÷ 必要証拠金（維持部位所需的最低保證金），是一般的定義。
    - **追証**：維持率降到警戒線時要求補保證金；**ロスカット**：跌破門檻時由系統強制平倉。門檻與有無追証依業者而定。
    - 個人客戶槓桿上限 **2 倍**。
    - App：UI 與送單前擋倍率上限，維持率與ロスカット價格以伺服器的值為準，強制平倉後要通知。
