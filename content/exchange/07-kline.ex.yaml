  priority: P0
  tags: [aggregation, ohlcv, timezone]
  timeLimitSec: 1500
  prompt: |
    實作 `aggregate(trades, periodSec, originOffsetSec)`：把成交聚合成 K 線。價格是日圓整數，數量是 1e-8 BTC 的整數（`qty = 100_000_000` 代表 1 BTC），兩者都用 `Int64`，避免浮點數的誤差。

    - 輸入可能**亂序**，也可能含**重複**的成交
    - K 線起點（UTC 秒）＝ `floorDiv(秒 + originOffsetSec, periodSec) × periodSec − originOffsetSec`，其中 `秒 = floorDiv(tsMs, 1000)`。`originOffsetSec` 是日界相對 UTC 的偏移秒數：UTC 是 0，UTC+8 是 28800，JST 是 32400
    - 先依 `(tsMs, id)` 排序再處理：`open` 是最早的一筆、`close` 是最晚的一筆；`high`／`low` 是最大／最小價；`amount` ＝ Σ`qty`；`vol` ＝ Σ`price × qty`；`count` ＝ 筆數
    - 相同 `id` 的成交只算一次（保留第一次出現的）。這裡的 `id` 對應 API 文件的 `tradeId`（REST 是 `trade-id`），不是 27 位數的逐筆 `id`
    - `price <= 0` 或 `qty <= 0` 的成交視為無效，略過
    - 只輸出「有成交」的 K 線（不補空的），依起點由小到大排序
    - `periodSec <= 0` 時回傳空陣列
  hints:
