- id: exchange-kline-01
  type: single
  level: 1
  priority: P0
  tags: [kline, fields]
  prompt: |
    這套交易所 API 的 K 線資料（REST 和 WebSocket 的 `tick`）有 `id`、`open`、`close`、`low`、`high`、`amount`、`vol`、`count` 這幾個欄位。文件的日 K 範例是 `{"id": 1632931200, "amount": 6.634525507825414, "vol": 31208129.2684, "count": 7534, "low": 4580081, "high": 4830000, ...}`（btcjpy）。下列哪個解讀正確？
  options:
    - "`id` 是毫秒時間戳記；`amount` 是成交金額；`vol` 是成交筆數"
    - "`id` 是這根 K 線的起點時間（單位秒）；`amount` 是標的數量（BTC）；`vol` 是計價金額（JPY）；`count` 是成交筆數"
    - "`amount` 和 `vol` 是同一個值的兩種名稱，畫面上任選一個顯示就好"
    - "`id` 是這根 K 線的收盤時間（單位毫秒）"
  answer: 1
  explain: |
    可以用範例反推：`vol ÷ amount ≈ 31,208,129 ÷ 6.63 ≈ 4.70M`，這個數字落在當根的 `low`（4,580,081）和 `high`（4,830,000）之間，正是這段時間的平均成交價。所以 `vol` 是以日圓計的成交金額，`amount` 是 BTC 的數量，`count` 是成交筆數。
    - 第 1 項錯：`id` 不是毫秒（把 `1632931200` 當毫秒，會得到 1970 年 1 月），而且 `amount` 和 `vol` 的意思也說反了。
    - 第 3 項錯：兩者的單位不同，一個是 BTC、一個是日圓，差好幾個數量級。顯示「成交量」時要標清楚單位。
    - 第 4 項錯：`id` 是這根 K 線的**起點**時間，不是收盤時間，單位也是秒，不是毫秒。

- id: exchange-kline-02
  type: single
  level: 2
  priority: P0
  tags: [timezone, day-boundary]
  prompt: |
    這套 API 文件的日 K 範例（`period=1day`）回傳兩根 K 線，`id` 分別是 `1632931200` 和 `1632844800`（資料時間是 2021 年）。你要在 App 裡自己用成交聚合日 K，讓最後一根在兩次推送之間也能更新。下列哪個結論與做法最合理？
  options:
    - "日界一定是日本時間（JST）的 0 點，本機聚合直接用 `TimeZone(identifier: \"Asia/Tokyo\")` 的 `startOfDay`"
    - "日界一定是 UTC 的 0 點，因為時間戳記都是 UTC"
    - "兩個 `id` 對 86400 取餘數都是 57600，也就是 16:00 UTC（UTC+8 的 00:00、JST 的 01:00），所以範例資料的日界既不是 JST 的 0 點，也不是 UTC 的 0 點；日界不寫死，畫伺服器的 K 線一律使用回傳的 `id`，本機聚合的原點做成設定並向交易所確認，現行規則（未證實）"
    - "`id` 有誤差，應該把它四捨五入到最近的 JST 0 點再畫"
  answer: 2
  explain: |
    `1632931200 mod 86400 = 57600`，也就是一天的第 16 小時，所以這根日 K 從 16:00 UTC 開始，等於 UTC+8 的午夜。這是**從 2021 年的範例資料推得**的結論，現行的日界規則、週 K 和月 K 的起點都（未證實）。
    - 第 1 項錯：範例資料的日界不是 JST 的 0 點，直接用日本時間的 `startOfDay` 聚合，會和伺服器的 K 線差 1 小時（JST 的 0 點是 15:00 UTC）。
    - 第 2 項錯：時間戳記都是 UTC，不代表日界就在 UTC 的 0 點，日界是資料來源自己定的規則。
    - 第 4 項錯：`id` 沒有誤差，它就是伺服器定義的起點，四捨五入到別的日界，圖表會和官方、網頁版對不上。
    實務做法：伺服器給的 K 線用它的 `id`；只有本機聚合才需要自己決定原點，而且必須和伺服器一致。顯示時區（日本時間或裝置時區）是另一個決定，不要和資料的日界混在一起。

- id: exchange-kline-03
  type: predict
  level: 2
  priority: P0
  tags: [bucket, timezone, swift]
  prompt: |
    一筆成交發生在 `1632929400`（2021-09-29 15:30:00 UTC）。下列程式依序印出什麼？（`1632931200` 是文件範例中一根日 K 的 `id`。）
  codeLang: swift
  code: |
    func bucketStart(_ tsSec: Int64, period: Int64, offset: Int64) -> Int64 {
        return (tsSec + offset) / period * period - offset
    }

    // 2021-09-29 15:30:00 UTC
    let t: Int64 = 1_632_929_400
    for off in [0, 28_800, 32_400] as [Int64] {
        print(bucketStart(t, period: 86_400, offset: off))
    }
  answer: |
    1632873600 1632844800 1632927600
  explain: |
    `bucketStart` 算的是這筆成交所屬那根 K 線的起點時間；`offset` 是日界相對 UTC 的偏移秒數。
    - `offset = 0`（日界在 UTC 的 0 點）：起點是 `1632873600`，也就是 2021-09-29 00:00 UTC。
    - `offset = 28800`（日界在 UTC+8 的 0 點）：這筆成交在 UTC+8 是 9/29 23:30，所屬那根日 K 的起點是 `1632844800`（9/28 16:00 UTC），也就是文件範例第二根 K 線的 `id`；再過 30 分鐘就會落到 `1632931200` 那一根。
    - `offset = 32400`（日界在 JST 的 0 點）：這筆成交在 JST 是 9/30 00:30，起點是 `1632927600`（9/29 15:00 UTC）。
    同一筆成交，在三種日界下落在三根不同的日 K，這就是日界不能寫死的原因。這裡的 `/` 是一般除法（往 0 取整），時間為正時和 floor 除法的結果相同；時間可能是負數時，要改用 floor 除法。

- id: exchange-kline-04
  type: multi
  level: 2
  priority: P1
  tags: [aggregation, ohlcv]
  prompt: |
    把成交聚合成 OHLCV（開高低收量）K 線時，哪些做法正確？（複選）
  options:
    - "`open` 是區間內時間最早的成交價、`close` 是時間最晚的；時間相同時，用成交編號（`tradeId`）決定先後"
    - "收到的成交陣列的第一筆就是 `open`、最後一筆就是 `close`，不需要排序"
    - "`vol`（計價金額）是 Σ（價格 × 數量），`amount` 是數量的加總，兩者不能混為一談"
    - "重連或補資料時可能重送相同的成交，要用成交編號去重（WebSocket 的 `tradeId`、REST 的 `trade-id`；逐筆資料的 `id` 是 27 位數，超出 `Int64` 和 `Double` 能精確表示的範圍，不適合拿來去重），否則 `count` 和 `vol` 會重複計算"
    - "毫秒轉秒、算 K 線起點時用 floor 除法；一般除法在值為負時會往 0 取整，邊界會錯一格"
    - "遲到的成交屬於已收盤的 K 線時，可以悄悄修改那根的 `close`，圖表不需要被通知"
  answer: [0, 2, 3, 4]
  explain: |
    - 第 1 項正確：資料可能亂序，所以要依（時間, 成交編號）排序，決定先後。
    - 第 2 項錯：資料可能亂序（重連補資料時常見），陣列的第一筆不一定是時間最早的，不能用陣列順序決定 `open` 和 `close`。
    - 第 3 項正確：`vol` 是金額，`amount` 是數量，單位不同。
    - 第 4 項正確：去重要用 `tradeId`（REST 是 `trade-id`）。逐筆的 `id` 是 27 位數，一般 JSON 解析會失真；文件的 REST 範例裡，兩筆不同的成交甚至有相同的 `id`，要當字串解析，或乾脆不用。
    - 第 5 項正確：負的時間或偏移後的邊界，用一般除法會往 0 取整，結果錯一格。
    - 第 6 項錯：遲到的成交，嚴格的做法是重算那一根並通知圖表更新，或忽略並以伺服器的 K 線為準。悄悄修改會讓畫面顯示和歷史資料不一致。
    補充：本機聚合只是補足伺服器 K 線的空檔，伺服器的 K 線才是權威，不要把兩種來源混在同一根 K 線裡。

- id: exchange-kline-05
  type: single
  level: 2
  priority: P1
  tags: [ema, incremental]
  prompt: |
    最後一根 K 線還在進行中，每個 tick（一次價格更新）都會改變收盤價。你為了省事，在每個 tick 都執行 `prevEma = prevEma + k * (price - prevEma)`，並把結果存回 `prevEma`。這會有什麼問題？正確做法是什麼？
  options:
    - "沒有問題，EMA 本來就是遞迴計算，每個 tick 套用一次是正確的"
    - "每個 tick 都把進行中的價格再計入一次，EMA 被「這根 K 線內的 tick 次數」放大；應該保留上一根「已收盤」的 EMA 當 prev，進行中的顯示值 ＝ prevClosed ＋ k ×（price − prevClosed），只在 K 線收盤（`id` 變了）時，才把最後的值固定成新的 prev"
    - "問題只是浮點數的誤差，改用 Decimal 就會正確"
    - "應該在每個 tick 都從頭重算整段歷史的 EMA，這是唯一正確的方法"
  answer: 1
  explain: |
    EMA 每根 K 線只應該更新一次。進行中的值是「用目前價格暫時算出來的」，不是新的狀態。把它寫回去，同一根 K 線內的每個 tick 都會再計入一次，結果越來越趨近當前價格，而不是真正的 EMA。
    - 第 1 項錯：遞迴計算的前提是每個週期只套用一次，每個 tick 都套用，就重複計入了。
    - 第 3 項錯：問題在邏輯，不是精度。改用 Decimal，一樣會被重複計入。
    - 第 4 項錯：從頭重算整段歷史雖然結果正確，但沒有必要；只要保存上一根已收盤的值，單步計算就夠了。
    RSI 的 Wilder 平滑也是同樣的道理：進行中的值用已收盤的平均漲幅、平均跌幅計算，收盤時才更新平均值。

- id: exchange-kline-06
  type: multi
  level: 3
  priority: P1
  tags: [webview, lightweight-charts, bridge]
  prompt: |
    在 WKWebView 或 Android WebView 裡，用 TradingView Lightweight Charts 畫交易所的 K 線，下列哪些做法正確？（複選）
  options:
    - "`update` 的時間必須大於或等於最後一根；記住最後推送的時間，跳過比它舊的，並對每次 `update` 加上 `try/catch`"
    - "資料用 JSON 傳遞（例如 iOS 的 `callAsyncJavaScript` 的 `arguments`，或 JSON 字串再 `JSON.parse`），而不是把 Double 用字串插值塞進 JavaScript 程式碼，因為 `NaN` 和無限大會變成 JavaScript 不認得的文字"
    - "把所有時間加上「現在」的 UTC 偏移是最好的做法，不會有任何副作用"
    - "圖表的 JavaScript 打包進 App 並固定版本，避免 CDN 離線或被擋住時圖表空白，也降低供應鏈風險"
    - "WebView 負責渲染網頁的行程可能被系統終止（iOS 的 `webViewWebContentProcessDidTerminate`、Android 的 `onRenderProcessGone`），要偵測並重建，重新 `setData`"
    - "每個 tick 都呼叫 `setData` 重設整個資料集，這樣最簡單，效能與 `update` 沒有差別"
  answer: [0, 1, 3, 4]
  explain: |
    - 第 1 項正確：`update` 的時間倒退會丟出例外，沒擋住的話，圖表會悄悄停止更新。前景回來合併補資料時，要把「自上次推送以來的所有 K 線」依序推完，才不會在中間留下洞。
    - 第 2 項正確：字串插值會把 `NaN` 變成 `nan`、無限大變成 `inf`，JavaScript 不認得這兩個字，會丟 `ReferenceError`；字串內含引號時還會破壞語法。
    - 第 3 項錯：偏移是「現在」的，橫跨夏令時間的歷史會錯 1 小時，而且資料裡的時間不再是真正的 epoch。比較乾淨的做法是資料保持 UTC，用圖表的格式化選項（`localization.timeFormatter`、`timeScale.tickMarkFormatter`，名稱以所用版本的文件為準）顯示成目標時區。日本沒有夏令時間，所以簡單的位移通常可行，但不是沒有副作用。
    - 第 4 項正確：腳本來自 CDN，離線或被擋住時圖表就是一片空白，也多了供應鏈風險。
    - 第 5 項正確：渲染行程被終止後畫面會變白，要偵測並重建 WebView、重新 `setData`。
    - 第 6 項錯：`setData` 會重設整個資料序列與縮放狀態，高頻情況下比 `update` 貴很多，也會打斷使用者的縮放和十字線。

- id: exchange-kline-07
