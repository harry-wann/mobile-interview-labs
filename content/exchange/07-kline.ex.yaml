    solution: |
      fun ema(closes: List<Double>, period: Int): List<Double?> {
          val out = MutableList<Double?>(closes.size) { null }
          if (period <= 0 || closes.size < period) {
              return out
          }
          val k = 2.0 / (period + 1)
          var prev = closes.subList(0, period).sum() / period
          out[period - 1] = prev
          for (i in period until closes.size) {
              prev += k * (closes[i] - prev)
              out[i] = prev
          }
          return out
      }

      fun rsi(closes: List<Double>, period: Int): List<Double?> {
          val out = MutableList<Double?>(closes.size) { null }
          if (period <= 0 || closes.size <= period) {
              return out
          }

          fun value(gain: Double, loss: Double): Double =
              if (loss == 0.0) {
                  100.0
              } else {
                  100.0 - 100.0 / (1.0 + gain / loss)
              }
          var avgGain = 0.0
          var avgLoss = 0.0
          for (i in 1..period) {
              val d = closes[i] - closes[i - 1]
              if (d > 0) {
                  avgGain += d
              } else {
                  avgLoss -= d
              }
          }
          avgGain /= period
          avgLoss /= period
          out[period] = value(avgGain, avgLoss)
          for (i in period + 1 until closes.size) {
              val d = closes[i] - closes[i - 1]
              val gain = if (d > 0) d else 0.0
              val loss = if (d < 0) -d else 0.0
              avgGain = (avgGain * (period - 1) + gain) / period
              avgLoss = (avgLoss * (period - 1) + loss) / period
              out[i] = value(avgGain, avgLoss)
          }
          return out
      }
