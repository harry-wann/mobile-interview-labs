    solution: |
      struct Trade {
          let id: Int64
          let tsMs: Int64
          let price: Int64
          let qty: Int64
      }

      struct Candle: Equatable {
          var start: Int64
          var open: Int64
          var high: Int64
          var low: Int64
          var close: Int64
          var amount: Int64
          var vol: Int64
          var count: Int
      }

      func floorDiv(_ a: Int64, _ b: Int64) -> Int64 {
          let q = a / b
          return (a % b != 0 && (a < 0) != (b < 0)) ? q - 1 : q
      }

      func aggregate(
          _ trades: [Trade],
          periodSec: Int64,
          originOffsetSec: Int64
      ) -> [Candle] {
          guard periodSec > 0 else { return [] }
          var seen = Set<Int64>()
          var valid: [Trade] = []
          for t in trades where t.price > 0 && t.qty > 0 {
              if seen.insert(t.id).inserted {
                  valid.append(t)
              }
          }
          valid.sort { ($0.tsMs, $0.id) < ($1.tsMs, $1.id) }

          var result: [Candle] = []
          for t in valid {
              let sec = floorDiv(t.tsMs, 1000)
              let start = floorDiv(
                  sec + originOffsetSec,
                  periodSec
              ) * periodSec - originOffsetSec
              if var last = result.last, last.start == start {
                  last.high = max(last.high, t.price)
                  last.low = min(last.low, t.price)
                  last.close = t.price
                  last.amount += t.qty
                  last.vol += t.price * t.qty
                  last.count += 1
                  result[result.count - 1] = last
              } else {
                  result.append(
                      Candle(
                          start: start,
                          open: t.price,
                          high: t.price,
                          low: t.price,
                          close: t.price,
                          amount: t.qty,
                          vol: t.price * t.qty,
                          count: 1
                      )
                  )
              }
          }
          return result
      }
    tests: |
      // 2021-09-29 16:00:00 UTC（文件範例中一根日 K 的 id × 1000）
      let B: Int64 = 1_632_931_200_000
      func tr(_ id: Int64, _ ms: Int64, _ p: Int64, _ q: Int64) -> Trade {
          Trade(id: id, tsMs: ms, price: p, qty: q)
      }

      check("亂序輸入：open／close 依時間決定，其餘欄位正確") {
          let trades = [
              tr(11, B + 40_000, 4_800_000, 20_000_000),
              tr(10, B + 5_000, 4_790_000, 10_000_000),
              tr(12, B + 55_000, 4_810_000, 5_000_000),
              tr(13, B + 20_000, 4_780_000, 30_000_000),
          ]
          let expected = [
              Candle(
                  start: 1_632_931_200,
                  open: 4_790_000,
                  high: 4_810_000,
                  low: 4_780_000,
                  close: 4_810_000,
                  amount: 65_000_000,
                  vol: 311_350_000_000_000,
                  count: 4
              )
          ]
          return aggregate(trades, periodSec: 60, originOffsetSec: 0) == expected
      }

      checkEqual(
          "跨桶：依起點遞增排序，沒有成交的桶不輸出",
          [
              Candle(
                  start: 1_632_931_200,
                  open: 4_800_000,
                  high: 4_800_000,
                  low: 4_800_000,
                  close: 4_800_000,
                  amount: 10_000_000,
                  vol: 48_000_000_000_000,
                  count: 1
              ),
              Candle(
                  start: 1_632_931_320,
                  open: 4_820_000,
                  high: 4_830_000,
                  low: 4_820_000,
                  close: 4_830_000,
                  amount: 30_000_000,
                  vol: 144_800_000_000_000,
                  count: 2
              ),
          ]
      ) {
          aggregate([
              tr(21, B + 130_000, 4_820_000, 10_000_000),
              tr(20, B + 10_000, 4_800_000, 10_000_000),
              tr(22, B + 135_000, 4_830_000, 20_000_000),
          ], periodSec: 60, originOffsetSec: 0)
      }

      checkEqual(
          "同一毫秒的成交用 id 決定先後",
          [
              Candle(
                  start: 1_632_931_200,
                  open: 4_800_000,
                  high: 4_810_000,
                  low: 4_800_000,
                  close: 4_805_000,
                  amount: 40_000_000,
                  vol: 192_150_000_000_000,
                  count: 3
              ),
          ]
      ) {
          aggregate([
              tr(2, B + 1_000, 4_810_000, 10_000_000),
              tr(1, B + 1_000, 4_800_000, 20_000_000),
              tr(3, B + 1_000, 4_805_000, 10_000_000),
          ], periodSec: 60, originOffsetSec: 0)
      }

      checkEqual(
          "重複的成交 id 只算一次",
          [
              Candle(
                  start: 1_632_931_200,
                  open: 4_800_000,
                  high: 4_810_000,
                  low: 4_800_000,
                  close: 4_810_000,
                  amount: 20_000_000,
                  vol: 96_100_000_000_000,
                  count: 2
              ),
          ]
      ) {
          aggregate([
