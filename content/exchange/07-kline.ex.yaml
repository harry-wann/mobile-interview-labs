    solution: |
      data class Trade(val id: Long, val tsMs: Long, val price: Long, val qty: Long)

      data class Candle(
          val start: Long,
          val open: Long,
          val high: Long,
          val low: Long,
          val close: Long,
          val amount: Long,
          val vol: Long,
          val count: Int,
      )

      fun aggregate(
          trades: List<Trade>,
          periodSec: Long,
          originOffsetSec: Long,
      ): List<Candle> {
          if (periodSec <= 0) {
              return emptyList()
          }
          val seen = HashSet<Long>()
          val valid = ArrayList<Trade>()
          for (t in trades) {
              if (t.price > 0 && t.qty > 0 && seen.add(t.id)) {
                  valid.add(t)
              }
          }
          valid.sortWith(compareBy<Trade>({ it.tsMs }, { it.id }))

          val result = ArrayList<Candle>()
          for (t in valid) {
              val sec = Math.floorDiv(t.tsMs, 1000L)
              val start = Math.floorDiv(
                  sec + originOffsetSec,
                  periodSec,
              ) * periodSec - originOffsetSec
              val last = result.lastOrNull()
              if (last != null && last.start == start) {
                  result[result.size - 1] = last.copy(
                      high = maxOf(last.high, t.price),
                      low = minOf(last.low, t.price),
                      close = t.price,
                      amount = last.amount + t.qty,
                      vol = last.vol + t.price * t.qty,
                      count = last.count + 1,
                  )
              } else {
                  result.add(
                      Candle(
                          start,
                          t.price,
                          t.price,
                          t.price,
                          t.price,
                          t.qty,
                          t.price * t.qty,
                          1,
                      ),
                  )
              }
          }
          return result
      }
