- id: exchange-kline-08
  type: code
  level: 3
  priority: P1
  tags: [ema, rsi, indicators]
  timeLimitSec: 1500
  prompt: |
    實作 `ema`（指數移動平均）與 `rsi`（相對強弱指標），輸入是收盤價陣列，回傳與輸入**等長**的陣列，沒有值的位置是 `nil`／`null`。

    - `ema(closes, period)`：`k = 2 / (period + 1)`。**種子（第一個值）是前 `period` 根的簡單平均（SMA）**，放在索引 `period - 1`，其後 `ema = prev + k × (close − prev)`；更前面的索引是 `nil`／`null`
    - `rsi(closes, period)`（Wilder 版本）：價差 `d[i] = close[i] − close[i−1]`。第一組平均漲幅與平均跌幅，是前 `period` 個價差的簡單平均，放在索引 `period`；其後 `avg = (prev × (period − 1) + 當期) / period`。`RSI = 100 − 100 / (1 + avgGain / avgLoss)`；`avgLoss == 0` 時回傳 `100`（本題約定，包含全部持平的情況）
    - `period <= 0`，或資料不足（EMA 需要 `period` 根、RSI 需要 `period + 1` 根）時，全部回傳 `nil`／`null`，不能當掉
  hints:
    - "EMA 只需要記一個變數 `prev`；RSI 只需要記 `avgGain`、`avgLoss` 兩個變數。"
    - "RSI 計算價差的迴圈要從索引 1 開始；平均要除以 `period`，不是除以價差的筆數 − 1。"
  swift:
    starter: |
      func ema(_ closes: [Double], period: Int) -> [Double?] {
          // TODO
          return [Double?](repeating: nil, count: closes.count)
      }

      func rsi(_ closes: [Double], period: Int) -> [Double?] {
          // TODO
          return [Double?](repeating: nil, count: closes.count)
      }
    solution: |
      func ema(_ closes: [Double], period: Int) -> [Double?] {
          var out = [Double?](repeating: nil, count: closes.count)
          guard period > 0, closes.count >= period else { return out }
          let k = 2.0 / Double(period + 1)
          var prev = closes[0..<period].reduce(0, +) / Double(period)
          out[period - 1] = prev
          for i in period..<closes.count {
              prev += k * (closes[i] - prev)
              out[i] = prev
          }
          return out
      }

      func rsi(_ closes: [Double], period: Int) -> [Double?] {
          var out = [Double?](repeating: nil, count: closes.count)
          guard period > 0, closes.count > period else { return out }
          func value(_ gain: Double, _ loss: Double) -> Double {
              return loss == 0 ? 100 : 100 - 100 / (1 + gain / loss)
          }
          var avgGain = 0.0
          var avgLoss = 0.0
          for i in 1...period {
              let d = closes[i] - closes[i - 1]
              if d > 0 {
                  avgGain += d
              } else {
                  avgLoss -= d
              }
          }
          avgGain /= Double(period)
          avgLoss /= Double(period)
          out[period] = value(avgGain, avgLoss)
          for i in (period + 1)..<closes.count {
              let d = closes[i] - closes[i - 1]
              let gain = d > 0 ? d : 0
              let loss = d < 0 ? -d : 0
              avgGain = (avgGain * Double(period - 1) + gain) / Double(period)
              avgLoss = (avgLoss * Double(period - 1) + loss) / Double(period)
              out[i] = value(avgGain, avgLoss)
          }
          return out
      }
