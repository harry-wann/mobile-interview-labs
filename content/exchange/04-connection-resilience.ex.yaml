- id: exchange-connection-resilience-01
  type: single
  level: 2
  priority: P0
  tags: [jitter, thundering-herd]
  prompt: |
    某天交易所的 WebSocket 服務重啟，數萬支手機的 App 同時斷線。所有 App 都用「1 秒、2 秒、4 秒、8 秒」的指數退避（每次等待時間加倍）重連，結果伺服器在每個整數秒都被打爆。最合理的改善是？
  options:
    - "把退避改成固定 1 秒，這樣至少可預期"
    - "加上 jitter：每次延遲在 `0` 到 `min(cap, base × 2^attempt)` 之間隨機（full jitter），讓每支手機的重連時間分散；遇到 `429` 或連線數上限時用更長的 base"
    - "把 base 改成 10 秒，讓重連慢一點"
    - "所有 App 在重連前先 `sleep(5)` 再開始指數退避"
  answer: 1
  explain: |
    指數退避本身只拉長間隔，若所有 App 的起點相同，仍然是**同步**的 thundering herd（驚群效應，同一刻大量連線一起湧入）。jitter（隨機誤差）讓每支手機的延遲分散在一段區間內，伺服器看到的是平滑的流量。
    - 第 1 項錯：固定 1 秒，所有手機還是在同一秒一起連上來，而且每秒都來一次，更糟。
    - 第 3 項錯：base 改成 10 秒只是讓大家一起晚一點連，所有手機的等待時間仍然相同，還是同步。
    - 第 4 項錯：所有人都先等同樣的 5 秒，只是把同步的時間點往後移，沒有把時間分散開。
    這套交易所的私有 WebSocket 還有連線數與請求頻率的限制（API 文件：每個 API key 最多 10 條連線、每個 IP 每秒最多 100 條新連線），同步重連會更容易被拒絕。

- id: exchange-connection-resilience-02
  type: multi
  level: 2
  priority: P0
  tags: [state-machine, backoff]
  prompt: |
    設計重連狀態機時，哪些做法合理？（複選）
  options:
    - "連線 `opened` 就把退避次數歸零，這樣下次斷線能馬上重連"
    - "連線**穩定維持**一段時間（例如 10 秒）後再斷線，才把次數歸零；連上後立刻被踢（例如被限流）要繼續累加次數"
    - "網路消失（offline）時取消重試計時器，等網路恢復的事件再立即連線，並把次數歸零"
    - "App 進背景時主動斷線並取消計時器，回前景再連線、重新訂閱、抓快照"
    - "網路恢復時仍然沿用原本的退避等待，避免連線太頻繁"
  answer: [1, 2, 3]
  explain: |
    - 第 1 項錯：一 `opened` 就歸零，遇到「連上又被踢」的情況會變成緊密迴圈（沒有間隔地連、被踢、再連）。
    - 第 2 項對：穩定一段時間才算真的成功，連上後立刻被踢要繼續累加，等待時間才會越拉越長。
    - 第 3 項對：沒有網路時計時器重試只會耗電；網路恢復是強烈的「現在可以重試」訊號，應立即重試並重置退避。
    - 第 4 項對：進背景後 App 的 socket 不受保證，主動斷線比讓它默默死掉好，回前景時要把它當作新的連線處理（重新訂閱與快照）。
    - 第 5 項錯：網路剛恢復就是最好的重試時機，沿用舊的等待時間只會讓使用者多等。

- id: exchange-connection-resilience-03
  type: predict
  level: 2
  priority: P1
  tags: [backoff, full-jitter]
  prompt: |
    base ＝ 500 ms、cap ＝ 8000 ms，注入的亂數固定為 0.5（jitter 的隨機值固定成 0.5，結果才好預測）。下列程式印出什麼？（attempt 0 到 5）
  codeLang: swift
  code: |
    let base: Int64 = 500
    let cap: Int64 = 8000
    var out: [String] = []
    for attempt in 0..<6 {
        let ceiling = min(cap, base << Int64(attempt))
        let delay = Int64(Double(ceiling) * 0.5)
        out.append(String(delay))
    }

    print(out.joined(separator: " "))
  answer: |
    250 500 1000 2000 4000 4000
  explain: |
    上限依序是 500、1000、2000、4000、8000、16000（被 cap 限制成 8000）；亂數 0.5 時，延遲是上限的一半：250、500、1000、2000、4000、4000。到 cap 之後上限不再成長。
    實作時 `attempt` 很大會讓位移溢位（數字超過型別能表示的範圍），要先封頂再計算，例如用迴圈一次翻一倍、到 cap 就停。

- id: exchange-connection-resilience-04
  type: single
  level: 2
  priority: P0
  tags: [reachability, captive-portal]
  prompt: |
    iOS 的 `NWPathMonitor` 回報 `path.status == .satisfied`，但 App 仍然連不到伺服器（使用者在咖啡店的 Wi-Fi 登入頁後面）。這說明了什麼？
  options:
    - "`NWPathMonitor` 有 bug，應該改用 `Reachability` 第三方函式庫"
    - "`satisfied` 只代表系統有可用的網路路徑，不保證能連到網際網路或你的伺服器（captive portal 等）；網路狀態只是提示，仍要靠實際連線的成功與失敗、心跳與資料新鮮度判斷，Android 對應的是檢查 `NET_CAPABILITY_VALIDATED`"
    - "應該在每次請求前先用 `NWPathMonitor` 檢查，不通就不送請求，這樣就不會失敗"
    - "只要關掉 App 重開就會自動修好"
  answer: 1
  explain: |
    網路狀態 API 回答的是「系統認為有沒有路」，不是「你的服務通不通」。
    - 第 1 項錯：這不是 bug，是設計如此。換成別的函式庫，回答的問題還是一樣。
    - 第 3 項錯：請求前用它擋住請求，會讓使用者在 captive portal（要先在網頁登入才能上網的 Wi-Fi）之類的情況完全無法操作。
    - 第 4 項錯：問題出在網路環境，重開 App 不會讓使用者通過登入頁。
    正確用法：offline 時暫停重試以省電，網路恢復時立即重試，其餘一律以實際的連線與心跳結果為準。

- id: exchange-connection-resilience-05
  type: order
  level: 2
  priority: P1
  tags: [recovery, resubscribe]
  prompt: |
    App 從背景回到前景（連線已經中斷）。依合理順序排列恢復步驟。
  items:
    - "把行情標示為過期（顯示「更新中」）"
    - "建立 WebSocket 連線；私有頻道先重新 auth"
    - "依目前畫面需要的 topic 清單重新訂閱（帶新的 id）"
    - "對板、K 線最後一根等狀態型資料：先緩衝增量、取快照、再套用"
    - "資料恢復後才清除過期標示，並恢復下單按鈕"
  explain: |
    - 先標示過期，避免使用者在恢復前以舊價格操作。
    - 接著建立連線；私有頻道要先 auth 才能訂閱。
    - 再依訂閱清單重新訂閱。清單來自單一來源（目前需要的 topic），而不是各畫面各自重送。
    - 狀態型資料必須取快照補洞（先把新收到的更新暫存起來、抓一份完整的最新資料、再套用暫存的更新），否則背景期間漏掉的更新會讓畫面錯誤。
    - 最後一步才解除保護：價格與下單的可用性要等資料確實恢復。

- id: exchange-connection-resilience-06
  type: single
  level: 3
  priority: P1
  tags: [half-open, heartbeat, watchdog]
  prompt: |
    使用者從 Wi-Fi 走出門換成行動網路，App 的 WebSocket 畫面「看起來」還連著，但價格停止更新，也沒有任何 `onClose`／`didClose` 回呼。最可能的原因與處理方式是？
  options:
    - "伺服器當機，App 端沒辦法處理"
    - "TCP 連線已成為半開（half-open）：舊的網路路徑失效，但 App 的 socket 沒有被通知。應該用應用層的監看：這套交易所的伺服器約每 5 秒送 ping，若超過約 15 秒沒收到任何訊息就主動關閉並重連；同時監聽網路路徑變化，變化時立刻重連"
    - "iOS 的 `URLSessionWebSocketTask` 會自動偵測並重連，不需要處理"
    - "把 `pingInterval` 設成 0，讓連線永遠保持"
  answer: 1
  explain: |
    網路切換時，原本的 socket 可能長時間不報錯（半開連線：連線在 App 這端看起來還開著，但對方其實已經收不到了）。只依賴關閉回呼是不夠的，需要「最後收到資料的時間」的監看，以及網路路徑變化的觸發。伺服器的 ping 剛好是很好的訊號：大約 15 秒（三次 ping）沒收到任何訊息，就視為斷線。
    - 第 1 項錯：就算伺服器真的出問題，App 也應該偵測到沒有資料並顯示過期，而不是一直顯示舊價格。
    - 第 3 項錯：`URLSessionWebSocketTask` 不會替你處理這種情況，沒有收到關閉通知，它也不會重連。
    - 第 4 項錯：`pingInterval` 設成 0 是關掉協定層的定時 ping，只會更難發現連線已經失效。
    記得這個監看用單調時鐘計時（只會往前走、不受使用者改系統時間影響），放在 socket 的背景路徑，不要放在 UI 執行緒。

- id: exchange-connection-resilience-07
  type: code
  level: 3
  priority: P0
  tags: [reconnect, state-machine, backoff, jitter]
  prompt: |
    實作重連的退避與狀態機（純函式／純狀態，**注入亂數**，時間由事件帶入）。（白話：把「連線中、已連上、等待重試、離線、背景暫停」寫成一個狀態機，每收到一個事件，就回傳下一步要做的事。）

    **`Backoff(baseMs, capMs).delayMs(attempt, random)`**（full jitter：在 0 到上限之間隨機）：上限 ＝ `min(capMs, baseMs × 2^attempt)`；回傳 `floor(上限 × random)`，`random` 先限制在 `[0, 0.999999999]`。`attempt` 很大時不可溢位。

    **`ConnMachine(backoff, stableMs = 10_000)`** 的 `handle(event, random) -> [effect]`，狀態：`idle`、`connecting(attempt)`、`connected(attempt, sinceMs)`、`waiting(attempt, retryAtMs)`、`offline`、`suspended`。規則：
    - `start`：idle → `connecting(0)`，effect `[connect]`
    - `opened(now)`：`connecting(n)` → `connected(n, now)`，`[]`
    - `closed(now)`：
      - 來自 `connected(n, since)`：若 `now - since >= stableMs` 則 `next = 0`，否則 `next = n + 1`
      - 來自 `connecting(n)`：`next = n + 1`
      - 然後 `delay = backoff.delayMs(next, random)`；狀態 `waiting(next, now + delay)`，effect `[scheduleRetry(delay)]`
    - `retryTimerFired`：`waiting(n, _)` → `connecting(n)`，`[connect]`
    - `networkLost`：來自 connecting／connected／waiting → `offline`，`[cancelRetry, closeSocket]`
    - `networkAvailable`：`offline` → `connecting(0)`，`[connect]`；`waiting` → `connecting(0)`，`[cancelRetry, connect]`
    - `enteredBackground`：來自 connecting／connected／waiting／offline → `suspended`，`[cancelRetry, closeSocket]`
    - `enteredForeground`：`suspended` → `connecting(0)`，`[connect]`
    - 其他組合一律忽略：狀態不變、回傳 `[]`
  hints:
