    solution: |
      struct Backoff {
          let baseMs: Int64
          let capMs: Int64

          func delayMs(attempt: Int, random: Double) -> Int64 {
              var ceiling = min(baseMs, capMs)
              var i = 0
              while i < attempt && ceiling < capMs {
                  ceiling = min(ceiling * 2, capMs)
                  i += 1
              }
              let r = min(max(random, 0), 0.999_999_999)
              return Int64(Double(ceiling) * r)
          }
      }

      enum ConnState: Equatable {
          case idle
          case connecting(attempt: Int)
          case connected(attempt: Int, sinceMs: Int64)
          case waiting(attempt: Int, retryAtMs: Int64)
          case offline
          case suspended
      }

      enum ConnEvent {
          case start
          case opened(nowMs: Int64)
          case closed(nowMs: Int64)
          case retryTimerFired
          case networkLost
          case networkAvailable
          case enteredBackground
          case enteredForeground
      }

      enum ConnEffect: Equatable {
          case connect
          case scheduleRetry(delayMs: Int64)
          case cancelRetry
          case closeSocket
      }

      struct ConnMachine {
          private(set) var state: ConnState = .idle
          private let backoff: Backoff
          private let stableMs: Int64

          init(backoff: Backoff, stableMs: Int64 = 10_000) {
              self.backoff = backoff
              self.stableMs = stableMs
          }

          private mutating func scheduleRetry(
              attempt: Int,
              now: Int64,
              random: Double
          ) -> [ConnEffect] {
              let delay = backoff.delayMs(attempt: attempt, random: random)
              state = .waiting(attempt: attempt, retryAtMs: now + delay)
              return [.scheduleRetry(delayMs: delay)]
          }

          mutating func handle(_ event: ConnEvent, random: Double) -> [ConnEffect] {
              switch (state, event) {
              case (.idle, .start):
                  state = .connecting(attempt: 0)
                  return [.connect]
              case (.connecting(let n), .opened(let now)):
                  state = .connected(attempt: n, sinceMs: now)
                  return []
              case (.connected(let n, let since), .closed(let now)):
                  let next = (now - since >= stableMs) ? 0 : n + 1
                  return scheduleRetry(attempt: next, now: now, random: random)
              case (.connecting(let n), .closed(let now)):
                  return scheduleRetry(attempt: n + 1, now: now, random: random)
              case (.waiting(let n, _), .retryTimerFired):
                  state = .connecting(attempt: n)
                  return [.connect]
              case (.connecting, .networkLost),
                   (.connected, .networkLost),
                   (.waiting, .networkLost):
                  state = .offline
                  return [.cancelRetry, .closeSocket]
              case (.offline, .networkAvailable):
                  state = .connecting(attempt: 0)
                  return [.connect]
              case (.waiting, .networkAvailable):
                  state = .connecting(attempt: 0)
                  return [.cancelRetry, .connect]
              case (.connecting, .enteredBackground),
                   (.connected, .enteredBackground),
                   (.waiting, .enteredBackground), (.offline, .enteredBackground):
                  state = .suspended
                  return [.cancelRetry, .closeSocket]
              case (.suspended, .enteredForeground):
                  state = .connecting(attempt: 0)
                  return [.connect]
              default:
                  return []
              }
          }
      }
    tests: |
      func machine() -> ConnMachine {
          ConnMachine(backoff: Backoff(baseMs: 1000, capMs: 30_000))
      }

      check("Backoff：full jitter 的上限、cap 與亂數") {
          let b = Backoff(baseMs: 1000, capMs: 30_000)
          return b.delayMs(attempt: 0, random: 0.5) == 500
              && b.delayMs(attempt: 1, random: 0.5) == 1000
              && b.delayMs(attempt: 3, random: 0.5) == 4000
              && b.delayMs(attempt: 5, random: 0.5) == 15_000
              && b.delayMs(attempt: 2, random: 0) == 0
              && b.delayMs(attempt: 2, random: 5) == 3999
      }

      check("Backoff：attempt 很大時不溢位，維持 cap") {
          let b = Backoff(baseMs: 1000, capMs: 30_000)
          return b.delayMs(attempt: 200, random: 0.5) == 15_000 &&
              b.delayMs(attempt: Int.max, random: 0.5) == 15_000
      }

      check("start 只在 idle 有效") {
          var m = machine()
          let e1 = m.handle(.start, random: 0.5)
          let s1 = m.state
          let e2 = m.handle(.start, random: 0.5)
          return e1 == [.connect] && s1 == .connecting(attempt: 0) && e2 == [] &&
              m.state == s1
      }

      check("連上後很快斷線：attempt 累加，進入 waiting 並排程重試") {
          var m = machine()
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.opened(nowMs: 0), random: 0.5)
          let e = m.handle(.closed(nowMs: 1000), random: 0.5)
          return e == [.scheduleRetry(delayMs: 1000)] &&
              m.state == .waiting(attempt: 1, retryAtMs: 2000)
      }

      check("計時器到期後重試；連線階段失敗繼續累加") {
          var m = machine()
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.closed(nowMs: 100), random: 0.5)
          let t = m.handle(.retryTimerFired, random: 0.5)
          let afterTimer = m.state
          let e = m.handle(.closed(nowMs: 2500), random: 0.5)
          return t == [.connect] && afterTimer == .connecting(attempt: 1)
              && e == [.scheduleRetry(delayMs: 2000)]
              && m.state == .waiting(attempt: 2, retryAtMs: 4500)
      }

      check("連線穩定超過 stableMs 後才重置次數") {
          var m = machine()
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.closed(nowMs: 0), random: 0.5)
          _ = m.handle(.retryTimerFired, random: 0.5)
          _ = m.handle(.closed(nowMs: 0), random: 0.5)
          _ = m.handle(.retryTimerFired, random: 0.5)
          _ = m.handle(.opened(nowMs: 5000), random: 0.5)
          let e = m.handle(.closed(nowMs: 20_000), random: 0.5)
          return e == [.scheduleRetry(delayMs: 500)] &&
              m.state == .waiting(attempt: 0, retryAtMs: 20_500)
      }

      check(
          "網路消失：取消計時器並關閉 socket；斷線事件被忽略；恢復後立即連線並重置次數"
      ) {
          var m = machine()
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.opened(nowMs: 0), random: 0.5)
          let lost = m.handle(.networkLost, random: 0.5)
          let ignored = m.handle(.closed(nowMs: 100), random: 0.5)
          let stateAfter = m.state
          let back = m.handle(.networkAvailable, random: 0.5)
          return lost == [.cancelRetry, .closeSocket]
              && ignored == []
              && stateAfter == .offline
              && back == [.connect] && m.state == .connecting(attempt: 0)
      }

      check("退避等待中網路恢復：取消等待並立即重試") {
          var m = machine()
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.closed(nowMs: 0), random: 0.5)
          let e = m.handle(.networkAvailable, random: 0.5)
          return e == [.cancelRetry, .connect] && m.state == .connecting(attempt: 0)
      }

      check("背景與前景：進背景關閉並取消，回前景重新連線；其餘狀態忽略") {
          var m = machine()
          let idleBg = m.handle(.enteredBackground, random: 0.5)
          let idleState = m.state
          _ = m.handle(.start, random: 0.5)
          _ = m.handle(.opened(nowMs: 0), random: 0.5)
          let bg = m.handle(.enteredBackground, random: 0.5)
          let ignoredNet = m.handle(.networkAvailable, random: 0.5)
          let fg = m.handle(.enteredForeground, random: 0.5)
          let fg2 = m.handle(.enteredForeground, random: 0.5)
          return idleBg == []
              && idleState == .idle
              && bg == [.cancelRetry, .closeSocket]
              && ignoredNet == []
              && fg == [.connect]
              && m.state == .connecting(attempt: 0)
              && fg2 == []
      }
  kotlin:
    starter: |
      class Backoff(val baseMs: Long, val capMs: Long) {
          fun delayMs(attempt: Int, random: Double): Long {
              // TODO
              return 0
          }
      }

      sealed class ConnState {
          object Idle : ConnState()
          data class Connecting(val attempt: Int) : ConnState()
          data class Connected(val attempt: Int, val sinceMs: Long) : ConnState()
          data class Waiting(val attempt: Int, val retryAtMs: Long) : ConnState()
          object Offline : ConnState()
          object Suspended : ConnState()
      }

      sealed class ConnEvent {
          object Start : ConnEvent()
          data class Opened(val nowMs: Long) : ConnEvent()
          data class Closed(val nowMs: Long) : ConnEvent()
          object RetryTimerFired : ConnEvent()
          object NetworkLost : ConnEvent()
          object NetworkAvailable : ConnEvent()
          object EnteredBackground : ConnEvent()
          object EnteredForeground : ConnEvent()
      }

      sealed class ConnEffect {
          object Connect : ConnEffect()
          data class ScheduleRetry(val delayMs: Long) : ConnEffect()
          object CancelRetry : ConnEffect()
          object CloseSocket : ConnEffect()
      }

      class ConnMachine(
          private val backoff: Backoff,
          private val stableMs: Long = 10_000,
      ) {
          var state: ConnState = ConnState.Idle
              private set

          fun handle(event: ConnEvent, random: Double): List<ConnEffect> {
              // TODO
              return emptyList()
          }
      }
    solution: |
      class Backoff(val baseMs: Long, val capMs: Long) {
          fun delayMs(attempt: Int, random: Double): Long {
              var ceiling = minOf(baseMs, capMs)
              var i = 0
              while (i < attempt && ceiling < capMs) {
                  ceiling = minOf(ceiling * 2, capMs)
                  i++
              }
              val r = minOf(maxOf(random, 0.0), 0.999_999_999)
              return (ceiling * r).toLong()
          }
      }

      sealed class ConnState {
          object Idle : ConnState()
          data class Connecting(val attempt: Int) : ConnState()
          data class Connected(val attempt: Int, val sinceMs: Long) : ConnState()
          data class Waiting(val attempt: Int, val retryAtMs: Long) : ConnState()
          object Offline : ConnState()
          object Suspended : ConnState()
      }

      sealed class ConnEvent {
          object Start : ConnEvent()
          data class Opened(val nowMs: Long) : ConnEvent()
          data class Closed(val nowMs: Long) : ConnEvent()
          object RetryTimerFired : ConnEvent()
          object NetworkLost : ConnEvent()
          object NetworkAvailable : ConnEvent()
          object EnteredBackground : ConnEvent()
          object EnteredForeground : ConnEvent()
      }

      sealed class ConnEffect {
          object Connect : ConnEffect()
          data class ScheduleRetry(val delayMs: Long) : ConnEffect()
          object CancelRetry : ConnEffect()
          object CloseSocket : ConnEffect()
      }

      class ConnMachine(
          private val backoff: Backoff,
          private val stableMs: Long = 10_000,
      ) {
          var state: ConnState = ConnState.Idle
              private set

          private fun scheduleRetry(
              attempt: Int,
              now: Long,
              random: Double,
          ): List<ConnEffect> {
              val delay = backoff.delayMs(attempt, random)
              state = ConnState.Waiting(attempt, now + delay)
              return listOf(ConnEffect.ScheduleRetry(delay))
          }

          fun handle(event: ConnEvent, random: Double): List<ConnEffect> {
              val s = state
              return when {
                  s is ConnState.Idle && event is ConnEvent.Start -> {
                      state = ConnState.Connecting(0)
                      listOf(ConnEffect.Connect)
                  }
                  s is ConnState.Connecting && event is ConnEvent.Opened -> {
                      state = ConnState.Connected(s.attempt, event.nowMs)
                      emptyList()
                  }
                  s is ConnState.Connected && event is ConnEvent.Closed -> {
                      val next = if (event.nowMs - s.sinceMs >= stableMs) {
                          0
                      } else {
                          s.attempt + 1
                      }
                      scheduleRetry(next, event.nowMs, random)
                  }
                  s is ConnState.Connecting && event is ConnEvent.Closed ->
                      scheduleRetry(s.attempt + 1, event.nowMs, random)
                  s is ConnState.Waiting && event is ConnEvent.RetryTimerFired -> {
                      state = ConnState.Connecting(s.attempt)
                      listOf(ConnEffect.Connect)
                  }
                  (
                      s is ConnState.Connecting ||
                          s is ConnState.Connected ||
                          s is ConnState.Waiting
                  ) &&
                      event is ConnEvent.NetworkLost -> {
                      state = ConnState.Offline
                      listOf(ConnEffect.CancelRetry, ConnEffect.CloseSocket)
                  }
                  s is ConnState.Offline && event is ConnEvent.NetworkAvailable -> {
                      state = ConnState.Connecting(0)
                      listOf(ConnEffect.Connect)
                  }
                  s is ConnState.Waiting && event is ConnEvent.NetworkAvailable -> {
                      state = ConnState.Connecting(0)
                      listOf(ConnEffect.CancelRetry, ConnEffect.Connect)
                  }
                  (
                      s is ConnState.Connecting ||
                          s is ConnState.Connected ||
                          s is ConnState.Waiting ||
                          s is ConnState.Offline
                  ) &&
                      event is ConnEvent.EnteredBackground -> {
                      state = ConnState.Suspended
                      listOf(ConnEffect.CancelRetry, ConnEffect.CloseSocket)
                  }
                  s is ConnState.Suspended &&
                      event is ConnEvent.EnteredForeground -> {
                      state = ConnState.Connecting(0)
                      listOf(ConnEffect.Connect)
                  }
                  else -> emptyList()
              }
          }
      }
    tests: |
      fun machine() = ConnMachine(Backoff(1000, 30_000))

      check("Backoff：full jitter 的上限、cap 與亂數") {
          val b = Backoff(1000, 30_000)
          b.delayMs(0, 0.5) == 500L &&
              b.delayMs(1, 0.5) == 1000L &&
              b.delayMs(3, 0.5) == 4000L &&
              b.delayMs(5, 0.5) == 15_000L &&
              b.delayMs(2, 0.0) == 0L &&
              b.delayMs(2, 5.0) == 3999L
      }

      check("Backoff：attempt 很大時不溢位，維持 cap") {
          val b = Backoff(1000, 30_000)
          b.delayMs(200, 0.5) == 15_000L && b.delayMs(Int.MAX_VALUE, 0.5) == 15_000L
      }

      check("start 只在 idle 有效") {
          val m = machine()
          val e1 = m.handle(ConnEvent.Start, 0.5)
          val s1 = m.state
          val e2 = m.handle(ConnEvent.Start, 0.5)
          e1 == listOf(ConnEffect.Connect) &&
              s1 == ConnState.Connecting(0) &&
              e2.isEmpty() &&
              m.state == s1
      }

      check("連上後很快斷線：attempt 累加，進入 waiting 並排程重試") {
          val m = machine()
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Opened(0), 0.5)
          val e = m.handle(ConnEvent.Closed(1000), 0.5)
          e == listOf(ConnEffect.ScheduleRetry(1000)) &&
              m.state == ConnState.Waiting(1, 2000)
      }

      check("計時器到期後重試；連線階段失敗繼續累加") {
          val m = machine()
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Closed(100), 0.5)
          val t = m.handle(ConnEvent.RetryTimerFired, 0.5)
          val afterTimer = m.state
          val e = m.handle(ConnEvent.Closed(2500), 0.5)
          t == listOf(ConnEffect.Connect) && afterTimer == ConnState.Connecting(1) &&
              e == listOf(ConnEffect.ScheduleRetry(2000)) &&
              m.state == ConnState.Waiting(2, 4500)
      }

      check("連線穩定超過 stableMs 後才重置次數") {
          val m = machine()
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Closed(0), 0.5)
          m.handle(ConnEvent.RetryTimerFired, 0.5)
          m.handle(ConnEvent.Closed(0), 0.5)
          m.handle(ConnEvent.RetryTimerFired, 0.5)
          m.handle(ConnEvent.Opened(5000), 0.5)
          val e = m.handle(ConnEvent.Closed(20_000), 0.5)
          e == listOf(ConnEffect.ScheduleRetry(500)) &&
              m.state == ConnState.Waiting(0, 20_500)
      }

      check(
          "網路消失：取消計時器並關閉 socket；斷線事件被忽略；恢復後立即連線並重置次數",
      ) {
          val m = machine()
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Opened(0), 0.5)
          val lost = m.handle(ConnEvent.NetworkLost, 0.5)
          val ignored = m.handle(ConnEvent.Closed(100), 0.5)
          val stateAfter = m.state
          val back = m.handle(ConnEvent.NetworkAvailable, 0.5)
          lost == listOf(ConnEffect.CancelRetry, ConnEffect.CloseSocket) &&
              ignored.isEmpty() &&
              stateAfter == ConnState.Offline && back == listOf(ConnEffect.Connect) &&
              m.state == ConnState.Connecting(0)
      }

      check("退避等待中網路恢復：取消等待並立即重試") {
          val m = machine()
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Closed(0), 0.5)
          val e = m.handle(ConnEvent.NetworkAvailable, 0.5)
          e == listOf(ConnEffect.CancelRetry, ConnEffect.Connect) &&
              m.state == ConnState.Connecting(0)
      }

      check("背景與前景：進背景關閉並取消，回前景重新連線；其餘狀態忽略") {
          val m = machine()
          val idleBg = m.handle(ConnEvent.EnteredBackground, 0.5)
          val idleState = m.state
          m.handle(ConnEvent.Start, 0.5)
          m.handle(ConnEvent.Opened(0), 0.5)
          val bg = m.handle(ConnEvent.EnteredBackground, 0.5)
          val ignoredNet = m.handle(ConnEvent.NetworkAvailable, 0.5)
          val fg = m.handle(ConnEvent.EnteredForeground, 0.5)
          val fg2 = m.handle(ConnEvent.EnteredForeground, 0.5)
          idleBg.isEmpty() && idleState == ConnState.Idle &&
              bg == listOf(ConnEffect.CancelRetry, ConnEffect.CloseSocket) &&
              ignoredNet.isEmpty() && fg == listOf(ConnEffect.Connect) &&
              m.state == ConnState.Connecting(0) && fg2.isEmpty()
      }

- id: exchange-connection-resilience-08
  type: open
  level: 2
  priority: P0
  tags: [reconnect, architecture]
  prompt: |
    設計交易所 App 的 WebSocket 連線韌性：重連策略、網路狀態、背景處理、資料過期與下單保護。並說明你在重連與回前景處理上的實務做法，以及到交易所的 App 你會怎麼改進。
  promptJa: |
    取引所アプリの WebSocket 接続の耐障害性（再接続の戦略、ネットワーク状態、バックグラウンド処理、データの鮮度、発注の保護）を設計してください。これまでの実装経験と、取引所アプリでどう改善するかも説明してください。
  keyPoints:
    - "明確的狀態機：idle／connecting／connected／waiting／offline／suspended，轉移用純函式，副作用用 effect（要去做的事，只用資料描述）描述，可用事件序列測試"
    - "退避：指數加 full jitter（注入亂數；在 0 到上限之間隨機），cap（等待上限）；連線穩定一段時間才重置次數；網路恢復與回前景立即重連並重置"
    - "限流：遇到 429／too.many.connection 用更長的 base；私有頻道每個 API key 最多 10 條連線，避免同步重連"
    - "網路狀態是提示：NWPathMonitor／NetworkCallback（VALIDATED）；半開連線（看起來連著、其實收不到資料）靠應用層監看（伺服器約 5 秒 ping，約 15 秒沒資料就重連）"
    - "恢復順序：標示過期 → 連線與 auth → 重新訂閱 → 緩衝增量、取快照（整份最新資料）→ 清除過期標示"
    - "UI：最後更新時間（單調時鐘）、寬限時間去抖動、斷線時價格變灰並阻止或二次確認下單"
    - "經驗：即時行情 App 的 SSE 重連（斷線後 1 秒重連、每次重取 token）、iOS 的沒資料監看、回前景補抓；到交易所的 App 我會改成指數退避加 jitter，兩個平台都加上沒資料的監看，並在畫面上顯示斷線狀態"
  modelAnswer: |
    我會把連線建模成明確的狀態機：idle、connecting、connected、waiting、offline、suspended，用事件驅動，轉移寫成純函式，副作用用 effect 描述，這樣可以用事件序列測試。

    重連用指數退避（等待時間逐次加倍）加 full jitter（在 0 到上限之間隨機），亂數注入以便測試。連線要穩定超過一段時間才重置次數，避免連上又被踢變成緊密迴圈（沒有間隔地連、被踢、再連）；網路恢復和回前景則立即重連並重置。遇到 429 或連線數上限，用更長的 base，避免大量 App 同步重連。網路狀態 API 只是提示，不能代表真的能連；半開連線（看起來連著、其實收不到資料）我用應用層監看，這套交易所的伺服器約每 5 秒 ping，超過約 15 秒沒收到任何訊息就主動重連。

    重連後依序是：標示資料過期、連線與 auth、重新訂閱、緩衝增量並取快照（整份最新資料）、最後清除過期標示。UI 上追蹤最後更新時間，斷線超過寬限時間就把價格變灰，並阻止或二次確認以該價格下單。

    經驗上，我在一個即時行情 App 做過 SSE 的重連（斷線後 1 秒重連、每次重新取得短效 token）、回前景補抓資料，iOS 端還有沒資料的監看。到交易所的 App，我會把重連改成指數退避加 jitter，兩個平台都加上沒資料的監看，並在畫面上顯示斷線狀態。
  modelAnswerJa: |
    接続は明確な状態機械としてモデル化します。idle、connecting、connected、waiting、offline、suspended の状態をイベントで駆動し、遷移は純粋関数、副作用は effect として表すので、イベント列でテストできます。

    再接続は指数バックオフと full jitter を使い、テストのために乱数は注入します。接続が一定時間安定して初めて試行回数をリセットすることで、接続してすぐ切られる場合に密なループになるのを避けます。ネットワーク復帰とフォアグラウンド復帰のときは、すぐ再接続して回数をリセットします。429 や接続数の上限に当たった場合は base を長くして、大量のアプリが同時に再接続しないようにします。ネットワーク状態の API はあくまでヒントで、実際につながることの保証にはなりません。ハーフオープンの接続はアプリ層で監視します。この取引所のサーバーは約 5 秒ごとに ping を送るため、約 15 秒どのメッセージも届かなければ自分から再接続します。

    再接続後の順序は、データを古いと表示、接続と認証、再購読、差分のバッファとスナップショット取得、最後に古い表示の解除です。UI では最終更新時刻を追跡し、切断が猶予時間を超えたら価格をグレーにして、その価格での発注を止めるか再確認を求めます。

    経験としては、相場アプリで SSE の再接続（切断後 1 秒で再接続し、毎回短期 token を取得し直す）とフォアグラウンド復帰時のデータ再取得を実装し、iOS には無通信の監視も実装していました。取引所アプリでは、再接続を指数バックオフと jitter に変更し、両プラットフォームに無通信の監視を入れ、画面に切断状態を表示します。
  followUps:
    - "同一ユーザーが複数画面から同じ topic を購読するとき、再購読の管理はどうする？"
    - "再接続中に発注ボタンが押されたら、画面と内部の状態はどうなる？"
    - "リトライの上限を設けるべきか？設けない場合、ユーザーにどう見せる？"
  timeLimitSec: 180

- id: exchange-connection-resilience-09
  type: flash
  level: 1
  priority: P0
  tags: [backoff]
  front: 重連策略速記：退避公式、何時重置、網路 API 限制、恢復順序
  back: |
    - full jitter（在 0 到上限之間隨機）：`delay = random(0, min(cap, base × 2^attempt))`；注入亂數；attempt 大時先封頂。
    - **穩定一段時間才重置**次數（不要 `opened` 就重置）；網路恢復／回前景立即重連並重置；offline 時停計時器。
    - `NWPathMonitor satisfied`／`onAvailable` ≠ 能上網（captive portal：要先在網頁登入的 Wi-Fi）；Android 看 `NET_CAPABILITY_VALIDATED`；半開連線（看起來連著、其實收不到資料）靠應用層監看（約 15 秒沒資料就重連）。
    - 恢復：標示過期 → 連線＋auth → 重新訂閱 → 緩衝＋快照（整份最新資料）→ 清除過期；斷線超過寬限就灰掉價格、保護下單。
