- id: exchange-precision-08
  type: code
  level: 2
  priority: P0
  tags: [decimal, tick-size]
  prompt: |
    實作 `floorToStep`：把**正數** `value` 往下對齊到 `step` 的整數倍。價格對齊 tick size、數量對齊 step size 都用這個函式。（白話：tick size 是 5 円，價格就只能是 5 的倍數，所以 1234 要變成 1230。）

    - `floorToStep(1234.567, step: 0.01)` → `1234.56`
    - `floorToStep(1234, step: 5)` → `1230`
    - `value` 小於 `step` 時回傳 `0`
  hints:
    - 先算 `value / step`，取整數部分（往下），再乘回 `step`。
    - Swift 用 `NSDecimalRound(&result, &value, 0, .down)`；Kotlin 用 `divide(step, 0, RoundingMode.DOWN)`。
  swift:
    starter: |
      import Foundation

      func floorToStep(_ value: Decimal, step: Decimal) -> Decimal {
          // TODO: 往下對齊到 step 的整數倍
          return value
      }
    solution: |
      import Foundation

      func floorToStep(_ value: Decimal, step: Decimal) -> Decimal {
          var quotient = value / step
          var whole = Decimal()
          NSDecimalRound(&whole, &quotient, 0, .down)
          return whole * step
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }
      checkEqual("價格 tick 0.01", D("1234.56")) {
          floorToStep(D("1234.567"), step: D("0.01"))
      }

      checkEqual("數量 step 0.0001", D("0.1234")) {
          floorToStep(D("0.123456789"), step: D("0.0001"))
      }

      checkEqual("tick 為 5 円", D("1230")) { floorToStep(D("1234"), step: D("5")) }
      checkEqual("小於 step 回傳 0", D("0")) {
          floorToStep(D("0.00009"), step: D("0.0001"))
      }

      checkEqual("已對齊不變", D("2.5")) { floorToStep(D("2.5"), step: D("0.5")) }
      checkEqual("satoshi 精度", D("0.12345678")) {
          floorToStep(D("0.123456789123"), step: D("0.00000001"))
      }
  kotlin:
    starter: |
      import java.math.BigDecimal

      fun floorToStep(value: BigDecimal, step: BigDecimal): BigDecimal {
          TODO("往下對齊到 step 的整數倍")
      }
    solution: |
      import java.math.BigDecimal
      import java.math.RoundingMode

      fun floorToStep(value: BigDecimal, step: BigDecimal): BigDecimal =
          value.divide(step, 0, RoundingMode.DOWN).multiply(step)
    tests: |
      fun plain(v: BigDecimal) = v.stripTrailingZeros().toPlainString()
      checkEqual("價格 tick 0.01", "1234.56") {
          plain(floorToStep(BigDecimal("1234.567"), BigDecimal("0.01")))
      }

      checkEqual("數量 step 0.0001", "0.1234") {
          plain(floorToStep(BigDecimal("0.123456789"), BigDecimal("0.0001")))
      }

      checkEqual("tick 為 5 円", "1230") {
          plain(floorToStep(BigDecimal("1234"), BigDecimal("5")))
      }

      checkEqual("小於 step 回傳 0", "0") {
          plain(floorToStep(BigDecimal("0.00009"), BigDecimal("0.0001")))
      }

      checkEqual("已對齊不變", "2.5") {
          plain(floorToStep(BigDecimal("2.5"), BigDecimal("0.5")))
      }

      checkEqual("satoshi 精度", "0.12345678") {
          plain(floorToStep(BigDecimal("0.123456789123"), BigDecimal("0.00000001")))
      }

- id: exchange-precision-09
  type: code
  level: 2
  priority: P1
  tags: [decimal, formatting]
  prompt: |
    實作 24h 漲跌幅的顯示字串 `formatChangePercent(open:last:)`：

    - 公式 `(last - open) × 100 ÷ open`，捨入到小數 2 位，**四捨五入且 0.5 遠離 0**（Swift `.plain`、Kotlin `HALF_UP`；意思是 `1.5` 變 `2`、`-1.5` 變 `-2`）
    - 正數前面加 `+`，負數保留 `-`，0 顯示 `0.00%`
    - 固定 2 位小數、不要千分位：`+15000.00%`
    - `open` 為 0 時回傳 `--`
  hints:
    - 先乘 100 再除，可減少捨入誤差。
    - Swift 可用 `NumberFormatter`（locale `en_US_POSIX`，`minimumFractionDigits = 2`）；Kotlin 用 `toPlainString()`。
  swift:
    starter: |
      import Foundation

      func formatChangePercent(open: Decimal, last: Decimal) -> String {
          // TODO
          return "0.00%"
      }
    solution: |
      import Foundation

      func formatChangePercent(open: Decimal, last: Decimal) -> String {
          guard open != 0 else { return "--" }
          var pct = (last - open) * 100 / open
          var rounded = Decimal()
          NSDecimalRound(&rounded, &pct, 2, .plain)
          let formatter = NumberFormatter()
          formatter.locale = Locale(identifier: "en_US_POSIX")
          formatter.minimumIntegerDigits = 1
          formatter.minimumFractionDigits = 2
          formatter.maximumFractionDigits = 2
          let body = formatter.string(from: rounded as NSDecimalNumber) ?? "0.00"
          return (rounded > 0 ? "+" : "") + body + "%"
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }
      checkEqual("上漲", "+1.23%") {
          formatChangePercent(open: D("100"), last: D("101.234"))
      }

      checkEqual("下跌補零", "-0.50%") {
          formatChangePercent(open: D("100"), last: D("99.5"))
      }

      checkEqual("持平", "0.00%") {
          formatChangePercent(open: D("100"), last: D("100"))
      }

      checkEqual("open 為 0", "--") {
          formatChangePercent(open: D("0"), last: D("1"))
      }

      checkEqual("0.005 進位", "+0.01%") {
          formatChangePercent(open: D("200"), last: D("200.01"))
      }

      checkEqual("-0.005 遠離 0", "-0.01%") {
          formatChangePercent(open: D("200"), last: D("199.99"))
      }

      checkEqual("極小跌幅顯示 0.00%", "0.00%") {
          formatChangePercent(open: D("100000"), last: D("99999.999"))
      }

      checkEqual("不加千分位", "+15000.00%") {
          formatChangePercent(open: D("1"), last: D("151"))
      }
  kotlin:
    starter: |
      import java.math.BigDecimal

      fun formatChangePercent(open: BigDecimal, last: BigDecimal): String {
          return "0.00%"
      }
    solution: |
      import java.math.BigDecimal
      import java.math.RoundingMode

      fun formatChangePercent(open: BigDecimal, last: BigDecimal): String {
          if (open.signum() == 0) {
              return "--"
          }
          val pct = (last - open)
              .multiply(BigDecimal(100))
              .divide(open, 2, RoundingMode.HALF_UP)
          val sign = if (pct.signum() > 0) "+" else ""
          return sign + pct.toPlainString() + "%"
      }
    tests: |
      checkEqual("上漲", "+1.23%") {
          formatChangePercent(BigDecimal("100"), BigDecimal("101.234"))
      }

      checkEqual("下跌補零", "-0.50%") {
          formatChangePercent(BigDecimal("100"), BigDecimal("99.5"))
      }

      checkEqual("持平", "0.00%") {
          formatChangePercent(BigDecimal("100"), BigDecimal("100"))
      }

      checkEqual("open 為 0", "--") {
          formatChangePercent(BigDecimal("0"), BigDecimal("1"))
      }

      checkEqual("0.005 進位", "+0.01%") {
          formatChangePercent(BigDecimal("200"), BigDecimal("200.01"))
      }

      checkEqual("-0.005 遠離 0", "-0.01%") {
          formatChangePercent(BigDecimal("200"), BigDecimal("199.99"))
      }

      checkEqual("極小跌幅顯示 0.00%", "0.00%") {
          formatChangePercent(BigDecimal("100000"), BigDecimal("99999.999"))
      }

      checkEqual("不加千分位", "+15000.00%") {
          formatChangePercent(BigDecimal("1"), BigDecimal("151"))
      }

- id: exchange-precision-10
  type: open
  level: 2
  priority: P0
  tags: [architecture, money]
  prompt: |
    只顯示資料、不下單的行情 App，把價格當 `Double` 顯示通常就夠了。如果要設計交易所 App 的下單與資產頁，你會怎麼設計金額的資料型別、解析與格式化？
  promptJa: |
    表示専用の相場アプリでは価格を `Double` で扱っても多くの場合は問題になりませんが、取引所アプリで注文画面や資産画面を設計する場合、金額の型・パース・フォーマットをどう設計しますか？
  keyPoints:
    - 先說明差別：只顯示資料的行情 App，App 端沒有金額運算，數字主要用來顯示；交易所的值會影響使用者的錢
    - 交易所和錢有關的值改用 Decimal／BigDecimal，JSON 的數字當字串讀，不經過 Double
    - 在商業邏輯層定義 Money／Quantity 這類專用型別，綁定幣種與精度，不直接到處傳 Decimal
    - 依交易對設定做 tick size／step size（價格、數量的最小跳動單位）對齊，數量一律往下捨入，並檢查最小下單量
    - 格式化集中在一個地方：依精度各建一個 formatter 重複使用，不要邊用邊改共用的 formatter；顯示和計算分開
    - 雙平台的捨入規則用同一份測試案例驗證（iOS `.down` 是 floor 往負無限大，Kotlin `DOWN` 是往 0 截斷）
    - App 端只做預估和預先檢查，成交金額和手續費以伺服器回報為準
  modelAnswer: |
    只顯示資料的行情 App，App 端通常沒有任何金額運算，數字主要用來顯示。
    交易所的情況不同。下單數量、手續費、可用餘額都會影響使用者的錢，我會這樣設計：

    1. **型別**：在商業邏輯層定義 `Money`／`Quantity`，內部用 `Decimal`（iOS）和 `BigDecimal`（Android），並帶上幣種與精度。API 的數值當字串讀，不經過 `Double`。
    2. **交易規則**：交易對的 tick size（價格刻度）、step size（數量刻度）、最小下單量做成一個 `TradingRule`。價格對齊刻度，數量一律往下捨入，送出前做預檢。
    3. **格式化**：集中在一個地方，依精度各建一個 formatter 重複使用，不在使用中修改共用的 formatter；日圓沒有小數，也要支援「万／億」這類在地化顯示。
    4. **一致性**：雙平台的捨入規則寫成同一份測試案例。例如 iOS 的 `.down` 是 floor（往負無限大），Kotlin 的 `DOWN` 是往 0 截斷，負數會差 1，要在規格裡寫清楚。

    最後，App 端的計算只用來預估和提早擋掉錯誤，成交金額和手續費一律以伺服器回報為準。
  followUps:
    - 為什麼不用 Int64 存最小單位（satoshi）就好？什麼情況下會出問題？
    - 手續費應該往上還是往下捨入？由誰決定？
    - 高頻行情列表裡，formatter 會不會成為效能瓶頸？你會怎麼量測？

- id: exchange-precision-11
  type: flash
  level: 1
  priority: P0
  tags: [rounding]
  front: iOS `NSDecimalRound` 的 `.down`／`.plain` 對應到 Kotlin 的哪個 `RoundingMode`？
  back: |
    `.down` 對應 `FLOOR`（往負無限大），不是 `DOWN`。`.plain` 對應 `HALF_UP`（一般四捨五入，0.5 遠離 0），`.bankers` 對應 `HALF_EVEN`（銀行家捨入，剛好 0.5 時捨到偶數）。
    Kotlin 的 `DOWN` 是往 0 截斷（直接丟掉小數）；iOS 沒有直接對應，正數用 `.down`、負數用 `.up`。
