- id: exchange-precision-01
  type: single
  level: 1
  priority: P0
  tags: [decimal]
  prompt: |
    使用者在 BTC/JPY 取引所輸入數量 `0.12345678`、價格 `10,234,567`。下列哪一個做法最適合在 client 端計算「預估成交金額」？
  options:
    - "用 `Double` 相乘，再用 `String(format: \"%.0f\")` 顯示"
    - "用 `Decimal`／`BigDecimal` 從字串建立後相乘，結果依日圓規則往下捨入到整數再顯示"
    - "用 `Float` 計算以節省記憶體，顯示時四捨五入"
    - "先把兩個值都轉成 `Int64` 的 satoshi（BTC 的最小單位，1e-8）與日圓再相乘，不需要處理捨入"
  answer: 1
  explain: |
    和錢有關的計算要用十進位型別，而且要從**字串**建立，避免一開始就帶進二進位的誤差。
    - 第 1、3 項：`Double`、`Float` 有二進位誤差，有效位數也不夠（`Float` 只有約 7 位）。
    - 第 4 項：把數量乘上 1 億變成整數（satoshi）的思路可行，但價格乘數量之後還是要除回小數並捨入，乘積也可能超過 `Int64` 的範圍，所以「不需要處理捨入」是錯的。

- id: exchange-precision-02
  type: multi
  level: 2
  priority: P0
  tags: [bigdecimal, kotlin]
  prompt: |
    關於 Kotlin/Java 的 `BigDecimal`，哪些敘述正確？（複選）
  options:
    - "`BigDecimal(\"1.0\") == BigDecimal(\"1.00\")` 為 `false`，因為 `equals` 也比較 scale（小數位數）"
    - "`BigDecimal(0.1)` 與 `BigDecimal(\"0.1\")` 的值完全相同"
    - "`BigDecimal(\"0.00000001\").toString()` 會輸出 `1E-8`，顯示時應改用 `toPlainString()`"
    - "`BigDecimal.ONE.divide(BigDecimal(3))` 會回傳 `0.3333333333`（預設 10 位）"
    - "把 `BigDecimal(\"2.0\")` 與 `BigDecimal(\"2.00\")` 放進同一個 `HashSet`，size 是 2"
  answer: [0, 2, 4]
  explain: |
    - `equals` 與 `hashCode` 都會考慮 scale（小數位數），所以 `2.0` 和 `2.00` 放進 `HashSet` 會變成 2 個元素。比大小要用 `compareTo`。
    - `BigDecimal(0.1)` 保存的是 `Double` 的二進位近似值 `0.1000000000000000055511…`，不是真的 0.1，所以第 2 項錯。要用字串建立，或 `BigDecimal.valueOf(0.1)`。
    - 除不盡（例如 1 ÷ 3）、又沒有指定小數位數時，會丟 `ArithmeticException: Non-terminating decimal expansion`，不會自動取 10 位，所以第 4 項錯。

- id: exchange-precision-03
  type: predict
  level: 2
  priority: P0
  tags: [bigdecimal, rounding]
  prompt: |
    下列 Kotlin 程式依序印出什麼？
  codeLang: kotlin
  code: |
    import java.math.BigDecimal
    import java.math.RoundingMode

    fun main() {
        val a = BigDecimal("1.0")
        val b = BigDecimal("1.00")
        println(a == b)
        println(a.compareTo(b))
        println(setOf(a, b).size)
        println(BigDecimal("0.00000001"))
        println(BigDecimal("-1.5").setScale(0, RoundingMode.DOWN))
    }
  answer: |
    false 0 2 1E-8 -1
  explain: |
    - `==` 呼叫 `equals`，會比較 scale，所以是 `false`。`compareTo` 只比數值，回傳 `0`。
    - `Set` 用 `hashCode` 和 `equals` 判斷重複，兩者 scale 不同，算兩個元素。
    - `toString()` 在指數小於 -6 時會改用科學記號。
    - `RoundingMode.DOWN` 是**往 0 的方向**截斷（直接丟掉小數），所以 `-1.5` 變成 `-1`。要往負無限大取整（floor）要用 `FLOOR`。

- id: exchange-precision-04
  type: predict
  level: 3
  priority: P1
  tags: [decimal, rounding, swift]
  prompt: |
    同一個需求「把損益 `-1.5` 往下取整」，iOS 工程師寫了下面的程式。印出什麼？（依序）
  codeLang: swift
  code: |
    import Foundation

    var value = Decimal(string: "-1.5")!
    var result = Decimal()
    NSDecimalRound(&result, &value, 0, .down)
    print(result)
    print(0.1 + 0.2 == 0.3)
  answer: |
    -2 false
  explain: |
    `NSDecimalRound` 的 `.down` 是往**負無限大**取整（floor），所以 `-1.5` 變成 `-2`。
    Android 的 `RoundingMode.DOWN` 是往 0 截斷（直接丟掉小數），同樣的輸入得到 `-1`。兩個平台會差 1。
    可能出現負值的欄位（損益、資金費率），在規格上要寫清楚是 floor 還是 truncate（截斷），並用同一組測試案例在兩端各驗證一次。

- id: exchange-precision-05
  type: fill
  level: 2
  priority: P1
  tags: [formatstyle, swift]
  prompt: |
    iOS 15+：把價格顯示成小數 2 位，並且**一律往下捨入**（不要四捨五入）。
  codeLang: swift
  code: |
    let text = price.formatted(
        .number
            .precision(.____(2))
            .____(rule: .down)
    )
  blanks:
    - [fractionLength]
    - [rounded]
  explain: |
    `FormatStyle` 是 iOS 15 加入的格式化 API，寫法比 `NumberFormatter` 簡單，系統內部也會幫你重用格式化工具，不必自己管理 `NumberFormatter` 的建立和共用。
    `.precision(.fractionLength(2))` 控制小數位數，`.rounded(rule: .down)` 控制捨入方向。
    如果 App 的最低支援版本是 iOS 15，就可以全面採用。

- id: exchange-precision-06
  type: fill
  level: 1
  priority: P0
  tags: [bigdecimal, kotlin]
  prompt: |
    Android：使用者按「全部賣出」，把可用餘額依交易對的數量精度 `amountPrecision`（小數位數）捨入，**不能超過可用餘額**。
  codeLang: kotlin
  code: |
    val qty = available.____(amountPrecision, RoundingMode.____)
  blanks:
    - [setScale]
    - [DOWN, FLOOR]
  explain: |
    餘額一定是正數，所以這裡 `DOWN`（往 0）與 `FLOOR`（往負無限大）結果相同，兩者都接受。
    重點是**不能往上進位**，否則送出的數量會超過可用餘額，被伺服器拒絕。

