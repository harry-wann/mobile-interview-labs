    solution: |
      import java.math.BigDecimal
      import java.math.RoundingMode
      import java.util.TreeMap

      data class PriceLevel(val price: BigDecimal, val qty: BigDecimal)

      enum class Side { BID, ASK }

      fun aggregate(levels: List<PriceLevel>, step: BigDecimal, side: Side): List<PriceLevel> {
          val buckets = TreeMap<BigDecimal, BigDecimal>()
          for (l in levels) {
              if (l.qty.signum() <= 0) continue
              val price = if (step.signum() > 0) {
                  val mode = if (side == Side.BID) RoundingMode.FLOOR else RoundingMode.CEILING
                  l.price.divide(step, 0, mode).multiply(step)
              } else l.price
              buckets.merge(price, l.qty) { a, b -> a.add(b) }
          }
          val out = buckets.map { PriceLevel(it.key, it.value) }
          return if (side == Side.BID) out.reversed() else out
      }

      fun cumulative(levels: List<PriceLevel>): List<BigDecimal> {
          var running = BigDecimal.ZERO
          return levels.map { running = running.add(it.qty); running }
      }
    tests: |
      import java.math.BigDecimal

      fun L(p: String, q: String) = PriceLevel(BigDecimal(p), BigDecimal(q))
      fun txt(ls: List<PriceLevel>) = ls.map { it.price.stripTrailingZeros().toPlainString() + "@" + it.qty.stripTrailingZeros().toPlainString() }
      fun plain(ds: List<BigDecimal>) = ds.map { it.stripTrailingZeros().toPlainString() }

      checkEqual("買方往下取整並合併", listOf("100@3", "99@3")) {
          txt(aggregate(listOf(L("100.7", "1"), L("100.2", "2"), L("99.9", "3")), BigDecimal("1"), Side.BID))
      }
      checkEqual("賣方往上取整並合併", listOf("101@7")) {
          txt(aggregate(listOf(L("100.1", "1"), L("100.9", "2"), L("101.0", "4")), BigDecimal("1"), Side.ASK))
      }
      checkEqual("step 為 0.5（買方）", listOf("100.5@2", "100@2")) {
          txt(aggregate(listOf(L("100.74", "1"), L("100.50", "1"), L("100.49", "2")), BigDecimal("0.5"), Side.BID))
      }
      checkEqual("step 為 10（賣方），已對齊的價位不往上多跳一檔", listOf("110@3", "120@3")) {
          txt(aggregate(listOf(L("101", "1"), L("110", "2"), L("111", "3")), BigDecimal("10"), Side.ASK))
      }
      checkEqual("step <= 0：不聚合，只排序", listOf("100@2", "99@1")) {
          txt(aggregate(listOf(L("99", "1"), L("100", "2")), BigDecimal("0"), Side.BID))
      }
      checkEqual("數量 <= 0 的檔位忽略；輸入未排序時輸出依方向排序", listOf("101@2", "102@1")) {
          txt(aggregate(listOf(L("101", "2"), L("103", "0"), L("102", "1")), BigDecimal("1"), Side.ASK))
      }
      checkEqual("空輸入", 0) { aggregate(emptyList(), BigDecimal("1"), Side.BID).size }
      checkEqual("累計數量", listOf("1", "3", "3.5")) {
          plain(cumulative(listOf(L("100", "1"), L("99", "2"), L("98", "0.5"))))
      }
      checkEqual("累計：空陣列", 0) { cumulative(emptyList()).size }

- id: exchange-order-book-09
  type: open
  level: 2
  priority: P0
  tags: [order-book, architecture]
  prompt: |
    設計交易所 App 的「訂單簿」資料層與畫面：資料如何進來、如何保持正確、如何呈現與更新？請區分這套交易所 API 文件中看到的完整快照頻道與一般交易所的增量頻道，並說明你的相關經驗。
  promptJa: |
    取引所アプリの「板情報」のデータ層と画面を設計してください。データの取り込み方、正しさの保ち方、表示と更新の方法を説明してください。この取引所 API のドキュメントにある完全スナップショットのチャンネルと、一般的な取引所の差分チャンネルの違いも整理し、関連する経験も説明してください。
  keyPoints:
    - "這套交易所 API 文件：depth 頻道推送完整 `bids`／`asks`（無序號），REST 有 `version`；`bbo` 有 `seqId`；增量簿頻道是否存在以 API 文件為準"
    - "完整快照型（每次推整份板）：直接取代，用 `ts` 丟棄順序顛倒的舊資料；增量型（只推變動的檔位）：先緩衝、再取快照、丟棄 ≤ 快照 seq、逐筆檢查 `seq == last + 1`、跳號就重新同步"
    - "資料結構：Decimal／BigDecimal 價格、排序結構、數量 0 即刪除；交叉簿（買價高於等於賣價）檢查；重連與回前景走同一條重新同步路徑"
    - "呈現：10–20 檔、依 step 合併（買方往下、賣方往上取整）、累計數量與深度條、等寬數字；點價格帶入下單表單並對齊 tick size"
    - "更新：背景套用與合併，固定頻率取一份目前的板，以價格當識別做 diff，只更新變動的列（iOS `reconfigureItems`、Android `DiffUtil`）"
    - "斷線或重新同步時標示資料過期，並禁止用過期的簿估算成交價或下單"
    - "經驗：即時行情 App 的 K 線在套用更新前先檢查能不能接上（時間相同取代、差距是週期整數倍才新增、其他丟棄），回前景補抓；訂單簿的套用、合併、累計用 Decimal 和純函式練習過"
  modelAnswer: |
    先分清楚資料來源。這套交易所的 API 文件裡，depth 頻道每次推送都是完整的 `bids`／`asks`，沒有序號，所以我會把它當快照（整份最新的板）：直接取代本地簿，用 `ts` 丟掉順序顛倒的舊資料。如果日後要用增量頻道（只推變動的檔位），或對接其他有增量的交易所，流程是先緩衝增量、再取快照、丟棄序號不超過快照的增量、之後每筆都檢查 `seq == last + 1`，有跳號就把簿標為失效並重新同步。重連和回前景都走同一條重新同步路徑。

    資料層用 Decimal／BigDecimal，數量 0 代表刪除，並檢查最佳買價不能高於等於最佳賣價。呈現上顯示 10 到 20 檔，依 step 合併時買方往下、賣方往上取整，畫累計數量與深度條；點價格帶入下單表單時要對齊 tick size。更新方面，背景先套用與合併（多筆更新只留最新一筆），再以固定頻率取一份目前的板，用價格當識別做 diff（比較新舊兩版，只更新變動的列），數字用等寬數字。斷線或重新同步時要標示資料過期，並禁止用過期的簿估算成交價或下單。

    經驗上，我在一個即時行情 App 做過即時 K 線：套用每一筆更新前，先檢查能不能接上（同一時間就取代，差距是週期的整數倍才新增，其他丟掉），回前景時重新抓資料補齊。訂單簿的套用、合併和累計，我用 Decimal 和純函式練習過。概念是相通的，到交易所的 App 我會把這套檢查用在訂單簿上。
  modelAnswerJa: |
    まずデータの出所を区別します。この取引所 API のドキュメントでは、depth チャンネルは毎回完全な `bids`／`asks` を送ってきて、シーケンス番号はありません。そのためスナップショットとして扱い、ローカルの板を丸ごと置き換え、`ts` で順序が逆転した古いデータを捨てます。将来、差分チャンネルを使う場合や、差分のある他の取引所に対応する場合の手順は、まず差分をバッファし、次にスナップショットを取得し、スナップショットのシーケンス番号以下の差分を捨て、以降は毎回 `seq == last + 1` を確認して、欠落があれば板を無効にして再同期します。再接続とフォアグラウンド復帰も、同じ再同期の経路を通します。

    データ層は Decimal／BigDecimal を使い、数量 0 は削除として扱い、最良買値が最良売値以上にならないかも確認します。表示は 10〜20 本で、集約するときは買いを切り捨て、売りを切り上げ、累計数量と深度バーを描きます。価格をタップして注文フォームに入れるときは tick size に合わせます。更新はバックグラウンドで適用してまとめ（複数の更新のうち最新の 1 件だけを残し）、一定間隔で現在の板を取り出して、価格を識別子にして差分を取り、変わった行だけ更新します。数字は等幅数字を使います。切断中や再同期中はデータが古いことを表示し、古い板で約定価格を見積もったり発注したりしないようにします。

    経験としては、相場アプリのリアルタイムのローソク足で、更新を適用する前に連続して接続できるかを確認し（同じ時刻なら置き換え、期間の整数倍の差のときだけ追加し、それ以外は捨てる）、フォアグラウンド復帰時にデータを再取得して補っていました。板情報の適用、集約、累計は Decimal と純粋関数で練習しました。考え方は共通なので、取引所アプリではこの確認を板情報にも使います。
  followUps:
    - "完整快照型頻道的推送頻率很高，你會在哪一層合併？"
    - "增量簿套用到一半 App 進背景，回來時要做什麼？"
    - "如何測試序號檢查？有哪些邊界案例？"
  timeLimitSec: 150

- id: exchange-order-book-10
  type: flash
  level: 1
  priority: P0
  tags: [order-book]
  front: 增量簿的規則與聚合方向速記
  back: |
    - 順序：先**緩衝**增量 → 取快照 → 丟棄 `seq ≤ 快照 seq` → 逐筆 `seq == last + 1` → 跳號（漏了幾筆）就失效並重新同步。
    - 數量 0＝刪除；`bestBid >= bestAsk`＝交叉簿（買方最高價不低於賣方最低價）＝重新同步；`BigDecimal` 用 `TreeMap`／`compareTo`。
    - 聚合（把相近價格合併成一檔）：買往下（floor）、賣往上（ceil），再合併數量（這套 API 的 stepN 實際方向文件沒有明講）。
    - 這套 API 文件：`depth.stepN` 每次推完整快照（無序號）；`bbo` 有 `seqId`；REST `type=step0..5`，step1＝價格精度×10。
