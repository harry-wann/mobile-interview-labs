    solution: |
      import Foundation

      struct PriceLevel: Equatable {
          let price: Decimal
          let qty: Decimal
      }

      enum ApplyResult: Equatable {
          case applied
          case stale
          case gap(expected: Int64, got: Int64)
          case needsSnapshot
          case crossed
      }

      struct OrderBook {
          private var bidMap: [Decimal: Decimal] = [:]
          private var askMap: [Decimal: Decimal] = [:]
          private var lastSeq: Int64?

          var isValid: Bool { lastSeq != nil }
          var bids: [PriceLevel] {
              bidMap.map { PriceLevel(price: $0.key, qty: $0.value) }.sorted { $0.price > $1.price }
          }
          var asks: [PriceLevel] {
              askMap.map { PriceLevel(price: $0.key, qty: $0.value) }.sorted { $0.price < $1.price }
          }
          var bestBid: PriceLevel? { bids.first }
          var bestAsk: PriceLevel? { asks.first }

          mutating func reset(seq: Int64, bids: [PriceLevel], asks: [PriceLevel]) {
              bidMap = [:]
              askMap = [:]
              for l in bids where l.qty > 0 { bidMap[l.price] = l.qty }
              for l in asks where l.qty > 0 { askMap[l.price] = l.qty }
              lastSeq = seq
          }

          mutating func apply(seq: Int64, bids: [PriceLevel], asks: [PriceLevel]) -> ApplyResult {
              guard let last = lastSeq else { return .needsSnapshot }
              if seq <= last { return .stale }
              if seq != last + 1 {
                  lastSeq = nil
                  return .gap(expected: last + 1, got: seq)
              }
              for l in bids { bidMap[l.price] = l.qty > 0 ? l.qty : nil }
              for l in asks { askMap[l.price] = l.qty > 0 ? l.qty : nil }
              lastSeq = seq
              if let bb = bestBid, let ba = bestAsk, bb.price >= ba.price {
                  lastSeq = nil
                  return .crossed
              }
              return .applied
          }
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }
      func L(_ p: String, _ q: String) -> PriceLevel { PriceLevel(price: D(p), qty: D(q)) }
      func snapshotBook() -> OrderBook {
          var b = OrderBook()
          b.reset(seq: 10, bids: [L("98", "3"), L("100", "1"), L("99", "2"), L("97", "0")],
                  asks: [L("102", "2"), L("101", "1")])
          return b
      }

      check("快照：買方由高到低、賣方由低到高、忽略數量為 0 的檔位") {
          let b = snapshotBook()
          return b.isValid
              && b.bids == [L("100", "1"), L("99", "2"), L("98", "3")]
              && b.asks == [L("101", "1"), L("102", "2")]
              && b.bestBid == L("100", "1") && b.bestAsk == L("101", "1")
      }
      check("seq 連續：新增與更新價位") {
          var b = snapshotBook()
          let r = b.apply(seq: 11, bids: [L("99", "5"), L("99.5", "1")], asks: [L("101", "0.5")])
          return r == .applied
              && b.bids == [L("100", "1"), L("99.5", "1"), L("99", "5"), L("98", "3")]
              && b.asks == [L("101", "0.5"), L("102", "2")]
      }
      check("數量為 0 代表刪除，100.0 與 100 是同一檔") {
          var b = snapshotBook()
          let r = b.apply(seq: 11, bids: [L("100.0", "0")], asks: [])
          return r == .applied && b.bestBid == L("99", "2") && b.bids.count == 2
      }
      check("重複或過期的 seq → stale，簿不變，之後仍可接續") {
          var b = snapshotBook()
          let r1 = b.apply(seq: 10, bids: [L("100", "9")], asks: [])
          let r2 = b.apply(seq: 5, bids: [L("100", "9")], asks: [])
          let r3 = b.apply(seq: 11, bids: [L("100", "2")], asks: [])
          return r1 == .stale && r2 == .stale && r3 == .applied && b.bestBid == L("100", "2")
      }
      check("缺口 → gap，簿失效；失效後即使 seq 正確也要先 reset") {
          var b = snapshotBook()
          let r1 = b.apply(seq: 12, bids: [L("100", "9")], asks: [])
          let valid1 = b.isValid
          let r2 = b.apply(seq: 11, bids: [L("100", "9")], asks: [])
          return r1 == .gap(expected: 11, got: 12) && !valid1 && r2 == .needsSnapshot
              && b.bestBid == L("100", "1")
      }
      check("還沒有快照就收到增量 → needsSnapshot") {
          var b = OrderBook()
          return b.apply(seq: 1, bids: [L("100", "1")], asks: []) == .needsSnapshot && b.bids.isEmpty
      }
      check("交叉簿（最佳買價 >= 最佳賣價）→ crossed，簿失效") {
          var b = snapshotBook()
          let r = b.apply(seq: 11, bids: [L("101.5", "1")], asks: [])
          return r == .crossed && !b.isValid
      }
      check("重新同步：reset 後從新的 seq 繼續") {
          var b = snapshotBook()
          _ = b.apply(seq: 20, bids: [], asks: [])
          b.reset(seq: 30, bids: [L("200", "1")], asks: [L("201", "1")])
          let r = b.apply(seq: 31, bids: [L("200", "2")], asks: [])
          return r == .applied && b.isValid && b.bids == [L("200", "2")]
      }
