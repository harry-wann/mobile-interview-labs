    solution: |
      import Foundation

      struct PriceLevel: Equatable {
          let price: Decimal
          let qty: Decimal
      }

      enum Side { case bid, ask }

      func aggregate(_ levels: [PriceLevel], step: Decimal, side: Side) -> [PriceLevel] {
          var buckets: [Decimal: Decimal] = [:]
          for l in levels where l.qty > 0 {
              var price = l.price
              if step > 0 {
                  var q = l.price / step
                  var r = Decimal()
                  NSDecimalRound(&r, &q, 0, side == .bid ? .down : .up)
                  price = r * step
              }
              buckets[price, default: 0] += l.qty
          }
          let out = buckets.map { PriceLevel(price: $0.key, qty: $0.value) }
          return out.sorted { side == .bid ? $0.price > $1.price : $0.price < $1.price }
      }

      func cumulative(_ levels: [PriceLevel]) -> [Decimal] {
          var running: Decimal = 0
          return levels.map { running += $0.qty; return running }
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }
      func L(_ p: String, _ q: String) -> PriceLevel { PriceLevel(price: D(p), qty: D(q)) }

