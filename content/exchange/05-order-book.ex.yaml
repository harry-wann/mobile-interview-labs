      }
      checkEqual("step 為 10（賣方），已對齊的價位不往上多跳一檔", [L("110", "3"), L("120", "3")]) {
          aggregate([L("101", "1"), L("110", "2"), L("111", "3")], step: D("10"), side: .ask)
      }
      checkEqual("step <= 0：不聚合，只排序", [L("100", "2"), L("99", "1")]) {
          aggregate([L("99", "1"), L("100", "2")], step: D("0"), side: .bid)
