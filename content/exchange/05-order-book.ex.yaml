          val bids: List<PriceLevel> get() = emptyList()
          val asks: List<PriceLevel> get() = emptyList()
          val bestBid: PriceLevel? get() = null
          val bestAsk: PriceLevel? get() = null

          fun reset(seq: Long, bids: List<PriceLevel>, asks: List<PriceLevel>) {
