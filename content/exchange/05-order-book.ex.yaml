- id: exchange-order-book-01
  type: single
  level: 1
  priority: P0
  tags: [depth, snapshot]
  prompt: |
    這套交易所公開 WebSocket 的 `market.btcjpy.depth.step0`，API 文件範例每次推送都帶有完整的 `bids` 與 `asks`（整份板的買單與賣單），沒有序號欄位。App 收到一筆推送後，最合理的處理是？
  options:
    - "把推送的檔位逐一「加到」本地簿上，數量相加"
    - "視為**完整快照**（整份最新的板），直接用它取代本地簿（頂多保留 `ts` 判斷是否比上一版新），不需要序號檢查與跳號時的重新同步"
    - "忽略推送，只使用 REST 的 `/market/depth`"
    - "只更新數量有變的價位，其他價位維持原狀"
  answer: 1
  explain: |
    文件範例每次都帶完整的 `bids` 和 `asks`，沒有序號，所以看起來是每次推整份最新的板（完整快照）。逐筆增量（只告訴你哪些檔位變了，需要用序號檢查）是另一種設計，公開的 topic 清單裡沒有看到；實際行為以實測為準（未證實）。
    - 第 1 項錯：推送的是整份板的絕對數量，不是「變動量」，相加會讓數量越算越大。
    - 第 3 項錯：REST 是問一次答一次，沒辦法即時更新，WebSocket 的推送才是即時資料的來源。
    - 第 4 項錯：只更新有變的價位，是增量更新的做法；完整快照沒有出現的價位，代表它已經不在這份板裡（被吃掉或掉出顯示範圍），舊的檔位也要一起移除，直接整份取代最單純。
    用快照取代時要注意：`ts`（時間戳）可以用來丟掉順序顛倒的舊快照；高頻推送要在背景合併（只留最新一筆）後再更新畫面。

- id: exchange-order-book-02
  type: order
  level: 2
  priority: P0
  tags: [incremental, resync]
  prompt: |
    某個交易所提供「增量簿」頻道（推送的只是「哪些檔位變了」，每筆增量有連續遞增的 `seq`）。排列 App 初始化與維護本地簿的正確流程。
  items:
    - "連上 WebSocket，開始**緩衝**收到的增量（先不套用）"
    - "取得簿的快照（REST 或 `req`），記下快照的 `seq`"
    - "丟棄緩衝中 `seq <= 快照 seq` 的增量"
    - "依序套用剩下的增量，每筆都檢查 `seq == lastSeq + 1`"
    - "發現跳號（`seq > lastSeq + 1`）時，把簿標為失效並從頭重新同步"
  explain: |
    - 必須「先緩衝、再取快照」：如果先取快照再連線，兩者之間產生的增量會遺失。
    - 快照已經包含 `seq` 不超過它的所有變更，所以緩衝裡這一段要丟掉，重複套用會讓數量算錯。
    - 快照之後的第一筆增量必須接得上快照的序號；之後每一筆都要檢查 `seq == lastSeq + 1`。
    - 接不上就是跳號（中間漏了幾筆），簿已經不可信，要失效並重新同步。
    跳號、重連、回前景（背景期間漏掉增量）、解析失敗，都走同一條「失效、重新同步」路徑，期間畫面標示更新中，或維持上一版並標為過期。

- id: exchange-order-book-03
  type: multi
  level: 2
  priority: P0
  tags: [order-book, decimal]
  prompt: |
    關於訂單簿的實作，哪些敘述正確？（複選）
  options:
    - "增量中某價位的數量為 0，代表刪除該價位"
    - "`bestBid >= bestAsk` 表示簿處於交叉狀態（買方最高價不低於賣方最低價），資料不一致，應重新同步"
    - "用 `Double` 當價格的字典 key 最簡單，沒有精度問題"
    - "Java／Kotlin 的 `HashMap<BigDecimal, …>` 對 `100.0` 與 `100` 會視為同一個 key"
    - "收到 `seq` 比 `lastSeq` 小或相等的增量，應直接忽略（重複或過期）"
  answer: [0, 1, 4]
  explain: |
    - 第 1 項對：數量 0 是「這一檔沒有單了」，要把該價位整個移除，不是顯示 0。
    - 第 2 項對：正常的板不可能買價高於等於賣價（早就成交了），出現代表資料出錯。
    - 第 3 項錯：`Double` 當 key 會有 `0.1 + 0.2` 這類精度問題，價位對不上。
    - 第 4 項錯：`BigDecimal.equals` 會連小數位數（scale）一起比，`100.0` 與 `100` 不相等，放進 `HashMap` 會變成兩檔；要用 `TreeMap`（以 `compareTo` 排序）或先 `stripTrailingZeros()`（見精度與金額單元）。
    - 第 5 項對：重複與過期的增量忽略；真正需要重新同步的是**跳號**。

- id: exchange-order-book-04
  type: single
  level: 2
  priority: P1
  tags: [aggregation, rounding]
  prompt: |
    把 BTC/JPY 的簿依 step ＝ 1,000 円 聚合顯示（把相近價格合併成一檔）。買方的 `4,860,380` 與賣方的 `4,860,850` 分別應該歸到哪一檔，為什麼？
  options:
    - "買方 4,861,000、賣方 4,860,000（四捨五入，最接近）"
    - "買方 4,860,000（往下）、賣方 4,861,000（往上）。買方往下、賣方往上取整，聚合後的最佳買價不會比真實買價高、最佳賣價不會比真實賣價低，不會讓使用者誤以為成交條件更有利"
    - "兩邊都往下取整，因為數量一律往下捨入"
    - "兩邊都往上取整，這樣價差看起來比較小"
  answer: 1
  explain: |
    這是常見的聚合慣例（買方 floor 往下、賣方 ceil 往上）。
    - 第 1 項錯：四捨五入的結果還弄反了方向（4,860,380 離 4,860,000 比較近，不會變成 4,861,000），而且四捨五入可能讓買價比真實的更高，使用者會誤以為有人願意出更高的價。
    - 第 3 項錯：數量往下捨入是下單的規則，與簿的聚合方向無關；賣方往下取整會讓最佳賣價比真實的更低，看起來更便宜。
    - 第 4 項錯：兩邊都往上，買方價格會被墊高；價差看起來比較小，是在誤導使用者。
    這套 API 的 `type=stepN` 實際取整方向文件沒有明講（未證實），自己在 App 聚合時才由你決定，並要在規格中寫清楚。實作要用 `Decimal`／`BigDecimal`：`price / step` 取整再乘回 `step`。

- id: exchange-order-book-05
  type: predict
  level: 2
  priority: P1
  tags: [aggregation, decimal, swift]
  prompt: |
    下列程式依序印出什麼？
  codeLang: swift
  code: |
    import Foundation

    func D(_ s: String) -> Decimal { Decimal(string: s)! }

    func toStep(_ price: Decimal, _ step: Decimal, up: Bool) -> Decimal {
        var q = price / step
        var r = Decimal()
        NSDecimalRound(&r, &q, 0, up ? .up : .down)
        return r * step
    }

    print(toStep(D("100.7"), D("0.5"), up: false))
    print(toStep(D("100.7"), D("0.5"), up: true))
    print(toStep(D("99.9"), D("1"), up: false))
    print(toStep(D("100"), D("1"), up: true))
  answer: |
    100.5 101 99 100
  explain: |
    - `100.7 ÷ 0.5 ＝ 201.4`，往下取整 201，乘回 0.5 得 `100.5`。
    - 同樣的 201.4 往上取整 202，乘回得 `101`。
    - `99.9` 往下取整到 1 的倍數是 `99`。
    - 已經對齊的 `100` 往上取整仍是 `100`（不會多跳一檔）。
    注意正數時 `NSDecimalRound` 的 `.down` 是往小、`.up` 是往大（負數的行為見精度與金額單元）。

- id: exchange-order-book-06
  type: single
  level: 3
  priority: P0
  tags: [resync, sequence, buffer]
  prompt: |
    增量簿的快照 `seq = 100`（快照已包含序號 100 以前的所有變更）。你緩衝到的增量序號依序是 98、99、100、101、103。正確的處理是？
  options:
    - "全部依序套用，缺 102 也沒關係，下一筆會補上"
    - "丟棄 98、99、100（≤ 100），套用 101（接得上快照），遇到 103 時發現跳號（期望 102），把簿標為失效並重新同步（重新取快照）"
    - "丟棄 98、99，套用 100、101、103"
    - "因為 103 沒接上，丟棄整個緩衝區並直接把 103 當作新的起點"
  answer: 1
  explain: |
    快照已經包含序號 ≤ 100 的所有變更，所以 98、99、100 要丟棄（重複套用會讓數量錯誤）。101 的 `seq == 100 + 1`，接得上；103 期望的是 102，缺了一筆，簿已不可信，必須重新同步。
    - 第 1 項錯：102 不會自動補上，漏掉的那一筆可能刪除了某個檔位，不套用，板上就會留下已經不存在的檔位。
    - 第 3 項錯：100 已經包含在快照裡，重複套用會讓數量算錯；而且 103 仍然是跳號。
    - 第 4 項錯：把 103 當起點會讓簿缺少 102 的變更；真正的做法是重新取一份快照。

