          }

          fun apply(seq: Long, bids: List<PriceLevel>, asks: List<PriceLevel>): ApplyResult {
              // TODO
              return ApplyResult.Applied
          }
      }
    solution: |
      import java.math.BigDecimal
      import java.util.TreeMap

      data class PriceLevel(val price: BigDecimal, val qty: BigDecimal)

      sealed class ApplyResult {
          object Applied : ApplyResult()
          object Stale : ApplyResult()
          data class Gap(val expected: Long, val got: Long) : ApplyResult()
          object NeedsSnapshot : ApplyResult()
          object Crossed : ApplyResult()
      }

      class OrderBook {
          private val bidMap = TreeMap<BigDecimal, BigDecimal>(Comparator.reverseOrder())
          private val askMap = TreeMap<BigDecimal, BigDecimal>()
          private var lastSeq: Long? = null

          val isValid: Boolean get() = lastSeq != null
          val bids: List<PriceLevel> get() = bidMap.map { PriceLevel(it.key, it.value) }
          val asks: List<PriceLevel> get() = askMap.map { PriceLevel(it.key, it.value) }
          val bestBid: PriceLevel? get() = bidMap.firstEntry()?.let { PriceLevel(it.key, it.value) }
          val bestAsk: PriceLevel? get() = askMap.firstEntry()?.let { PriceLevel(it.key, it.value) }

          fun reset(seq: Long, bids: List<PriceLevel>, asks: List<PriceLevel>) {
              bidMap.clear()
              askMap.clear()
              for (l in bids) if (l.qty.signum() > 0) bidMap[l.price] = l.qty
              for (l in asks) if (l.qty.signum() > 0) askMap[l.price] = l.qty
              lastSeq = seq
          }

          fun apply(seq: Long, bids: List<PriceLevel>, asks: List<PriceLevel>): ApplyResult {
              val last = lastSeq ?: return ApplyResult.NeedsSnapshot
              if (seq <= last) return ApplyResult.Stale
              if (seq != last + 1) {
                  lastSeq = null
                  return ApplyResult.Gap(last + 1, seq)
              }
              for (l in bids) if (l.qty.signum() > 0) bidMap[l.price] = l.qty else bidMap.remove(l.price)
              for (l in asks) if (l.qty.signum() > 0) askMap[l.price] = l.qty else askMap.remove(l.price)
              lastSeq = seq
              val bb = bestBid
              val ba = bestAsk
              if (bb != null && ba != null && bb.price >= ba.price) {
                  lastSeq = null
                  return ApplyResult.Crossed
              }
              return ApplyResult.Applied
          }
      }
    tests: |
      import java.math.BigDecimal

      fun L(p: String, q: String) = PriceLevel(BigDecimal(p), BigDecimal(q))
      fun txt(ls: List<PriceLevel>) = ls.map { it.price.stripTrailingZeros().toPlainString() + "@" + it.qty.stripTrailingZeros().toPlainString() }
      fun txt1(l: PriceLevel?) = l?.let { it.price.stripTrailingZeros().toPlainString() + "@" + it.qty.stripTrailingZeros().toPlainString() }
      fun snapshotBook(): OrderBook {
          val b = OrderBook()
          b.reset(10, listOf(L("98", "3"), L("100", "1"), L("99", "2"), L("97", "0")), listOf(L("102", "2"), L("101", "1")))
          return b
      }

      check("快照：買方由高到低、賣方由低到高、忽略數量為 0 的檔位") {
          val b = snapshotBook()
          b.isValid && txt(b.bids) == listOf("100@1", "99@2", "98@3") && txt(b.asks) == listOf("101@1", "102@2") &&
              txt1(b.bestBid) == "100@1" && txt1(b.bestAsk) == "101@1"
      }
      check("seq 連續：新增與更新價位") {
          val b = snapshotBook()
          val r = b.apply(11, listOf(L("99", "5"), L("99.5", "1")), listOf(L("101", "0.5")))
          r == ApplyResult.Applied && txt(b.bids) == listOf("100@1", "99.5@1", "99@5", "98@3") &&
              txt(b.asks) == listOf("101@0.5", "102@2")
      }
      check("數量為 0 代表刪除，100.0 與 100 是同一檔") {
          val b = snapshotBook()
          val r = b.apply(11, listOf(L("100.0", "0")), emptyList())
          r == ApplyResult.Applied && txt1(b.bestBid) == "99@2" && b.bids.size == 2
      }
      check("重複或過期的 seq → stale，簿不變，之後仍可接續") {
          val b = snapshotBook()
          val r1 = b.apply(10, listOf(L("100", "9")), emptyList())
          val r2 = b.apply(5, listOf(L("100", "9")), emptyList())
          val r3 = b.apply(11, listOf(L("100", "2")), emptyList())
          r1 == ApplyResult.Stale && r2 == ApplyResult.Stale && r3 == ApplyResult.Applied && txt1(b.bestBid) == "100@2"
      }
      check("缺口 → gap，簿失效；失效後即使 seq 正確也要先 reset") {
          val b = snapshotBook()
          val r1 = b.apply(12, listOf(L("100", "9")), emptyList())
          val valid1 = b.isValid
          val r2 = b.apply(11, listOf(L("100", "9")), emptyList())
          r1 == ApplyResult.Gap(11, 12) && !valid1 && r2 == ApplyResult.NeedsSnapshot && txt1(b.bestBid) == "100@1"
      }
      check("還沒有快照就收到增量 → needsSnapshot") {
          val b = OrderBook()
          b.apply(1, listOf(L("100", "1")), emptyList()) == ApplyResult.NeedsSnapshot && b.bids.isEmpty()
      }
      check("交叉簿（最佳買價 >= 最佳賣價）→ crossed，簿失效") {
          val b = snapshotBook()
          val r = b.apply(11, listOf(L("101.5", "1")), emptyList())
          r == ApplyResult.Crossed && !b.isValid
      }
      check("重新同步：reset 後從新的 seq 繼續") {
          val b = snapshotBook()
          b.apply(20, emptyList(), emptyList())
          b.reset(30, listOf(L("200", "1")), listOf(L("201", "1")))
          val r = b.apply(31, listOf(L("200", "2")), emptyList())
          r == ApplyResult.Applied && b.isValid && txt(b.bids) == listOf("200@2")
      }

