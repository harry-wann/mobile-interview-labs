  front: 交易所公開 WebSocket（Huobi 相容）：心跳、訊息種類、gzip 重點
  back: |
    - **gzip 二進位 frame**（每則訊息都是壓縮過的），App 自己解壓（iOS：`COMPRESSION_ZLIB` 是 raw DEFLATE，要跳過 gzip 標頭；Android：`GZIPInputStream`）。
    - **ping**：伺服器約 5 秒送 `{"ping":ts}` → App 回 `{"pong":ts}`（原值），連續 2 次沒回就斷線。私有：`{"action":"ping"|"pong","data":{"ts":...}}`。
    - `sub`（訂閱）／`unsub`（退訂）／`req`（一次性請求）＋`id`；回覆 `subbed`／`unsubbed`／`rep`；推送 `ch`＋`tick`（depth 是 `data`）；`freq-ms` 只能填 1000 到 5000 的整千毫秒。
    - topic：`market.$symbol.kline.$period|depth.$type|bbo|trade.detail|detail`。
    - 私有 `/ws/v2`：先送 `auth`（SignatureVersion 2.1）；`trade.clearing` 的通知順序不保證。
