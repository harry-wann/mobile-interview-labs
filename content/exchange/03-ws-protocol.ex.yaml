    solution: |
      import Foundation

      func parseJSONObject(_ text: String) -> [String: Any]? {
          guard let data = text.data(using: .utf8),
                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
          return obj
      }

      func integerValue(_ any: Any?) -> Int64? {
          guard let n = any as? NSNumber, CFGetTypeID(n) != CFBooleanGetTypeID() else { return nil }
          let d = n.doubleValue
          guard d == d.rounded(), abs(d) < 9.0e15 else { return nil }
          return n.int64Value
      }

      func stringValue(_ any: Any?) -> String? { any as? String }

      enum WSAction: Equatable {
          case send(String)
          case subscribed(id: String?, topic: String)
          case unsubscribed(id: String?, topic: String)
          case reply(id: String?, topic: String)
          case push(symbol: String, kind: String, param: String?)
          case error(id: String?, code: String, message: String)
          case ignore
      }

      private func parseTopic(_ ch: String) -> WSAction? {
          let parts = ch.split(separator: ".", omittingEmptySubsequences: false).map(String.init)
          guard parts.count >= 3, parts[0] == "market", !parts[1].isEmpty else { return nil }
          let symbol = parts[1]
          let rest = Array(parts[2...])
          switch rest {
          case ["bbo"]: return .push(symbol: symbol, kind: "bbo", param: nil)
          case ["detail"]: return .push(symbol: symbol, kind: "detail", param: nil)
          case ["trade", "detail"]: return .push(symbol: symbol, kind: "trade.detail", param: nil)
          case _ where rest.count == 2 && (rest[0] == "kline" || rest[0] == "depth") && !rest[1].isEmpty:
              return .push(symbol: symbol, kind: rest[0], param: rest[1])
          default: return nil
          }
      }

      func handleFrame(_ json: String) -> WSAction {
          guard let obj = parseJSONObject(json) else { return .ignore }

          if obj["ping"] != nil {
              if let v = integerValue(obj["ping"]) { return .send("{\"pong\":\(v)}") }
              return .ignore
          }
          if obj["pong"] != nil { return .ignore }
          if stringValue(obj["action"]) == "ping",
             let data = obj["data"] as? [String: Any], let ts = integerValue(data["ts"]) {
              return .send("{\"action\":\"pong\",\"data\":{\"ts\":\(ts)}}")
          }

          let id = stringValue(obj["id"])
          let status = stringValue(obj["status"])
          if status == "error" {
              return .error(id: id,
                            code: stringValue(obj["err-code"]) ?? "unknown",
                            message: stringValue(obj["err-msg"]) ?? "")
          }
          if status == "ok" {
              if let t = stringValue(obj["subbed"]) { return .subscribed(id: id, topic: t) }
              if let t = stringValue(obj["unsubbed"]) { return .unsubscribed(id: id, topic: t) }
              if let t = stringValue(obj["rep"]) { return .reply(id: id, topic: t) }
          }
          if let ch = stringValue(obj["ch"]), obj["tick"] != nil || obj["data"] != nil,
             let action = parseTopic(ch) {
              return action
          }
          return .ignore
      }

      private func validToken(_ s: String) -> Bool {
          guard (1...64).contains(s.count) else { return false }
          return s.unicodeScalars.allSatisfy { c in
              (c.value >= 48 && c.value <= 57) || (c.value >= 65 && c.value <= 90) ||
              (c.value >= 97 && c.value <= 122) || c == "." || c == "_" || c == "#" || c == "-"
          }
      }

      func makeSubscribe(topic: String, id: String, freqMs: Int? = nil) -> String? {
          guard validToken(topic), validToken(id) else { return nil }
          var out = "{\"sub\":\"\(topic)\",\"id\":\"\(id)\""
          if let f = freqMs {
              guard [1000, 2000, 3000, 4000, 5000].contains(f) else { return nil }
              out += ",\"freq-ms\":\(f)"
          }
          return out + "}"
      }

      func makeUnsubscribe(topic: String, id: String) -> String? {
          guard validToken(topic), validToken(id) else { return nil }
          return "{\"unsub\":\"\(topic)\",\"id\":\"\(id)\"}"
      }
    tests: |
      checkEqual("伺服器 ping → 原值 pong", WSAction.send("{\"pong\":18212558000}")) {
          handleFrame("{\"ping\": 18212558000}")
      }
      check("ping 不是整數（字串、小數）→ ignore") {
          handleFrame("{\"ping\":\"abc\"}") == .ignore && handleFrame("{\"ping\":1.5}") == .ignore
      }
      checkEqual("私有 WS 心跳", WSAction.send("{\"action\":\"pong\",\"data\":{\"ts\":1575537778295}}")) {
          handleFrame("{\"action\":\"ping\",\"data\":{\"ts\":1575537778295}}")
      }
      check("pong、非 JSON、空物件都是 ignore") {
          handleFrame("{\"pong\":1}") == .ignore && handleFrame("not json") == .ignore && handleFrame("{}") == .ignore
      }
      check("sub／unsub／req 的回覆（id 可有可無）") {
          handleFrame("{\"id\":\"id1\",\"status\":\"ok\",\"subbed\":\"market.btcjpy.kline.1min\",\"ts\":1}")
              == .subscribed(id: "id1", topic: "market.btcjpy.kline.1min")
          && handleFrame("{\"status\":\"ok\",\"unsubbed\":\"market.btcjpy.trade.detail\",\"ts\":1}")
              == .unsubscribed(id: nil, topic: "market.btcjpy.trade.detail")
          && handleFrame("{\"status\":\"ok\",\"id\":\"id10\",\"rep\":\"market.btcjpy.kline.1min\",\"tick\":[]}")
              == .reply(id: "id10", topic: "market.btcjpy.kline.1min")
      }
      check("錯誤訊息：取 id、err-code、err-msg，缺欄位用預設") {
          handleFrame("{\"id\":\"id3\",\"status\":\"error\",\"err-code\":\"bad-request\",\"err-msg\":\"invalid topic market.btcjpy.kline.3min\",\"ts\":1}")
              == .error(id: "id3", code: "bad-request", message: "invalid topic market.btcjpy.kline.3min")
          && handleFrame("{\"status\":\"error\"}") == .error(id: nil, code: "unknown", message: "")
      }
      check("推送依 ch 分派（kline、depth、bbo、trade.detail、detail）") {
          handleFrame("{\"ch\":\"market.btcjpy.kline.1min\",\"ts\":1,\"tick\":{\"id\":1}}")
              == .push(symbol: "btcjpy", kind: "kline", param: "1min")
          && handleFrame("{\"ch\":\"market.ethjpy.depth.step0\",\"ts\":1,\"data\":{\"bids\":[],\"asks\":[]}}")
              == .push(symbol: "ethjpy", kind: "depth", param: "step0")
          && handleFrame("{\"ch\":\"market.btcjpy.bbo\",\"ts\":1,\"tick\":{}}")
              == .push(symbol: "btcjpy", kind: "bbo", param: nil)
          && handleFrame("{\"ch\":\"market.btcjpy.trade.detail\",\"ts\":1,\"tick\":{\"data\":[]}}")
              == .push(symbol: "btcjpy", kind: "trade.detail", param: nil)
          && handleFrame("{\"ch\":\"market.btcjpy.detail\",\"ts\":1,\"tick\":{}}")
              == .push(symbol: "btcjpy", kind: "detail", param: nil)
      }
      check("未知或格式錯誤的 ch、沒有資料的推送、私有 push 都是 ignore") {
          handleFrame("{\"ch\":\"market.btcjpy.kline\",\"ts\":1,\"tick\":{}}") == .ignore
          && handleFrame("{\"ch\":\"foo.btcjpy.bbo\",\"ts\":1,\"tick\":{}}") == .ignore
          && handleFrame("{\"ch\":\"market.btcjpy.bbo\",\"ts\":1}") == .ignore
          && handleFrame("{\"action\":\"push\",\"ch\":\"orders#btcjpy\",\"data\":{}}") == .ignore
      }
      check("makeSubscribe／makeUnsubscribe：格式與驗證") {
          makeSubscribe(topic: "market.btcjpy.kline.1min", id: "id1") == "{\"sub\":\"market.btcjpy.kline.1min\",\"id\":\"id1\"}"
          && makeSubscribe(topic: "market.btcjpy.bbo", id: "id2", freqMs: 2000) == "{\"sub\":\"market.btcjpy.bbo\",\"id\":\"id2\",\"freq-ms\":2000}"
          && makeSubscribe(topic: "market.btcjpy.bbo", id: "id2", freqMs: 250) == nil
          && makeSubscribe(topic: "market.btcjpy.bbo\",\"x\":\"y", id: "id3") == nil
          && makeSubscribe(topic: "", id: "id4") == nil
