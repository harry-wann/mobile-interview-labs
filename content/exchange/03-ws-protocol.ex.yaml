- id: exchange-ws-protocol-01
  type: single
  level: 1
  priority: P0
  tags: [heartbeat]
  prompt: |
    這套交易所公開 WebSocket（Huobi 相容）的心跳（定時確認「連線還活著」的訊息），哪個描述正確？
  options:
    - "App 每 5 秒要主動送 `{\"ping\":現在時間}`，伺服器才會維持連線"
    - "伺服器約每 5 秒送 `{\"ping\":ts}`，App 要回 `{\"pong\":ts}`，值必須與收到的 ping **相同**；連續兩次沒有回應，伺服器會斷線"
    - "App 回覆 pong 時要填目前的 Unix 時間，伺服器用來估算延遲"
    - "WebSocket 協定層的 ping frame 就足以維持連線，不需要處理 JSON 格式的 `ping`"
  answer: 1
  explain: |
    API 文件的說明是：連線建立後，伺服器每 5 秒（文件註明可能變更）送出 ping，App 回 pong，而且「pong 的值與收到的 ping 的值相同」；連續兩次沒回應，伺服器就斷線。
    - 第 1 項錯：方向說反了。這個協定是伺服器主動送 ping，App 負責回（App 也可以主動送 ping，但不是維持連線的必要條件）。
    - 第 3 項錯：pong 的值要原樣回傳收到的 ping，不是填當下的時間。
    - 第 4 項錯：這套協定的 `{"ping":...}` 是協定自己定義的 JSON 訊息，要由程式自己回；和 WebSocket 協定層的 ping／pong frame 是兩回事。OkHttp 的 `pingInterval` 或 `URLSessionWebSocketTask.sendPing` 用的是協定層的 ping，不會取代它。

- id: exchange-ws-protocol-02
  type: order
  level: 2
  priority: P0
  tags: [pipeline, gzip]
  prompt: |
    App 收到公開 WebSocket 的一個 binary frame（一則二進位訊息），依合理順序排列處理步驟。
  items:
    - "在 socket 的背景執行緒對 frame 做 gzip 解壓縮"
    - "解碼成 JSON（失敗就記錄並丟棄該 frame，不讓連線崩潰）"
    - "最先檢查是不是 `ping`，是的話立即回 `{\"pong\":原值}`"
    - "檢查是否為 `status: error` 或 `subbed`／`unsubbed`／`rep` 的回覆，對應到 App 送出的 `id`"
    - "依 `ch` 解析 topic，把 `tick`／`data` 分派給對應的處理者（合併、套用到狀態）"
  explain: |
    - 解壓一定在最前面：frame 是壓縮過的二進位資料，沒解壓就看不到 JSON，也就不知道這是不是 ping。解壓放在背景執行緒，不要卡住主執行緒。
    - 解碼成 JSON 其次，失敗就丟棄，不能讓連線崩潰。
    - 心跳的優先權最高，而且不依賴任何狀態，所以解碼之後要最先檢查，避免被行情處理拖慢，被伺服器判定超時。
    - 接著才處理回覆（確認和錯誤），要靠 `id` 對回你送出的請求。
    - 最後是推送，依 `ch`（主題名稱）分派給對應的處理者。畫面只會收到整理過的狀態。

- id: exchange-ws-protocol-03
  type: multi
  level: 2
  priority: P0
  tags: [protocol, req, sub, topic]
  prompt: |
    關於這套交易所公開 WebSocket 的訊息格式（以 API 文件為準），哪些敘述正確？（複選）
  options:
    - "`req`（一次性請求）的回覆用 `rep` 欄位標示 topic，推送則用 `ch`"
    - "`sub` 的 `freq-ms` 可以填任意毫秒數，例如 250"
    - "文件的 K 線 period 清單沒有 3min；訂閱 `market.btcjpy.kline.3min` 會得到 `bad-request`／`invalid topic`"
    - "depth 頻道推送的資料放在 `data`，K 線與 BBO 放在 `tick`"
    - "對沒有訂閱的 topic 送 `unsub` 會被當作成功，不會有錯誤"
  answer: [0, 2, 3]
  explain: |
    - 第 1 項對：`req` 的回覆長這樣 `{"status":"ok","rep":"<topic>","tick":[...]}`，用 `rep`；持續推送的訊息才用 `ch`。
    - 第 2 項錯：`freq-ms` 的合法值只有 1000、2000、3000、4000、5000（毫秒）；不給就是有更新就立即推送。
    - 第 3 項對：文件列的 period 是 1min、5min、15min、30min、60min、1day、1mon、1week、1year，沒有 3min，訂閱會收到 `status: error`。
    - 第 4 項對：依 API 文件的 WebSocket 範例，depth 推送放在 `data`（含 `bids`、`asks`），K 線和 BBO 放在 `tick`；而 REST 的 depth 回應放在 `tick`。所以解析器兩個欄位都要接受（本單元的 code 題就是這樣做）。
    - 第 5 項錯：對未訂閱的 topic 退訂會得到 `status: error`，`err-msg` 是 `unsub with not subbed topic …`。

- id: exchange-ws-protocol-04
  type: fill
  level: 2
  priority: P1
  tags: [json, unsub, pong]
  prompt: |
    補上 JSON 的欄位名稱：退訂成交頻道，以及回覆伺服器的心跳（收到 `{"ping":18212558000}`）。
  codeLang: json
  code: |
    {"____":"market.btcjpy.trade.detail","id":"id4"}
    {"____":18212558000}
  blanks:
    - [unsub]
    - [pong]
  explain: |
    退訂的格式是 `{"unsub":"<topic>","id":"<id>"}`，成功會回 `{"id":"id4","status":"ok","unsubbed":"market.btcjpy.trade.detail","ts":...}`。
    心跳回覆是 `{"pong":<原值>}`，值必須與伺服器送的 ping 相同。私有 WebSocket 的格式不一樣，是 `{"action":"pong","data":{"ts":...}}`。

- id: exchange-ws-protocol-05
  type: single
  level: 2
  priority: P1
  tags: [private-ws, ordering]
  prompt: |
    你訂閱了私有頻道 `trade.clearing#btcjpy#1`（成交與取消都推送）。一筆 IOC 單（Immediate Or Cancel：能立刻成交的部分成交，剩下的立刻取消）部分成交後剩餘被取消，App 先收到「取消」通知，才收到「成交」通知。依 API 文件的說明，下列做法哪個正確？
  options:
    - "不可能發生，WebSocket 一定依序送達"
    - "把先收到的取消當作最終狀態，之後的成交通知丟棄"
    - "文件指出這個頻道的通知**順序不保證**。如果順序有依賴，應該使用 `orders#${symbol}` 頻道；App 的狀態合併要容許事件亂序（成交量只增不減、終態不被覆蓋；終態＝已完成或已取消這種不會再變的狀態）"
    - "兩種頻道都不可靠，必須改用輪詢（定時用 REST 去查）"
  answer: 2
  explain: |
    API 文件在「注文状態更新」（`trade.clearing`）的說明中明確寫到：不保證接收順序，例如 IOC 單成交後剩餘部分被取消，取消的通知可能先到；順序有依賴時請使用 `orders#${symbol}`。
    - 第 1 項錯：文件已經明說會發生。WebSocket 在同一條連線上會依序送達，但伺服器送出通知的先後，不一定等於事件發生的先後。
    - 第 2 項錯：把先到的取消當作最後的結果，成交的數量就被蓋掉了，使用者會看到「完全沒成交」。
    - 第 4 項錯：沒有必要放棄推送，改成輪詢反而增加延遲和請求次數。要做的是讓狀態合併可以處理亂序。
    所以 App 把新事件合併進現有狀態的函式，要能處理亂序：累計成交量只增不減、終態不能被舊事件蓋掉、以伺服器的資料為準（見下單流程單元）。

- id: exchange-ws-protocol-06
  type: single
  level: 3
  priority: P1
  tags: [ios, gzip, compression]
  prompt: |
    iOS 工程師對收到的 gzip binary frame 直接呼叫 `compression_decode_buffer(..., COMPRESSION_ZLIB)`（Compression framework 的解壓函式），回傳 0（解壓失敗）。最可能的原因與處理方式是？
  options:
    - "Compression framework 不支援 gzip，必須改用第三方 JSON 函式庫"
    - "frame 沒有被伺服器壓縮，是文件寫錯"
    - "`COMPRESSION_ZLIB` 處理的是 raw DEFLATE（沒有 gzip 標頭的壓縮資料），不包含 gzip 的標頭與結尾；要先解析並跳過 gzip 標頭（至少 10 bytes，含可選欄位）與結尾 8 bytes，再解壓中間的 DEFLATE 資料，或改用 libz 的 `inflateInit2` 設定 gzip 模式"
    - "必須在 `URLSessionWebSocketTask` 設定 `Accept-Encoding: gzip`，系統才會自動解壓 binary frame"
  answer: 2
  explain: |
    實測：對 `gzip` 指令壓縮出來的資料直接呼叫 `compression_decode_buffer(COMPRESSION_ZLIB)` 會回傳 0，`NSData.decompressed(using: .zlib)` 也會失敗；跳過 gzip 標頭與結尾，只解中間的 DEFLATE 資料，就可以還原原始 JSON。
    - 第 1 項錯：Compression framework 可以解壓，只是它只認裸的 DEFLATE，不認 gzip 的標頭；而且解壓和 JSON 函式庫沒有關係。
    - 第 2 項錯：API 文件明確寫了所有回傳資料都是 gzip 壓縮，不是文件寫錯。
    - 第 4 項錯：`Accept-Encoding` 是 HTTP 的機制，只對一般的 HTTP 回應有效；WebSocket 的 binary frame 是協定自己壓縮的，URLSession 不會自動解壓。
    Android 的 `GZIPInputStream` 可以直接處理 gzip，所以這是兩個平台的實作差異。

