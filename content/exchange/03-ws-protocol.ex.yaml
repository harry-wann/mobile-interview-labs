      class MiniJson(private val s: String) {
          private var i = 0

          fun parse(): Any? {
              val v = value()
              skipWs()
              if (i != s.length) throw IllegalArgumentException("trailing characters")
              return v
          }

          private fun skipWs() { while (i < s.length && s[i].isWhitespace()) i++ }

          private fun value(): Any? {
              skipWs()
              if (i >= s.length) throw IllegalArgumentException("unexpected end")
              val c = s[i]
              return when {
                  c == '{' -> obj()
                  c == '[' -> arr()
                  c == '"' -> str()
                  s.startsWith("true", i) -> { i += 4; true }
                  s.startsWith("false", i) -> { i += 5; false }
                  s.startsWith("null", i) -> { i += 4; null }
                  c == '-' || c.isDigit() -> num()
                  else -> throw IllegalArgumentException("unexpected '$c'")
              }
          }

          private fun obj(): Map<String, Any?> {
              val m = LinkedHashMap<String, Any?>()
              i++
              skipWs()
              if (i < s.length && s[i] == '}') { i++; return m }
              while (true) {
                  skipWs()
                  val k = str()
                  skipWs()
                  if (i >= s.length || s[i] != ':') throw IllegalArgumentException("expected ':'")
                  i++
                  m[k] = value()
                  skipWs()
                  if (i >= s.length) throw IllegalArgumentException("unexpected end")
                  if (s[i] == ',') { i++; continue }
                  if (s[i] == '}') { i++; return m }
                  throw IllegalArgumentException("expected ',' or '}'")
              }
          }

          private fun arr(): List<Any?> {
              val l = ArrayList<Any?>()
              i++
              skipWs()
              if (i < s.length && s[i] == ']') { i++; return l }
              while (true) {
                  l.add(value())
                  skipWs()
                  if (i >= s.length) throw IllegalArgumentException("unexpected end")
                  if (s[i] == ',') { i++; continue }
                  if (s[i] == ']') { i++; return l }
                  throw IllegalArgumentException("expected ',' or ']'")
              }
          }

          private fun str(): String {
              if (i >= s.length || s[i] != '"') throw IllegalArgumentException("expected string")
              i++
              val sb = StringBuilder()
              while (i < s.length) {
                  val c = s[i++]
                  when (c) {
                      '"' -> return sb.toString()
                      '\\' -> {
                          if (i >= s.length) throw IllegalArgumentException("bad escape")
                          when (val e = s[i++]) {
                              '"', '\\', '/' -> sb.append(e)
                              'b' -> sb.append('\b')
                              'f' -> sb.append('\u000C')
                              'n' -> sb.append('\n')
                              'r' -> sb.append('\r')
                              't' -> sb.append('\t')
                              'u' -> {
                                  if (i + 4 > s.length) throw IllegalArgumentException("bad unicode escape")
                                  sb.append(s.substring(i, i + 4).toInt(16).toChar())
                                  i += 4
                              }
                              else -> throw IllegalArgumentException("bad escape")
                          }
                      }
                      else -> sb.append(c)
                  }
              }
              throw IllegalArgumentException("unterminated string")
          }

          private fun num(): Any {
              val start = i
              if (s[i] == '-') i++
              while (i < s.length && (s[i].isDigit() || s[i] in ".eE+-")) i++
              val t = s.substring(start, i)
              return if (t.any { it == '.' || it == 'e' || it == 'E' }) t.toDouble() else (t.toLongOrNull() ?: t.toDouble())
          }
      }

      @Suppress("UNCHECKED_CAST")
      fun parseJsonObject(text: String): Map<String, Any?>? =
          try { MiniJson(text).parse() as? Map<String, Any?> } catch (e: Exception) { null }

      fun integerValue(v: Any?): Long? = when (v) {
          is Long -> v
          is Double -> if (v == Math.floor(v) && Math.abs(v) < 9.0e15) v.toLong() else null
          else -> null
      }

      fun stringValue(v: Any?): String? = v as? String

      sealed class WSAction {
          data class Send(val text: String) : WSAction()
          data class Subscribed(val id: String?, val topic: String) : WSAction()
          data class Unsubscribed(val id: String?, val topic: String) : WSAction()
          data class Reply(val id: String?, val topic: String) : WSAction()
          data class Push(val symbol: String, val kind: String, val param: String?) : WSAction()
          data class Error(val id: String?, val code: String, val message: String) : WSAction()
          object Ignore : WSAction()
      }

      private fun parseTopic(ch: String): WSAction? {
          val parts = ch.split(".")
          if (parts.size < 3 || parts[0] != "market" || parts[1].isEmpty()) return null
          val symbol = parts[1]
          val rest = parts.drop(2)
          return when {
              rest == listOf("bbo") -> WSAction.Push(symbol, "bbo", null)
              rest == listOf("detail") -> WSAction.Push(symbol, "detail", null)
              rest == listOf("trade", "detail") -> WSAction.Push(symbol, "trade.detail", null)
              rest.size == 2 && (rest[0] == "kline" || rest[0] == "depth") && rest[1].isNotEmpty() ->
                  WSAction.Push(symbol, rest[0], rest[1])
              else -> null
          }
      }

      fun handleFrame(json: String): WSAction {
          val obj = parseJsonObject(json) ?: return WSAction.Ignore

          if (obj.containsKey("ping")) {
              val v = integerValue(obj["ping"]) ?: return WSAction.Ignore
              return WSAction.Send("{\"pong\":$v}")
          }
          if (obj.containsKey("pong")) return WSAction.Ignore
          if (stringValue(obj["action"]) == "ping") {
              val data = obj["data"] as? Map<*, *>
              val ts = integerValue(data?.get("ts"))
              if (ts != null) return WSAction.Send("{\"action\":\"pong\",\"data\":{\"ts\":$ts}}")
          }

          val id = stringValue(obj["id"])
          val status = stringValue(obj["status"])
          if (status == "error") {
              return WSAction.Error(id, stringValue(obj["err-code"]) ?: "unknown", stringValue(obj["err-msg"]) ?: "")
          }
          if (status == "ok") {
              stringValue(obj["subbed"])?.let { return WSAction.Subscribed(id, it) }
              stringValue(obj["unsubbed"])?.let { return WSAction.Unsubscribed(id, it) }
              stringValue(obj["rep"])?.let { return WSAction.Reply(id, it) }
          }
          val ch = stringValue(obj["ch"])
          if (ch != null && (obj.containsKey("tick") || obj.containsKey("data"))) {
              parseTopic(ch)?.let { return it }
          }
          return WSAction.Ignore
      }

      private val tokenRegex = Regex("^[A-Za-z0-9._#-]{1,64}$")

      fun makeSubscribe(topic: String, id: String, freqMs: Int? = null): String? {
          if (!tokenRegex.matches(topic) || !tokenRegex.matches(id)) return null
          val sb = StringBuilder("{\"sub\":\"$topic\",\"id\":\"$id\"")
          if (freqMs != null) {
              if (freqMs !in listOf(1000, 2000, 3000, 4000, 5000)) return null
              sb.append(",\"freq-ms\":$freqMs")
          }
          return sb.append("}").toString()
      }

      fun makeUnsubscribe(topic: String, id: String): String? {
          if (!tokenRegex.matches(topic) || !tokenRegex.matches(id)) return null
          return "{\"unsub\":\"$topic\",\"id\":\"$id\"}"
      }
    tests: |
      checkEqual("伺服器 ping → 原值 pong", WSAction.Send("{\"pong\":18212558000}")) {
          handleFrame("{\"ping\": 18212558000}")
      }
      check("ping 不是整數（字串、小數）→ ignore") {
          handleFrame("{\"ping\":\"abc\"}") == WSAction.Ignore && handleFrame("{\"ping\":1.5}") == WSAction.Ignore
      }
      checkEqual("私有 WS 心跳", WSAction.Send("{\"action\":\"pong\",\"data\":{\"ts\":1575537778295}}")) {
          handleFrame("{\"action\":\"ping\",\"data\":{\"ts\":1575537778295}}")
      }
      check("pong、非 JSON、空物件都是 ignore") {
          handleFrame("{\"pong\":1}") == WSAction.Ignore && handleFrame("not json") == WSAction.Ignore && handleFrame("{}") == WSAction.Ignore
      }
      check("sub／unsub／req 的回覆（id 可有可無）") {
          handleFrame("{\"id\":\"id1\",\"status\":\"ok\",\"subbed\":\"market.btcjpy.kline.1min\",\"ts\":1}") ==
              WSAction.Subscribed("id1", "market.btcjpy.kline.1min") &&
          handleFrame("{\"status\":\"ok\",\"unsubbed\":\"market.btcjpy.trade.detail\",\"ts\":1}") ==
              WSAction.Unsubscribed(null, "market.btcjpy.trade.detail") &&
          handleFrame("{\"status\":\"ok\",\"id\":\"id10\",\"rep\":\"market.btcjpy.kline.1min\",\"tick\":[]}") ==
              WSAction.Reply("id10", "market.btcjpy.kline.1min")
      }
      check("錯誤訊息：取 id、err-code、err-msg，缺欄位用預設") {
          handleFrame("{\"id\":\"id3\",\"status\":\"error\",\"err-code\":\"bad-request\",\"err-msg\":\"invalid topic market.btcjpy.kline.3min\",\"ts\":1}") ==
              WSAction.Error("id3", "bad-request", "invalid topic market.btcjpy.kline.3min") &&
          handleFrame("{\"status\":\"error\"}") == WSAction.Error(null, "unknown", "")
      }
      check("推送依 ch 分派（kline、depth、bbo、trade.detail、detail）") {
          handleFrame("{\"ch\":\"market.btcjpy.kline.1min\",\"ts\":1,\"tick\":{\"id\":1}}") ==
              WSAction.Push("btcjpy", "kline", "1min") &&
          handleFrame("{\"ch\":\"market.ethjpy.depth.step0\",\"ts\":1,\"data\":{\"bids\":[],\"asks\":[]}}") ==
              WSAction.Push("ethjpy", "depth", "step0") &&
          handleFrame("{\"ch\":\"market.btcjpy.bbo\",\"ts\":1,\"tick\":{}}") ==
              WSAction.Push("btcjpy", "bbo", null) &&
          handleFrame("{\"ch\":\"market.btcjpy.trade.detail\",\"ts\":1,\"tick\":{\"data\":[]}}") ==
              WSAction.Push("btcjpy", "trade.detail", null) &&
          handleFrame("{\"ch\":\"market.btcjpy.detail\",\"ts\":1,\"tick\":{}}") ==
              WSAction.Push("btcjpy", "detail", null)
      }
      check("未知或格式錯誤的 ch、沒有資料的推送、私有 push 都是 ignore") {
          handleFrame("{\"ch\":\"market.btcjpy.kline\",\"ts\":1,\"tick\":{}}") == WSAction.Ignore &&
          handleFrame("{\"ch\":\"foo.btcjpy.bbo\",\"ts\":1,\"tick\":{}}") == WSAction.Ignore &&
          handleFrame("{\"ch\":\"market.btcjpy.bbo\",\"ts\":1}") == WSAction.Ignore &&
          handleFrame("{\"action\":\"push\",\"ch\":\"orders#btcjpy\",\"data\":{}}") == WSAction.Ignore
      }
      check("makeSubscribe／makeUnsubscribe：格式與驗證") {
          makeSubscribe("market.btcjpy.kline.1min", "id1") == "{\"sub\":\"market.btcjpy.kline.1min\",\"id\":\"id1\"}" &&
          makeSubscribe("market.btcjpy.bbo", "id2", 2000) == "{\"sub\":\"market.btcjpy.bbo\",\"id\":\"id2\",\"freq-ms\":2000}" &&
          makeSubscribe("market.btcjpy.bbo", "id2", 250) == null &&
          makeSubscribe("market.btcjpy.bbo\",\"x\":\"y", "id3") == null &&
          makeSubscribe("", "id4") == null &&
          makeUnsubscribe("market.btcjpy.trade.detail", "id4") == "{\"unsub\":\"market.btcjpy.trade.detail\",\"id\":\"id4\"}"
      }

- id: exchange-ws-protocol-08
  type: open
  level: 2
  priority: P0
  tags: [websocket, architecture]
  prompt: |
    請設計交易所 App 的 WebSocket 層：從連線、gzip 解壓、心跳、訂閱管理到重連與重新訂閱。哪些要在背景處理？並說明你在長連線上的實務經驗，以及到交易所的 App 你會怎麼做。
  promptJa: |
    取引所アプリの WebSocket 層（接続、gzip 解凍、ハートビート、購読管理、再接続と再購読）を設計してください。バックグラウンドで処理すべきことは何ですか。これまでの長時間接続の経験と、取引所アプリでどう進めるかも説明してください。
  keyPoints:
    - "分三層：連線層（連線、binary frame、gzip 解壓，在背景執行緒）、協定層（JSON 解碼、心跳、確認與錯誤用 id 對回請求、依 `ch` 分派）、訂閱管理（記錄目前訂了哪些 topic）；各 topic 的狀態（板、ticker、K 線）再放在更上面"
    - "心跳最優先、不依賴狀態、不經過畫面更新：伺服器約 5 秒 ping，連續兩次沒回就斷線，要回原值 pong"
    - "訂閱管理：記錄目前所有 topic，每個請求帶唯一 id；重連後依序重新 auth（私有）、重新訂閱、對 depth 這類資料先抓快照（snapshot，整份最新的板）；離開畫面就 unsub"
    - "gzip：iOS 的 `COMPRESSION_ZLIB` 是 raw DEFLATE，需處理 gzip 標頭；Android 用 `GZIPInputStream`；解壓與解碼失敗要容錯"
    - "限流與錯誤：429／too.many.connection 要退避（等待時間逐次加倍，再加一點隨機誤差 jitter），不要立即重連；私有頻道每個 API key 最多 10 條連線"
    - "資料送到畫面：先在背景合併（多筆更新只留最新一筆），再以固定頻率更新；斷線時標示資料過期並禁止用過期價格下單"
    - "經驗：即時行情 App 的 SSE（先用 REST 取得短效 token，再開串流）與回前景補資料、社交 App 聊天室的 Socket.IO 重連與 ack；這套協定的細節讀 API 文件並用純函式練習分派與心跳"
  modelAnswer: |
    我會分三層。連線層處理連線與 binary frame，在背景執行緒做 gzip 解壓；iOS 的 `COMPRESSION_ZLIB` 是 raw DEFLATE（沒有 gzip 標頭的壓縮資料），要先跳過 gzip 標頭，Android 用 `GZIPInputStream`。協定層解 JSON，**最先處理心跳**：伺服器約每 5 秒送 `{"ping":ts}`，我要原值回 `{"pong":ts}`，連續兩次沒回就會被斷線，所以這條路徑不能經過畫面更新。之後處理確認與錯誤，靠每個請求的 `id` 對回去，推送再依 `ch` 解析成 topic 分派。
    訂閱管理層記錄目前所有 topic。重連後依序重新 auth（私有頻道）、重新訂閱、對 depth 這類資料先抓快照（整份最新的板）；離開畫面就 `unsub`。遇到 429 或 `too.many.connection`（請求或連線太多），用指數退避加 jitter（等待時間逐次加倍，再加一點隨機誤差），不立即重連。資料送到畫面之前，先在背景合併（多筆更新只留最新一筆），以固定頻率更新；斷線時標示資料過期，並禁止用過期價格下單。
    經驗上，我在一個即時行情 App 做過 SSE 的兩段式握手（先用 REST 取得短效 token，再開串流）與回前景補資料，也在一個社交 App 做過聊天室 Socket.IO 的重連與 ack。這套協定的細節，我讀過 API 文件，並用純函式練習過分派與心跳；到交易所的 App，我會把重連改成指數退避加 jitter。
  modelAnswerJa: |
    3 層に分けます。接続層は接続と binary frame を扱い、バックグラウンドスレッドで gzip を解凍します。iOS の `COMPRESSION_ZLIB` は raw DEFLATE（gzip ヘッダーのない圧縮データ）なので gzip ヘッダーを先に飛ばす必要があり、Android では `GZIPInputStream` を使います。プロトコル層は JSON をデコードし、**最初にハートビートを処理します**。サーバーは約 5 秒ごとに `{"ping":ts}` を送り、同じ値で `{"pong":ts}` を返す必要があります。2 回連続で応答がないと切断されるため、この経路は画面の更新処理を通しません。その後、確認とエラーを各リクエストの `id` で対応付け、プッシュは `ch` から topic を解析して振り分けます。
    購読管理層は現在のすべての topic を保持します。再接続後は、（プライベートなら）認証、再購読、板のようなデータはスナップショット取得の順で行い、画面を離れたら `unsub` します。429 や `too.many.connection`（リクエストや接続が多すぎる）のときは、指数バックオフに jitter（ランダムな揺らぎ）を加え、すぐには再接続しません。画面に渡す前にバックグラウンドで更新をまとめ（複数の更新のうち最新の 1 件だけを残し）、一定間隔で更新します。切断中はデータが古いことを表示し、古い価格での発注を禁止します。
    経験としては、相場アプリで SSE の 2 段階ハンドシェイク（まず REST で短命のトークンを取得してからストリームを開く）とフォアグラウンド復帰時のデータ再取得を、ソーシャルアプリではチャットの Socket.IO の再接続と ack を扱いました。このプロトコルの詳細は API ドキュメントを読み、純粋関数でメッセージの振り分けとハートビートを練習しました。取引所アプリでは、再接続を指数バックオフと jitter に変更します。
  followUps:
    - "ping に対する pong が遅れる原因を、アプリ側でどう調べる？"
    - "再購読の途中で再び切断されたらどうなる？"
    - "同じ topic を複数の画面が購読したいとき、参照カウントはどう持つ？"
  timeLimitSec: 150

