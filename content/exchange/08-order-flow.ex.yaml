- id: exchange-order-flow-09
  type: open
  level: 2
  priority: P0
  tags: [order, reliability]
  prompt: |
    設計交易所 App 的下單流程，讓使用者不會「重複下單」，也不會「不知道成功沒有」。請涵蓋 client order id、逾時對帳、狀態合併、撤單和成交同時發生、限流，以及 App 被殺掉或進背景時的處理。
  promptJa: |
    取引所アプリの注文フローを、二重発注や「成功したか分からない」状態が起きないように設計してください。client order id、タイムアウト時の照合、状態のマージ、キャンセルと約定が同時に起きた場合、レート制限、アプリが終了またはバックグラウンドへ移行した場合の扱いも含めてください。
  keyPoints:
    - "按下按鈕、送出之前就產生 `client-order-id`（最長 64 字元、8 小時內唯一；是否必填待確認），隨草稿保存；所有重送用同一個；按鈕鎖定並顯示確認中，ViewModel 也用狀態擋住重複點擊"
    - "逾時不重送：用未成交委託清單或歷史查詢，依 `client-order-id` 對帳（API 文件沒有以 client id 查單筆的端點；已取消的訂單只能查過去 2 小時，`states` 必填）；查不到才讓使用者決定"
    - "下單回應只是受理（訂單 ID）；成交與取消靠私有 WebSocket 與查詢；REST 查詢是權威，WebSocket 是即時"
    - "狀態合併寫成純函式 reducer：終態不可離開、累計成交量只增不減、容忍亂序（`trade.clearing` 不保證順序）"
    - "撤單：先顯示 canceling，等伺服器確認；對終態的訂單取消會得到 `order-orderstate-error`，視為正常並刷新"
    - "限流：token bucket（每秒 10 次，注入時鐘、整數運算），查詢優先用 WebSocket 推送，避免輪詢吃光額度"
    - "App 被殺或進背景：未確認的下單要持久化（草稿加 client order id），回來後先對帳；回前景時重新抓快照並重新訂閱"
    - "經驗連結：社交 App 的聊天用 UUID 當冪等鍵、伺服器 ack 後取代樂觀資料；內購在伺服器確認後才 finishTransaction"
  modelAnswer: |
    我會讓每一次下單意圖，在送出之前就有一個 `client-order-id`。API 文件規定最長 64 字元、8 小時內唯一，我用 UUID，隨草稿一起保存，所有重送都用同一個。按下按鈕後立刻鎖定並顯示確認中，ViewModel 裡也用狀態擋住重複點擊。

    下單的回應只是受理，回傳訂單 ID，成交和取消要靠私有 WebSocket 和查詢確認。逾時我不會重送，而是用未成交委託清單或委託歷史查詢，依 `client-order-id` 對帳，因為文件沒有以 client id 查單筆的端點；查不到，才讓使用者決定是否重送。

    狀態合併寫成純函式 reducer：終態不可離開，成交量用累計值而且只增不減，容忍亂序，因為文件說 `trade.clearing` 不保證順序。撤單先進入 canceling，等伺服器確認；對已成交的訂單取消會得到 `order-orderstate-error`，這是正常情況，刷新後顯示已成交。限流用 token bucket，額度是每個 API key 每秒 10 次，查詢優先用 WebSocket 推送。

    App 被殺或進背景時，未確認的下單要持久化，回來後先對帳；回前景要重新抓快照並重新訂閱。我在一個社交 App 做過類似的設計：聊天訊息由 App 產生 UUID 當冪等鍵，伺服器 ack 後取代本地的樂觀資料；內購也是伺服器確認之後才結束交易。到交易所的下單流程，我會用同樣的思路來做。
  modelAnswerJa: |
    1 回の発注の意図ごとに、送信前の時点で `client-order-id` を用意します。API ドキュメントでは最大 64 文字、8 時間以内で一意とされているため、UUID を使い、下書きと一緒に保存して、再送はすべて同じ ID にします。ボタンを押したらすぐにロックして確認中と表示し、ViewModel でも状態で二重のタップを防ぎます。

    発注のレスポンスは受理を表すだけで、注文 ID が返ります。約定やキャンセルは、プライベート WebSocket と照会で確認します。タイムアウトしても再送せず、未約定注文の一覧または注文履歴の検索から `client-order-id` で照合します。ドキュメントには、client id で 1 件を照会するエンドポイントがないためです。見つからなければ、再送するかどうかをユーザーに選んでもらいます。

    状態のマージは、純粋関数の reducer にします。一度終端状態になったら他の状態に戻さず、約定数量は累計値で、増えることだけを認めます。順序が前後することも想定します。ドキュメントで `trade.clearing` は順序が保証されないとされているためです。取消はまず canceling にして、サーバーの確認を待ちます。約定済みの注文を取り消すと `order-orderstate-error` が返りますが、これは正常なケースなので、再取得して約定済みと表示します。レート制限は token bucket で、上限は API キーあたり毎秒 10 回です。照会はなるべく WebSocket の通知を使います。

    アプリが終了したりバックグラウンドへ移行したりする場合に備えて、未確認の発注は端末に保存し、復帰後にまず照合します。フォアグラウンドに戻ったときは、最新の状態を取得し直して、再購読します。ソーシャルアプリでは、チャットのメッセージにアプリ側で UUID を生成して冪等キーとし、サーバーの ack 後に楽観的に表示していたデータを置き換えました。アプリ内課金も、サーバーで確認してから取引を終了させました。取引所の注文フローでも、同じ考え方で進めます。
  followUps:
    - "App 重新啟動後，怎麼知道「有一筆未確認的下單」？要存什麼？"
    - "同一個使用者在兩台裝置同時下單，client order id 會衝突嗎？"
    - "同時訂閱 `orders#` 和 `trade.clearing` 時，怎麼避免重複計算成交？"
  timeLimitSec: 180

- id: exchange-order-flow-10
  type: flash
  level: 1
  priority: P0
  tags: [order]
  front: 訂單合併的規則，與下單冪等的重點
  back: |
    - 終態（filled／canceled／partial-canceled／rejected）**不可離開**。
    - 成交量用**伺服器給的累計值**，只增不減；小於或等於目前值、或超過委託量的事件，忽略。
    - 取消先顯示 **canceling**；取消之後才到的成交 → partial-canceled；取消時其實已經全部成交 → filled。
    - 事件亂序要容忍（`trade.clearing` 不保證順序，要順序請用 `orders#`）。
    - 冪等：`client-order-id`（最長 64、8 小時內唯一）送出之前就產生，重送用同一個；逾時先對帳再決定；限流每秒 10 次，用 token bucket（注入時鐘）。
