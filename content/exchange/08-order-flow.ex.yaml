    solution: |
      import Foundation

      enum OrderState: Equatable {
          case pending, submitted, partialFilled, canceling, filled, canceled, partialCanceled, rejected
      }

      struct Order: Equatable {
          let clientOrderId: String
          let amount: Decimal
          var filled: Decimal
          var state: OrderState
      }

      enum OrderEvent {
          case accepted
          case rejected
          case fill(cumulative: Decimal)
          case cancelRequested
          case canceled
      }

      func reduce(_ order: Order, _ event: OrderEvent) -> Order {
          var o = order
          switch event {
          case .accepted:
              if o.state == .pending { o.state = .submitted }
          case .rejected:
              if o.state == .pending { o.state = .rejected }
          case .fill(let total):
              guard o.state != .rejected, total > o.filled, total <= o.amount else { return o }
              o.filled = total
              if total == o.amount {
                  o.state = .filled
              } else {
                  switch o.state {
                  case .pending, .submitted, .partialFilled: o.state = .partialFilled
                  case .canceled, .partialCanceled: o.state = .partialCanceled
                  case .canceling, .filled, .rejected: break
                  }
              }
          case .cancelRequested:
              switch o.state {
              case .pending, .submitted, .partialFilled: o.state = .canceling
              default: break
              }
          case .canceled:
              switch o.state {
              case .pending, .submitted, .partialFilled, .canceling:
                  o.state = o.filled > 0 ? .partialCanceled : .canceled
              default: break
              }
          }
          return o
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }
      func fresh() -> Order { Order(clientOrderId: "c1", amount: D("1"), filled: 0, state: .pending) }
      func run(_ events: [OrderEvent], from order: Order = fresh()) -> Order {
          events.reduce(order) { reduce($0, $1) }
      }

      check("正常流程：ack → 部分成交 → 全部成交") {
          let a = run([.accepted])
          let b = run([.accepted, .fill(cumulative: D("0.3"))])
          let c = run([.accepted, .fill(cumulative: D("0.3")), .fill(cumulative: D("1"))])
          return a.state == .submitted && b.state == .partialFilled && b.filled == D("0.3")
              && c.state == .filled && c.filled == D("1")
      }
      check("累計成交量只增不減：重複與較小的值忽略") {
          let o = run([.accepted, .fill(cumulative: D("0.5")), .fill(cumulative: D("0.3")), .fill(cumulative: D("0.5"))])
          return o.filled == D("0.5") && o.state == .partialFilled
      }
      check("超過委託量的累計值無效，整個事件忽略") {
          let o = run([.accepted, .fill(cumulative: D("1.5"))])
          return o.filled == 0 && o.state == .submitted
      }
      check("終態不可離開") {
          let filled = run([.accepted, .fill(cumulative: D("1"))])
          let canceled = run([.accepted, .canceled])
          return run([.accepted, .cancelRequested, .canceled, .rejected], from: filled) == filled
              && run([.accepted, .cancelRequested, .rejected], from: canceled) == canceled
              && canceled.state == .canceled
      }
      check("撤單競態 A：canceling 期間收到成交，仍是 canceling；確認取消後變 partialCanceled") {
          let o1 = run([.accepted, .cancelRequested, .fill(cumulative: D("0.4"))])
          let o2 = reduce(o1, .canceled)
          return o1.state == .canceling && o1.filled == D("0.4")
              && o2.state == .partialCanceled && o2.filled == D("0.4")
      }
      check("撤單競態 B：取消請求送出時其實已全部成交 → filled，晚到的取消事件被忽略") {
          let o = run([.accepted, .cancelRequested, .fill(cumulative: D("1")), .canceled])
          return o.state == .filled && o.filled == D("1")
      }
      check("事件亂序：取消先到、成交後到；成交先於 ack") {
          let o1 = run([.accepted, .canceled, .fill(cumulative: D("0.4"))])
          let o2 = run([.fill(cumulative: D("0.2")), .accepted])
          return o1.state == .partialCanceled && o1.filled == D("0.4")
              && o2.state == .partialFilled && o2.filled == D("0.2")
      }
      check("rejected 只能從 pending 進入，且之後不會變") {
          let r = run([.rejected, .accepted, .fill(cumulative: D("0.5")), .cancelRequested, .canceled])
          let s = run([.accepted, .rejected])
          return r.state == .rejected && r.filled == 0 && s.state == .submitted
      }
