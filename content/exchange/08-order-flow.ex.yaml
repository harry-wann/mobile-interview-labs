    solution: |
      import java.math.BigDecimal

      enum class OrderState { PENDING, SUBMITTED, PARTIAL_FILLED, CANCELING, FILLED, CANCELED, PARTIAL_CANCELED, REJECTED }

      data class Order(
          val clientOrderId: String,
          val amount: BigDecimal,
          val filled: BigDecimal,
          val state: OrderState
      )

      sealed class OrderEvent {
          object Accepted : OrderEvent()
          object Rejected : OrderEvent()
          data class Fill(val cumulative: BigDecimal) : OrderEvent()
          object CancelRequested : OrderEvent()
          object Canceled : OrderEvent()
      }

      fun reduce(order: Order, event: OrderEvent): Order = when (event) {
          OrderEvent.Accepted ->
              if (order.state == OrderState.PENDING) order.copy(state = OrderState.SUBMITTED) else order
          OrderEvent.Rejected ->
              if (order.state == OrderState.PENDING) order.copy(state = OrderState.REJECTED) else order
          is OrderEvent.Fill -> {
              val total = event.cumulative
              if (order.state == OrderState.REJECTED || total <= order.filled || total > order.amount) {
                  order
              } else if (total.compareTo(order.amount) == 0) {
                  order.copy(filled = total, state = OrderState.FILLED)
              } else {
                  val next = when (order.state) {
                      OrderState.PENDING, OrderState.SUBMITTED, OrderState.PARTIAL_FILLED -> OrderState.PARTIAL_FILLED
                      OrderState.CANCELED, OrderState.PARTIAL_CANCELED -> OrderState.PARTIAL_CANCELED
                      else -> order.state
                  }
                  order.copy(filled = total, state = next)
              }
          }
          OrderEvent.CancelRequested -> when (order.state) {
              OrderState.PENDING, OrderState.SUBMITTED, OrderState.PARTIAL_FILLED -> order.copy(state = OrderState.CANCELING)
              else -> order
          }
          OrderEvent.Canceled -> when (order.state) {
              OrderState.PENDING, OrderState.SUBMITTED, OrderState.PARTIAL_FILLED, OrderState.CANCELING ->
                  order.copy(state = if (order.filled.signum() > 0) OrderState.PARTIAL_CANCELED else OrderState.CANCELED)
              else -> order
          }
      }
    tests: |
      import java.math.BigDecimal

      fun D(s: String) = BigDecimal(s)
      fun fresh() = Order("c1", D("1"), BigDecimal.ZERO, OrderState.PENDING)
      fun run(events: List<OrderEvent>, from: Order = fresh()): Order = events.fold(from) { o, e -> reduce(o, e) }
      fun f(s: String) = OrderEvent.Fill(D(s))
      fun same(a: Order, b: Order) = a.state == b.state && a.filled.compareTo(b.filled) == 0

      check("正常流程：ack → 部分成交 → 全部成交") {
          val a = run(listOf(OrderEvent.Accepted))
          val b = run(listOf(OrderEvent.Accepted, f("0.3")))
          val c = run(listOf(OrderEvent.Accepted, f("0.3"), f("1")))
          a.state == OrderState.SUBMITTED && b.state == OrderState.PARTIAL_FILLED && b.filled.compareTo(D("0.3")) == 0 &&
              c.state == OrderState.FILLED && c.filled.compareTo(D("1")) == 0
      }
      check("累計成交量只增不減：重複與較小的值忽略") {
          val o = run(listOf(OrderEvent.Accepted, f("0.5"), f("0.3"), f("0.5")))
          o.filled.compareTo(D("0.5")) == 0 && o.state == OrderState.PARTIAL_FILLED
      }
      check("超過委託量的累計值無效，整個事件忽略") {
          val o = run(listOf(OrderEvent.Accepted, f("1.5")))
          o.filled.signum() == 0 && o.state == OrderState.SUBMITTED
      }
      check("終態不可離開") {
          val filled = run(listOf(OrderEvent.Accepted, f("1")))
          val canceled = run(listOf(OrderEvent.Accepted, OrderEvent.Canceled))
          same(run(listOf(OrderEvent.Accepted, OrderEvent.CancelRequested, OrderEvent.Canceled, OrderEvent.Rejected), filled), filled) &&
              same(run(listOf(OrderEvent.Accepted, OrderEvent.CancelRequested, OrderEvent.Rejected), canceled), canceled) &&
              canceled.state == OrderState.CANCELED
      }
      check("撤單競態 A：canceling 期間收到成交，仍是 canceling；確認取消後變 partialCanceled") {
          val o1 = run(listOf(OrderEvent.Accepted, OrderEvent.CancelRequested, f("0.4")))
          val o2 = reduce(o1, OrderEvent.Canceled)
          o1.state == OrderState.CANCELING && o1.filled.compareTo(D("0.4")) == 0 &&
              o2.state == OrderState.PARTIAL_CANCELED && o2.filled.compareTo(D("0.4")) == 0
      }
      check("撤單競態 B：取消請求送出時其實已全部成交 → filled，晚到的取消事件被忽略") {
          val o = run(listOf(OrderEvent.Accepted, OrderEvent.CancelRequested, f("1"), OrderEvent.Canceled))
          o.state == OrderState.FILLED && o.filled.compareTo(D("1")) == 0
      }
      check("事件亂序：取消先到、成交後到；成交先於 ack") {
          val o1 = run(listOf(OrderEvent.Accepted, OrderEvent.Canceled, f("0.4")))
          val o2 = run(listOf(f("0.2"), OrderEvent.Accepted))
          o1.state == OrderState.PARTIAL_CANCELED && o1.filled.compareTo(D("0.4")) == 0 &&
              o2.state == OrderState.PARTIAL_FILLED && o2.filled.compareTo(D("0.2")) == 0
      }
      check("rejected 只能從 pending 進入，且之後不會變") {
          val r = run(listOf(OrderEvent.Rejected, OrderEvent.Accepted, f("0.5"), OrderEvent.CancelRequested, OrderEvent.Canceled))
          val s = run(listOf(OrderEvent.Accepted, OrderEvent.Rejected))
          r.state == OrderState.REJECTED && r.filled.signum() == 0 && s.state == OrderState.SUBMITTED
      }

- id: exchange-order-flow-08
  type: code
  level: 2
  priority: P0
  tags: [rate-limit, token-bucket, clock]
  prompt: |
    這套 API 的簽名請求，每個 API key 每秒 10 次。實作 App 端的 token bucket（令牌桶，限流用），**注入時鐘**（毫秒，由呼叫端傳入，不在函式裡讀現在的時間），全部用整數運算。

    - `TokenBucket(capacity, refillPerSecond, startMs)`：一開始桶是滿的；每秒補充 `refillPerSecond` 個 token，補充的上限是 `capacity`
    - `tryAcquire(nowMs)`：拿得到 1 個 token 就消耗並回傳 true，否則回傳 false（不消耗）
    - `waitMs(nowMs)`：現在拿不到 token 時，還要等幾毫秒才有 1 個（**向上取整**）；拿得到時回傳 0；**不消耗** token
    - 時鐘倒退（`nowMs` 小於上次的時間）時，不補充 token，也不能讓之後的補充算錯
  hints:
    - "用「千分之一個 token」（milli-token）當單位：每過 1 毫秒，補充 `refillPerSecond` 個 milli-token；取得 1 個 token 需要 1000 個 milli-token。"
    - "記住最後一次補充的時間 `last`；`now < last` 時不更新 `last`。"
  swift:
    starter: |
      struct TokenBucket {
          init(capacity: Int, refillPerSecond: Int, startMs: Int64) {
              // TODO
          }

          mutating func tryAcquire(nowMs: Int64) -> Bool {
              // TODO
              return true
          }

          mutating func waitMs(nowMs: Int64) -> Int64 {
              // TODO
              return 0
          }
      }
    solution: |
      struct TokenBucket {
          private let capacityMilli: Int64
          private let rate: Int64
          private var level: Int64
          private var last: Int64

          init(capacity: Int, refillPerSecond: Int, startMs: Int64) {
              capacityMilli = Int64(capacity) * 1000
              rate = Int64(refillPerSecond)
              level = capacityMilli
              last = startMs
          }

          private mutating func refill(_ now: Int64) {
              guard now > last else { return }
              level = min(capacityMilli, level + (now - last) * rate)
              last = now
          }

          mutating func tryAcquire(nowMs: Int64) -> Bool {
              refill(nowMs)
              guard level >= 1000 else { return false }
              level -= 1000
              return true
          }

          mutating func waitMs(nowMs: Int64) -> Int64 {
              refill(nowMs)
              guard level < 1000 else { return 0 }
              let deficit = 1000 - level
              return (deficit + rate - 1) / rate
          }
      }
    tests: |
      check("一開始是滿的：10 個可以立即取得，第 11 個失敗") {
          var b = TokenBucket(capacity: 10, refillPerSecond: 10, startMs: 0)
          var ok = 0
          for _ in 0..<10 { if b.tryAcquire(nowMs: 0) { ok += 1 } }
          return ok == 10 && !b.tryAcquire(nowMs: 0)
      }
      check("每 100 毫秒補充 1 個") {
          var b = TokenBucket(capacity: 10, refillPerSecond: 10, startMs: 0)
          for _ in 0..<10 { _ = b.tryAcquire(nowMs: 0) }
          let early = b.tryAcquire(nowMs: 99)
          let onTime = b.tryAcquire(nowMs: 100)
          return !early && onTime && !b.tryAcquire(nowMs: 100)
      }
      check("補充有上限（capacity）") {
          var b = TokenBucket(capacity: 10, refillPerSecond: 10, startMs: 0)
          for _ in 0..<10 { _ = b.tryAcquire(nowMs: 0) }
          var ok = 0
          for _ in 0..<20 { if b.tryAcquire(nowMs: 10_000) { ok += 1 } }
          return ok == 10
      }
      check("waitMs：回傳還要等的毫秒數，且不消耗 token") {
          var b = TokenBucket(capacity: 10, refillPerSecond: 10, startMs: 0)
          for _ in 0..<10 { _ = b.tryAcquire(nowMs: 0) }
          let w0 = b.waitMs(nowMs: 0)
          let w60 = b.waitMs(nowMs: 60)
          let w100 = b.waitMs(nowMs: 100)
          return w0 == 100 && w60 == 40 && w100 == 0 && b.tryAcquire(nowMs: 100)
      }
      check("時鐘倒退：不補充，之後的補充仍以最後時間為準") {
          var b = TokenBucket(capacity: 10, refillPerSecond: 10, startMs: 1000)
          for _ in 0..<10 { _ = b.tryAcquire(nowMs: 1000) }
          let back = b.tryAcquire(nowMs: 500)
          let later = b.tryAcquire(nowMs: 1100)
          return !back && later
      }
      check("每秒 1 個、容量 1") {
          var b = TokenBucket(capacity: 1, refillPerSecond: 1, startMs: 0)
          let a = b.tryAcquire(nowMs: 0)
          let early = b.tryAcquire(nowMs: 999)
          let wait = b.waitMs(nowMs: 999)
          let c = b.tryAcquire(nowMs: 1000)
          return a && !early && wait == 1 && c
      }
      check("不能整除的速率：每秒 3 個，要等 334 毫秒（向上取整）") {
          var b = TokenBucket(capacity: 3, refillPerSecond: 3, startMs: 0)
          for _ in 0..<3 { _ = b.tryAcquire(nowMs: 0) }
          let w = b.waitMs(nowMs: 0)
          let early = b.tryAcquire(nowMs: 333)
          let onTime = b.tryAcquire(nowMs: 334)
          return w == 334 && !early && onTime
      }
  kotlin:
    starter: |
