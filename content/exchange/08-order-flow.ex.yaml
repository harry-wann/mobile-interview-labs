- id: exchange-order-flow-01
  type: single
  level: 1
  priority: P0
  tags: [place-order, ack]
  prompt: |
    依這套交易所的 API 文件，`POST /v1/order/orders/place` 回傳 `{"status":"ok","data":"59378"}`。這代表什麼？
  options:
    - "訂單已經成交，`59378` 是成交編號"
    - "訂單已被受理，並產生訂單 ID `59378`；成交、部分成交、取消，都要靠後續的查詢或私有 WebSocket 確認"
    - "訂單已經進入 `filled` 狀態，只是畫面還沒更新"
    - "只代表請求的格式正確，訂單不一定被建立"
  answer: 1
  explain: |
    下單回應的 `data` 是訂單 ID，它是「伺服器受理了這張單」的證據，不是成交結果。畫面不能顯示「已成交」，而是先顯示「確認中」，再依後續的事件顯示 `submitted`、`partial-filled`、`filled` 等狀態。
    - 第 1 項錯：`59378` 是訂單 ID，不是成交編號，而且此時還不知道有沒有成交。
    - 第 3 項錯：下單當下訂單不一定成交，更不會直接進入 `filled`；限價單可能先掛在委託簿上等人來吃。
    - 第 4 項錯：回應裡已經有訂單 ID，代表訂單被建立了。
    同樣的道理，`submitcancel` 回傳 ok，只代表取消**請求**已經送出，文件明說實際結果要查詢訂單。

- id: exchange-order-flow-02
  type: single
  level: 2
  priority: P0
  tags: [idempotency, client-order-id, timeout]
  prompt: |
    使用者按下買入，POST 下單請求在網路不穩時逾時，沒有收到回應。依這套 API 的 `client-order-id` 設計（API 文件：最長 64 字元、8 小時內必須唯一；參數表標為必填，但範例沒有帶、私有 WebSocket 標為選填，實際是否必填需確認），最正確的處理是？
  options:
    - "每次網路重試都產生新的 `client-order-id`，避免被伺服器判定重複"
    - "先不重送，也不當作失敗；用未成交委託清單或委託歷史查詢，依 `client-order-id` 比對訂單是否已存在。確認不存在，才讓使用者決定要不要重送，重送時**重用同一個** `client-order-id`"
    - "直接重送一次，反正 `client-order-id` 是唯一的，伺服器會自己處理"
    - "顯示失敗並清掉草稿，使用者要重新輸入"
  answer: 1
  explain: |
    逾時只代表沒收到回應，伺服器可能已經建立了訂單。`client-order-id` 要在「使用者按下按鈕、送出之前」就產生，並隨草稿保存；同一次意圖的所有重送都用同一個，才有冪等的效果（冪等的意思是同一個請求不管送幾次，效果都和送一次一樣）。
    - 第 1 項錯：每次重試都換新的 id，伺服器就會把它們當成不同的訂單，等於每次都是新的下單，反而可能重複成交。
    - 第 3 項錯：文件沒有說明用相同的 `client-order-id` 重複送出時，伺服器會怎麼處理（未證實），不能假設它會自己處理好。
    - 第 4 項錯：訂單可能已經成立，直接顯示失敗，使用者會以為沒下單，結果其實已經成交。
    API 文件沒有「以 client-order-id 查單筆訂單」的端點（本機核對），所以對帳用清單或歷史查詢，再依回傳資料裡的 `client-order-id` 比對。有幾個限制：文件寫明已取消的訂單只能查過去 2 小時，委託歷史查詢的 `states` 參數是必填；未成交清單的範例回傳的 `client-order-id` 是空字串，要先實測才能靠它比對。

- id: exchange-order-flow-03
  type: multi
  level: 2
  priority: P0
  tags: [reducer, state-machine]
  prompt: |
    設計 App 端合併訂單事件的規則，哪些敘述正確？（複選）
  options:
    - "成交量用伺服器給的**累計值**；小於或等於目前值的事件，視為過期或重複，忽略"
    - "終態（filled、canceled、partial-canceled）進入之後，晚到的 submitted 或重複的取消事件，都不能覆蓋它"
    - "使用者按下取消後，畫面可以直接顯示 canceled，因為使用者的意圖已經確定"
    - "取消事件比最後一筆成交事件先到時，晚到的成交要把訂單變成 partial-canceled，並更新成交量"
    - "只要收到 `trade.clearing` 就不需要 `orders#` 頻道，因為成交通知已經包含全部狀態"
  answer: [0, 1, 3]
  explain: |
    - 第 1 項正確：累計值不會因為重複的事件而加倍，過期的（比目前小）和重複的（相等）都可以直接忽略。
    - 第 2 項正確：終態一旦進入就不會離開，晚到的舊事件不能把狀態改回去。
    - 第 3 項錯：按下取消後只能顯示 `canceling`（取消中），要等伺服器的事件確認 `canceled` 或 `partial-canceled`，因為訂單可能在取消送到之前剛好成交。
    - 第 4 項正確：這是文件警告的亂序情況，取消的通知先到，成交的通知後到。已經有成交量的訂單被取消，是 `partial-canceled`，晚到的成交要把成交量更新上去。
    - 第 5 項錯：API 文件指出 `trade.clearing` **不保證順序**，順序有依賴時要使用 `orders#`。兩個頻道互補，合併規則要容忍亂序。

- id: exchange-order-flow-04
  type: predict
  level: 2
  priority: P1
  tags: [monotonic, cumulative]
  prompt: |
    私有頻道送來的是**累計**成交量，但事件可能重複或亂序。下列程式依序印出什麼？
  codeLang: swift
  code: |
    import Foundation

    func D(_ s: String) -> Decimal { Decimal(string: s)! }

    var filled = Decimal(0)
    for total in ["0.2", "0.5", "0.3", "0.5", "0.7"] {
        let t = D(total)
        if t > filled {
            filled = t
            print("update", filled)
        } else {
            print("ignore", t)
        }
    }
  answer: |
    update 0.2 update 0.5 ignore 0.3 ignore 0.5 update 0.7
  explain: |
    累計值只增不減，所以只有比目前成交量大的值才會更新：
    - `0.2` 比 0 大，更新；`0.5` 比 0.2 大，更新。
    - `0.3` 比目前的 0.5 小，是過期的事件，忽略。
    - 第二個 `0.5` 和目前的 0.5 相同，是重複的事件，忽略。
    - `0.7` 比 0.5 大，更新。最後成交量是 0.7。
    這個規則讓重複、亂序的事件不會破壞成交量。如果誤把這些值當成「增量」加起來，結果會是 2.2，而不是 0.7。

- id: exchange-order-flow-05
  type: single
  level: 3
  priority: P1
  tags: [reorder, cancel-race]
  prompt: |
    一張限價買單（數量 1.0）的事件依序到達：`accepted`、`fill(累計 0.4)`、`canceled`、`fill(累計 0.2)`（晚到的過期事件）、`fill(累計 0.6)`。依「終態不可離開、累計量只增不減、取消之後才到的成交，狀態改成 partial-canceled」的規則，最終的狀態與成交量是？
  options:
    - "`canceled`，成交量 0.4"
    - "`partial-canceled`，成交量 0.6"
    - "`partial-filled`，成交量 0.6"
    - "`filled`，成交量 1.0"
  answer: 1
  explain: |
    一個事件一個事件走一遍：
    - `accepted` → `submitted`；`fill(0.4)` → `partial-filled`（成交量 0.4）；`canceled` → 因為已經有成交量，變成 `partial-canceled`（0.4）。
    - 晚到的 `fill(0.2)` 小於目前的 0.4，忽略。
    - `fill(0.6)` 大於 0.4、而且小於委託量：成交量更新為 0.6，狀態維持 `partial-canceled`（終態不會回到 `partial-filled`）。這代表取消通知先於成交通知到達，正是文件警告的亂序。
    其他選項：第 1 項忽略了最後一筆有效的成交；第 3 項讓終態回到了 `partial-filled`；第 4 項的 1.0 沒有任何事件支持，累計量最多只到 0.6。

- id: exchange-order-flow-06
  type: multi
  level: 2
  priority: P0
  tags: [api, cancel, rate-limit]
  prompt: |
    依這套交易所的 API 文件，哪些敘述正確？（複選）
  options:
    - "`client-order-id` 在下單參數中最長 64 字元，且 8 小時內必須唯一"
    - "需要簽名的 API，每個 API key 每秒 10 次；公開 API 每個 IP 每秒 10 次"
    - "`/v1/order/orders/batchcancel` 一次最多取消 50 筆，`order-ids` 比 `client-order-ids` 更穩定"
    - "對已經成交（filled）的訂單呼叫 `submitcancel` 會成功，並把訂單改成 canceled"
    - "訂單查詢的 `field-amount` 是這次成交的增量"
  answer: [0, 1, 2]
  explain: |
    - 第 1 項正確：長度與唯一性期限是文件明寫的。但「是否必填」文件前後不一致（參數表標必填，範例沒帶、私有 WebSocket 標選填），需要確認。
    - 第 2 項正確：簽名 API 的額度算在 API key 上，公開 API 的額度算在 IP 上，部分 API 另有更嚴格的限制。
    - 第 3 項正確：文件建議使用 `order-ids`，原因是比 App 自己訂的編號穩定。
    - 第 4 項錯：對終態的訂單取消，會得到 `order-orderstate-error`（Incorrect order state）。App 應該把它當成正常情況，刷新訂單後顯示「已成交」。
    - 第 5 項錯：`field-amount` 是**累計**成交量（`field-cash-amount` 是累計成交金額），逐筆成交要看 `/matchresults`。

