      import CryptoKit

      enum TOTPAlgorithm { case sha1, sha256, sha512 }

      func totp(
          secret: [UInt8],
          unixSeconds: Int64,
          digits: Int = 6,
          period: Int64 = 30,
          algorithm: TOTPAlgorithm = .sha1
      ) -> String {
          // TODO
          return ""
      }

      func base32Decode(_ s: String) -> [UInt8]? {
          // TODO
          return nil
      }

      func verifyTOTP(
          code: String,
          secret: [UInt8],
          unixSeconds: Int64,
          window: Int
      ) -> Int64? {
          // TODO
          return nil
      }
    solution: |
      import Foundation
      import CryptoKit

      enum TOTPAlgorithm { case sha1, sha256, sha512 }

      private func hmac(
          _ alg: TOTPAlgorithm,
          key: [UInt8],
          message: [UInt8]
      ) -> [UInt8] {
          let k = SymmetricKey(data: key)
          switch alg {
          case .sha1:
              return Array(
                  HMAC<Insecure.SHA1>.authenticationCode(for: message, using: k)
              )
          case .sha256:
              return Array(HMAC<SHA256>.authenticationCode(for: message, using: k))
          case .sha512:
              return Array(HMAC<SHA512>.authenticationCode(for: message, using: k))
          }
      }

      private func hotp(
          secret: [UInt8],
          counter: Int64,
          digits: Int,
          algorithm: TOTPAlgorithm
      ) -> String {
          var message = [UInt8](repeating: 0, count: 8)
          var c = UInt64(bitPattern: counter)
          for i in stride(from: 7, through: 0, by: -1) {
              message[i] = UInt8(c & 0xff)
              c >>= 8
          }
          let h = hmac(algorithm, key: secret, message: message)
          let offset = Int(h[h.count - 1] & 0x0f)
          let binary = (UInt32(h[offset] & 0x7f) << 24)
              | (UInt32(h[offset + 1]) << 16)
                     | (UInt32(h[offset + 2]) << 8) | UInt32(h[offset + 3])
          var mod: UInt32 = 1
          for _ in 0..<digits {
              mod *= 10
          }
          let value = String(binary % mod)
          return String(repeating: "0", count: max(0, digits - value.count)) + value
      }

      func totp(
          secret: [UInt8],
          unixSeconds: Int64,
          digits: Int = 6,
          period: Int64 = 30,
          algorithm: TOTPAlgorithm = .sha1
      ) -> String {
          hotp(
              secret: secret,
              counter: unixSeconds / period,
              digits: digits,
              algorithm: algorithm
          )
      }

      func base32Decode(_ s: String) -> [UInt8]? {
          let alphabet = Array("ABCDEFGHIJKLMNOPQRSTUVWXYZ234567")
          var buffer: UInt32 = 0
          var bits = 0
          var out: [UInt8] = []
          for ch in s.uppercased() where ch != " " && ch != "=" {
              guard let idx = alphabet.firstIndex(of: ch) else { return nil }
              buffer = (buffer << 5) | UInt32(idx)
              bits += 5
              if bits >= 8 {
                  bits -= 8
                  out.append(UInt8((buffer >> UInt32(bits)) & 0xff))
              }
          }
          return out
      }

      func verifyTOTP(
          code: String,
          secret: [UInt8],
          unixSeconds: Int64,
          window: Int
      ) -> Int64? {
          guard code.count == 6, code.allSatisfy({ $0 >= "0" && $0 <= "9" }) else {
              return nil
          }
          let now = unixSeconds / 30
          for delta in -window...window {
              let counter = now + Int64(delta)
              if counter < 0 {
                  continue
              }
              if hotp(
                  secret: secret,
                  counter: counter,
                  digits: 6,
                  algorithm: .sha1
              ) == code {
                  return counter
              }
          }
          return nil
      }
    tests: |
      let k1 = Array("12345678901234567890".utf8)
      let k256 = Array("12345678901234567890123456789012".utf8)
      let k512 = Array(
          "1234567890123456789012345678901234567890123456789012345678901234".utf8
      )

      check("RFC 6238 SHA-1（8 位數）") {
          totp(secret: k1, unixSeconds: 59, digits: 8) == "94287082"
              && totp(secret: k1, unixSeconds: 1111111109, digits: 8) == "07081804"
              && totp(secret: k1, unixSeconds: 1111111111, digits: 8) == "14050471"
              && totp(secret: k1, unixSeconds: 1234567890, digits: 8) == "89005924"
              && totp(secret: k1, unixSeconds: 2000000000, digits: 8) == "69279037"
              && totp(secret: k1, unixSeconds: 20000000000, digits: 8) == "65353130"
      }

      check("6 位數：同一個整數取後 6 位，且要補零") {
          totp(secret: k1, unixSeconds: 59) == "287082"
              && totp(secret: k1, unixSeconds: 1111111109) == "081804"
      }

      check("SHA-256、SHA-512 的向量") {
          totp(secret: k256, unixSeconds: 59, digits: 8, algorithm: .sha256)
              == "46119246"
              && totp(secret: k512, unixSeconds: 59, digits: 8, algorithm: .sha512)
                  == "90693936"
      }

      check("period 邊界：counter 在 29→30 秒時換") {
          totp(secret: k1, unixSeconds: 0) == "755224"
              && totp(secret: k1, unixSeconds: 29) == "755224"
              && totp(secret: k1, unixSeconds: 30) == "287082"
              && totp(secret: k1, unixSeconds: 60) == "359152"
      }

      check("base32Decode：RFC 範例、大小寫、空白與補齊") {
          base32Decode("GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ") == k1
              && base32Decode("gezd gnbv gy3t qojq gezd gnbv gy3t qojq") == k1
              && base32Decode("JBSWY3DPEHPK3PXP")
                  == [0x48, 0x65, 0x6c, 0x6c, 0x6f, 0x21, 0xde, 0xad, 0xbe, 0xef]
              && base32Decode("MFRGG===") == [0x61, 0x62, 0x63]
      }

      check("base32Decode：不合法的字元回傳 nil") {
          base32Decode("GEZD0NBV") == nil && base32Decode("GEZD-NBV") == nil
      }

      check("verifyTOTP：視窗內回傳符合的 counter，視窗外回傳 nil") {
          // T=59 的 counter 是 1，驗證碼 287082
          verifyTOTP(code: "287082", secret: k1, unixSeconds: 59, window: 0) == 1
              && verifyTOTP(code: "287082", secret: k1, unixSeconds: 89, window: 1)
                  == 1
              && verifyTOTP(code: "287082", secret: k1, unixSeconds: 29, window: 1)
                  == 1
              && verifyTOTP(code: "287082", secret: k1, unixSeconds: 119, window: 1)
                  == nil
              && verifyTOTP(code: "287082", secret: k1, unixSeconds: 119, window: 2)
                  == 1
      }

      check("verifyTOTP：格式不對直接 nil") {
          verifyTOTP(code: "28708", secret: k1, unixSeconds: 59, window: 1) == nil
              && verifyTOTP(code: "28708a", secret: k1, unixSeconds: 59, window: 1)
                  == nil
              && verifyTOTP(code: "", secret: k1, unixSeconds: 59, window: 1) == nil
      }
