- id: exchange-account-security-01
  type: single
  level: 1
  priority: P1
  tags: [totp, rfc6238]
  prompt: |
    TOTP（兩步驟驗證用的 6 位數驗證碼，規格是 RFC 6238）預設每 30 秒換一次碼（這個 30 秒稱為 period），起算點是 Unix 時間 0（1970-01-01 00:00:00 UTC）。在 Unix 時間 `T = 59` 秒時，用來算 HMAC 的 counter 是多少？
  options:
    - "0"
    - "1"
    - "59"
    - "2"
  answer: 1
  explain: |
    counter ＝ `floor(59 ÷ 30)` ＝ 1（`floor` 是無條件捨去到整數）。所以 T = 59 秒和 T = 30 秒算出的驗證碼相同，到 T = 60 秒才換成 counter 2。RFC 6238 附錄 B 的測試資料中，T = 59 對應的 counter 就是 1：8 位數是 `94287082`，6 位數是 `287082`。

    其他選項錯在哪裡：
    - `0`：只有 T 在 0 到 29 秒之間，counter 才是 0。
    - `59`：這是「時間」，不是 counter。忘了除以 period（30 秒）才會得到這個數字。
    - `2`：要到 T 在 60 到 89 秒之間，counter 才是 2。

    伺服器驗證時，通常會容許前後各 1 個 counter 的誤差，並記住最後成功的 counter，避免同一個碼被重複使用。

- id: exchange-account-security-02
  type: predict
  level: 2
  priority: P1
  tags: [hotp, dynamic-truncation]
  prompt: |
    HOTP（TOTP 的基礎，規格是 RFC 4226）有一個「動態截斷」步驟：HMAC-SHA-1 算出 20 個位元組之後，要從中取一段，變成 6 位數驗證碼。下面是 RFC 4226 範例中的 20 個位元組，程式依序印出什麼？（offset、截斷後的整數、6 位數驗證碼）
  codeLang: swift
  code: |
    let hmac: [UInt8] = [0x1f, 0x86, 0x98, 0x69, 0x0e, 0x02, 0xca, 0x16, 0x61, 0x85,
                         0x50, 0xef, 0x7f, 0x19, 0xda, 0x8e, 0x94, 0x5b, 0x55, 0x5a]
    let offset = Int(hmac[hmac.count - 1] & 0x0f)
    let binary = (UInt32(hmac[offset] & 0x7f) << 24)
        | (UInt32(hmac[offset + 1]) << 16)
               | (UInt32(hmac[offset + 2]) << 8) | UInt32(hmac[offset + 3])
    print(offset, binary, binary % 1_000_000)
  answer: |
    10 1357872921 872921
  explain: |
    - **offset**：最後一個位元組是 `0x5a`，它的低 4 個位元是 `0xa`，也就是 10。所以從第 10 個位元組（從 0 開始算）開始取。
    - **截斷後的整數**：從第 10 個位元組開始取 4 個位元組，是 `50 ef 7f 19`；最高位元用 `& 0x7f` 清成 0 之後，是 `0x50ef7f19`，十進位是 1357872921。
    - **6 位數驗證碼**：對 1,000,000 取餘數，得到 872921。這就是 RFC 4226 範例的結果（本機實際執行確認過）。

    為什麼要清掉最高位元？這樣整數一定是正數。Java、Kotlin 的 `Int` 有正負號，最高位元如果是 1 就會變成負數，各平台算出來的結果會不一樣；先清成 0，各平台就一致。

- id: exchange-account-security-03
  type: multi
  level: 2
  priority: P1
  tags: [totp, server]
  prompt: |
    關於 TOTP（6 位數驗證碼）的伺服器端驗證設計，哪些做法合理？（複選）
  options:
    - "容許前後各 1 個 time step（30 秒）的偏差（視窗 ±1），以容納手機和伺服器的時鐘誤差"
    - "記住最後成功驗證的 counter，同一個 counter 的驗證碼不能再使用，防止重放（把攔截到的合法請求原封不動再送一次）"
    - "為了減少客訴，把視窗放寬到 ±10 個 time step"
    - "對錯誤嘗試做次數限制與鎖定，並通知使用者"
    - "TOTP 驗證碼可以由同一個 App 在使用者登入的裝置上產生，這樣最方便"
  answer: [0, 1, 3]
  explain: |
    - 第 1 項正確：手機和伺服器的時鐘不會完全一致，使用者輸入也要幾秒，所以前後各多接受 1 個 counter。
    - 第 2 項正確：不記住最後成功的 counter，攔截到驗證碼的人在有效期內可以再用一次。
    - 第 3 項錯：視窗越大，亂猜越容易猜中（±10 等於同時有 21 個碼有效）。時鐘誤差大的使用者應該先校正手機時間，而不是放寬視窗。
    - 第 4 項正確：6 位數只有 100 萬種可能，不限制嘗試次數就能暴力試完。
    - 第 5 項錯：密碼和驗證碼如果都在同一個 App、同一台裝置上，裝置被入侵時兩個因素會一起失守，等於只有一個因素。TOTP 通常交給獨立的驗證器 App。

    另外，伺服器比較驗證碼時，應該用固定時間比較（constant-time comparison：不管哪裡不同，花的時間都一樣），避免靠回應時間猜出前幾位正確。

- id: exchange-account-security-04
  type: single
  level: 2
  priority: P1
  tags: [biometric, keychain, keystore]
  prompt: |
    某 App 在出金前呼叫 iOS 的 `LAContext.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, …)`（要求使用者做生物辨識），回傳 `success == true` 就直接送出出金請求。資安審查認為這個設計不安全，主要原因與改善方式是？
  options:
    - "`evaluatePolicy` 太慢，應該改成自己實作指紋比對"
    - "回傳的布林值（true 或 false）只是 App 畫面層的檢查，在被攻破或被 hook 的手機上可以被改成永遠成功，並沒有保護任何東西。應該把生物辨識綁在金鑰上（`SecAccessControl`；Android 是 Keystore 的 `setUserAuthenticationRequired` 加 `CryptoObject`）：註冊時把公鑰交給伺服器，出金時伺服器送 challenge，App 在生物辨識通過後用私鑰簽名，伺服器驗證簽章"
    - "生物辨識不能用在金融 App，應該改成只用密碼"
    - "應該改用臉部辨識取代指紋，因為臉部比較安全"
  answer: 1
  explain: |
    安全性來自「沒有通過生物辨識，就無法使用私鑰」這個由系統（Secure Enclave 或 Android 的 TEE）強制的條件，而不是 App 裡的 `if success`。簽章再加上一次性的 challenge，請求也不能被拿去重放。

    其他選項錯在哪裡：
    - 第 1 項：慢不是問題所在。自己實作指紋比對更不安全，生物特徵資料應該交給系統處理，App 拿不到也不該拿。
    - 第 3 項：生物辨識可以用在金融 App，銀行和交易所很常見。問題在於「怎麼用」，不是「能不能用」。
    - 第 4 項：指紋或臉部誰比較安全不是重點，不管哪一種，只看布林值都會被繞過。

    補充：金鑰綁定 `.biometryCurrentSet`（iOS），或使用 Android 的預設行為時，使用者新增生物特徵後金鑰會失效，所以要有重新註冊的流程。生物辨識只代表「現在是手機主人在操作」，使用者的身分是註冊時建立的。

- id: exchange-account-security-05
  type: multi
  level: 3
  priority: P1
  tags: [auto-lock, session, step-up]
  prompt: |
    關於自動鎖定、登入狀態（session）與高風險操作的設計，哪些敘述正確？（複選）
  options:
    - "計算「進背景多久」要用單調時鐘（只會往前走、不受使用者修改系統時間影響，例如 Android 的 `SystemClock.elapsedRealtime()`、iOS 的 `mach_continuous_time()`），否則使用者改系統時間就能繞過鎖定"
    - "鎖定時只要蓋一層畫面即可，記憶體裡的 token 與餘額可以保留"
    - "出金、新增出金地址、修改密碼、關閉 2FA 都應該 step-up（當下再驗證一次），並且由伺服器強制，不能只靠 client 檢查"
    - "改密碼之後，舊的 refresh token 與其他裝置的登入狀態應該由伺服器端失效"
    - "refresh token 可以放在 `UserDefaults`，因為它不是密碼"
  answer: [0, 2, 3]
  explain: |
    - 第 1 項正確：如果用 `Date()` 這類系統時間計算，使用者把系統時間往回調就能繞過鎖定。單調時鐘不受影響。
    - 第 2 項錯：只蓋一層畫面的話，token 和餘額仍然在記憶體裡，用記憶體傾印或除錯器還是拿得到。鎖定時要一起清掉。
    - 第 3 項正確：client（App）的檢查可以被繞過，真正的判斷要在伺服器。
    - 第 4 項正確：refresh token 是用來換新登入憑證的，改密碼後如果舊的還能用，偷到 token 的人就可以繼續使用。
    - 第 5 項錯：refresh token 的價值等同於登入狀態，要放在 Keychain 或 Keystore 的加密空間。`UserDefaults` 沒有加密，備份時也可能被讀到。

    新增出金地址後設定一段冷卻時間、限制出金額度，是常見的設計建議，各家交易所不一定有這個規則。

- id: exchange-account-security-06
  type: fill
  level: 2
  priority: P1
  tags: [android, biometricprompt, keystore]
  prompt: |
    Android：建立一把「使用前必須通過生物辨識」的簽章金鑰（橢圓曲線 secp256r1），並在 `BiometricPrompt` 中用 `Signature` 簽伺服器傳來的 challenge。補上缺的程式碼。
  codeLang: kotlin
  code: |
    val spec = KeyGenParameterSpec.Builder("auth_key", KeyProperties.PURPOSE_SIGN)
        .setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1"))
        .setDigests(KeyProperties.DIGEST_SHA256)
        .____(true)
        .build()

    // 使用時
    val signature = Signature.getInstance("SHA256withECDSA").apply {
        initSign(privateKey)
    }

    prompt.authenticate(promptInfo, BiometricPrompt.____(signature))
  blanks:
    - [setUserAuthenticationRequired]
    - [CryptoObject]
  explain: |
    - `setUserAuthenticationRequired(true)`：這把金鑰必須在使用者通過驗證之後才能使用。沒有它，金鑰任何時候都能用，生物辨識就沒有綁在金鑰上。
    - `BiometricPrompt.CryptoObject(signature)`：把 `Signature`（也可以是 `Cipher`、`Mac`）交給系統。只有生物辨識成功後，這個物件才能執行簽章。

    `promptInfo` 的 allowedAuthenticators 建議使用 `BIOMETRIC_STRONG`（強度最高的一級）。金鑰預設在使用者新增生物特徵後失效（會丟出 `KeyPermanentlyInvalidatedException`）。iOS 的對應寫法是 `SecAccessControlCreateWithFlags(..., .biometryCurrentSet, ...)`。

- id: exchange-account-security-07
  type: single
  level: 2
  priority: P1
  tags: [device-binding, integrity]
  prompt: |
    交易所想在使用者從「新裝置」登入時提高保護。下列設計哪個最合理？
  options:
    - "用廣告識別碼（IDFA／Advertising ID）當裝置識別碼，並在 client 判斷是否為新裝置"
    - "伺服器維護已授權裝置清單；新裝置登入要通知使用者並額外驗證（email 或已授權裝置確認）；裝置識別碼存在 Keychain（`ThisDeviceOnly`）或由 Keystore 金鑰衍生；完整性用 App Attest／Play Integrity 由**伺服器端**驗證，越獄／root 偵測只是輔助"
    - "只在 client 偵測越獄或 root，偵測到就彈出警告，使用者按確定可以繼續使用"
    - "每次登入都要求使用者輸入 10 位數的裝置序號"
  answer: 1
  explain: |
    其他選項錯在哪裡：
    - 第 1 項：廣告識別碼可以被使用者重設或關閉，不適合當作安全用途。而且「是不是新裝置」的判斷必須在伺服器，client 端的判斷可以被繞過。
    - 第 3 項：只在 client 偵測越獄或 root，偵測程式本身可以被繞過，而且警告後仍可繼續使用，等於沒有防護。它只能提高門檻，不能取代伺服器的判斷。
    - 第 4 項：要使用者輸入序號，體驗很差，使用者也不容易取得，而且序號一旦洩漏就失效。裝置識別碼應該由 App 自動產生並保存。

    第 2 項的幾個重點：App Attest（iOS）與 Play Integrity（Android）的結果要送到伺服器驗證，才能當作「這是未被修改的 App、在真實裝置上」的訊號，但也不是絕對保證。iOS 的 Keychain 項目在重新安裝後通常還在（目前的行為，Apple 沒有保證），所以裝置識別碼可以跨重新安裝保留；Android 的 Keystore 金鑰在解除安裝時會被刪除。

- id: exchange-account-security-08
  type: code
  level: 2
  priority: P1
  tags: [totp, hmac, base32, rfc6238]
  prompt: |
    實作 TOTP（兩步驟驗證的 6 位數驗證碼，RFC 6238）。測試使用 RFC 附錄 B 的測試資料。

    - `totp(secret:unixSeconds:digits:period:algorithm:)`：算出驗證碼。
      - counter ＝ `unixSeconds / period`，轉成 8 個位元組（big-endian：最高位的位元組放最前面）
      - HMAC 依 `algorithm` 選擇 SHA-1、SHA-256 或 SHA-512
      - 動態截斷：取最後一個位元組的低 4 位元當 offset，從 offset 取 4 個位元組，最高位元清成 0（`& 0x7fffffff`）
      - 對 `10^digits` 取餘數，**左邊補零**成 `digits` 位的字串
      - `digits` 預設 6、`period` 預設 30、`algorithm` 預設 SHA-1
    - `base32Decode(_ s)`：把 Base32（RFC 4648，只用 `A-Z` 與 `2-7` 的編碼）轉回位元組。不分大小寫，忽略空白與結尾的 `=`；遇到不在字母表（`A-Z2-7`）裡的字元回傳 nil
    - `verifyTOTP(code:secret:unixSeconds:window:)`：伺服器端驗證。檢查 counter 從 `now - window` 到 `now + window`，有符合就回傳**符合的 counter**，否則回傳 nil。`code` 的長度不是 6、或含有非數字字元時直接回傳 nil（一律用 6 位數、30 秒、SHA-1）
  hints:
    - "counter 轉 8 個位元組：用迴圈從陣列最後一格（index 7）往前填，每次放入 `counter & 0xff`，再把 counter 右移 8 位元。"
    - "Swift 用 CryptoKit：`Insecure.SHA1`、`SHA256`、`SHA512` 的 `HMAC`；Kotlin 用 `Mac.getInstance(\"HmacSHA1\" | \"HmacSHA256\" | \"HmacSHA512\")`。"
    - "Base32 解碼：每個字元代表 5 個位元，累積到 8 個位元就輸出一個位元組。"
  swift:
    starter: |
