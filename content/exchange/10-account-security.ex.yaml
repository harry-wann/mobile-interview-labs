    solution: |
      import javax.crypto.Mac
      import javax.crypto.spec.SecretKeySpec

      enum class TotpAlgorithm(val macName: String) {
          SHA1("HmacSHA1"), SHA256("HmacSHA256"), SHA512("HmacSHA512")
      }

      private fun hotp(
          secret: ByteArray,
          counter: Long,
          digits: Int,
          algorithm: TotpAlgorithm,
      ): String {
          val message = ByteArray(8)
          var c = counter
          for (i in 7 downTo 0) {
              message[i] = (c and 0xff).toByte()
              c = c ushr 8
          }
          val mac = Mac.getInstance(algorithm.macName)
          mac.init(SecretKeySpec(secret, algorithm.macName))
          val h = mac.doFinal(message)
          val offset = h[h.size - 1].toInt() and 0x0f
          val binary = ((h[offset].toInt() and 0x7f) shl 24) or
              ((h[offset + 1].toInt() and 0xff) shl 16) or
              ((h[offset + 2].toInt() and 0xff) shl 8) or
              (h[offset + 3].toInt() and 0xff)
          var mod = 1L
          repeat(digits) { mod *= 10 }
          return (binary.toLong() % mod).toString().padStart(digits, '0')
      }

      fun totp(
          secret: ByteArray, unixSeconds: Long, digits: Int = 6, period: Long = 30,
          algorithm: TotpAlgorithm = TotpAlgorithm.SHA1
      ): String = hotp(secret, unixSeconds / period, digits, algorithm)

      fun base32Decode(s: String): ByteArray? {
          val alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"
          var buffer = 0
          var bits = 0
          val out = ArrayList<Byte>()
          for (ch in s.uppercase()) {
              if (ch == ' ' || ch == '=') {
                  continue
              }
              val idx = alphabet.indexOf(ch)
              if (idx < 0) {
                  return null
              }
              buffer = (buffer shl 5) or idx
              bits += 5
              if (bits >= 8) {
                  bits -= 8
                  out.add(((buffer shr bits) and 0xff).toByte())
              }
          }
          return out.toByteArray()
      }

      fun verifyTotp(
          code: String,
          secret: ByteArray,
          unixSeconds: Long,
          window: Int,
      ): Long? {
          if (code.length != 6 || !code.all { it in '0'..'9' }) {
              return null
          }
          val now = unixSeconds / 30
          for (delta in -window..window) {
              val counter = now + delta
              if (counter < 0) {
                  continue
              }
              if (hotp(secret, counter, 6, TotpAlgorithm.SHA1) == code) {
                  return counter
              }
          }
          return null
      }
    tests: |
      val k1 = "12345678901234567890".toByteArray()
      val k256 = "12345678901234567890123456789012".toByteArray()
      val k512 = "1234567890123456789012345678901234567890123456789012345678901234"
          .toByteArray()

      check("RFC 6238 SHA-1（8 位數）") {
          totp(k1, 59, digits = 8) == "94287082" &&
              totp(k1, 1111111109, digits = 8) == "07081804" &&
              totp(k1, 1111111111, digits = 8) == "14050471" &&
              totp(k1, 1234567890, digits = 8) == "89005924" &&
              totp(k1, 2000000000, digits = 8) == "69279037" &&
              totp(k1, 20000000000, digits = 8) == "65353130"
      }

      check("6 位數：同一個整數取後 6 位，且要補零") {
          totp(k1, 59) == "287082" && totp(k1, 1111111109) == "081804"
      }

      check("SHA-256、SHA-512 的向量") {
          totp(k256, 59, digits = 8, algorithm = TotpAlgorithm.SHA256) ==
              "46119246" &&
              totp(k512, 59, digits = 8, algorithm = TotpAlgorithm.SHA512) ==
                  "90693936"
      }

      check("period 邊界：counter 在 29→30 秒時換") {
          totp(k1, 0) == "755224" && totp(k1, 29) == "755224" &&
              totp(k1, 30) == "287082" && totp(k1, 60) == "359152"
      }

      check("base32Decode：RFC 範例、大小寫、空白與補齊") {
          base32Decode("GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ")
              ?.contentEquals(k1) == true &&
              base32Decode("gezd gnbv gy3t qojq gezd gnbv gy3t qojq")
                  ?.contentEquals(k1) == true &&
              base32Decode("JBSWY3DPEHPK3PXP")
                  ?.toList() ==
                      listOf(
                          0x48, 0x65, 0x6c, 0x6c, 0x6f, 0x21, 0xde, 0xad, 0xbe, 0xef,
                      )
                  .map { it.toByte() } &&
              base32Decode("MFRGG===")?.toList() == listOf(0x61, 0x62, 0x63).map {
                  it.toByte()
              }
      }

      check("base32Decode：不合法的字元回傳 null") {
          base32Decode("GEZD0NBV") == null && base32Decode("GEZD-NBV") == null
      }

      check("verifyTotp：視窗內回傳符合的 counter，視窗外回傳 null") {
          verifyTotp("287082", k1, 59, 0) == 1L &&
              verifyTotp("287082", k1, 89, 1) == 1L &&
              verifyTotp("287082", k1, 29, 1) == 1L &&
              verifyTotp("287082", k1, 119, 1) == null &&
              verifyTotp("287082", k1, 119, 2) == 1L
      }

      check("verifyTotp：格式不對直接 null") {
          verifyTotp("28708", k1, 59, 1) == null &&
              verifyTotp("28708a", k1, 59, 1) == null &&
              verifyTotp("", k1, 59, 1) == null
      }

- id: exchange-account-security-09
  type: open
  level: 2
  priority: P1
  tags: [security, auth]
  prompt: |
    請設計交易所 App 的帳戶安全：登入、兩步驟驗證（TOTP）、生物辨識、自動鎖定、新裝置登入，以及出金等高風險操作的再驗證（step-up）。說明 App 與伺服器各自負責什麼，以及你過去的相關經驗可以怎麼對應。
  promptJa: |
    取引所アプリのアカウントセキュリティ（ログイン、二段階認証（TOTP）、生体認証、オートロック、新しい端末でのログイン、出金などの重要な操作での再認証（step-up））を設計してください。アプリとサーバーの役割分担と、これまでの経験をどう活かせるかも説明してください。
  keyPoints:
    - "TOTP：RFC 6238（SHA-1、30 秒、6 位數）；伺服器容許前後各 1 個 time step、記住最後成功的 counter 防止重放、限制嘗試次數；不要在同一個 App 內產生 TOTP"
    - "生物辨識綁金鑰：註冊公鑰、伺服器送 challenge、用私鑰簽名（iOS `SecAccessControl`、Android Keystore 加 `CryptoObject`），而不是只看 `evaluatePolicy` 的布林值；新增生物特徵會讓金鑰失效，要有重新註冊流程"
    - "自動鎖定：用單調時鐘計時、切到多工畫面時遮罩、鎖定時清除記憶體裡的 token 與餘額、剪貼簿設定過期"
    - "裝置綁定：伺服器維護授權裝置清單、新裝置通知並額外驗證、裝置識別碼放 Keychain（ThisDeviceOnly）、App Attest 與 Play Integrity 由伺服器驗證"
    - "登入狀態：短效 access token 搭配輪替的 refresh token，改密碼和移除裝置時由伺服器讓它們失效，閒置逾時與絕對逾時並用"
    - "step-up：出金、新增地址、改密碼或 email、關閉 2FA 由伺服器強制；challenge 綁定金額和地址；新增地址後可設冷卻時間（各家規則不同）"
    - "對應經驗：社交 App 的越獄、root 與 Play Integrity 裝置檢查；行情分析 App 用 Keychain，以及 Tink 搭配 Keystore 保存登入狀態"
  modelAnswer: |
    我會把安全的判斷放在伺服器，App 負責取得證明。

    兩步驟驗證用 TOTP（RFC 6238，也就是驗證器 App 那種 6 位數驗證碼）。伺服器容許前後各一個 30 秒的 time step，記住這位使用者最後成功的 counter，避免同一個碼被重放，並限制嘗試次數。TOTP 不會由同一個 App 產生，否則密碼和驗證碼落在同一個地方，兩個因素就變成一個。

    生物辨識我會綁在金鑰上，而不是只看 `evaluatePolicy` 的布林值，因為那在被攻破的手機上可以被 hook。註冊時在手機上產生金鑰對，私鑰放在 Secure Enclave 或 Keystore，公鑰登錄到伺服器；敏感操作時伺服器送一次性的 challenge，通過生物辨識後用私鑰簽名，伺服器驗證簽章。iOS 用 `SecAccessControl`，Android 用 Keystore 加 `BiometricPrompt` 的 `CryptoObject`。新增生物特徵會讓金鑰失效，所以要有重新註冊的流程。

    自動鎖定用單調時鐘計時，切到多工畫面時遮罩，鎖定時清掉記憶體裡的 token 和餘額。新裝置登入時，伺服器通知使用者並要求額外驗證，同時用 App Attest 與 Play Integrity 在伺服器端驗證裝置。登入狀態用短效的 access token 搭配輪替的 refresh token，改密碼和移除裝置時由伺服器讓它們失效。出金、新增地址、改密碼和關閉 2FA 都要 step-up，由伺服器強制，challenge 綁定金額和地址。

    相關經驗方面，我在一個社交 App 做過越獄偵測，以及 root 和 Play Integrity 的裝置檢查；在一個行情分析 App，iOS 用 Keychain，Android 用 Tink 搭配 Keystore 保存登入狀態。到交易所的 App，我會用上面的架構來做 2FA 和生物辨識綁金鑰。
  modelAnswerJa: |
    セキュリティの判断はサーバーに置き、アプリは証明を取得する役割にします。

    二段階認証には TOTP（RFC 6238、認証アプリでおなじみの 6 桁のコード）を使います。サーバーは前後 1 つずつの 30 秒単位の time step を許容し、そのユーザーが最後に成功した counter を記録して同じコードの再利用（リプレイ）を防ぎ、試行回数も制限します。TOTP は同じアプリ内で生成しません。パスワードとコードが同じ場所に置かれ、2 つの要素が 1 つになってしまうためです。

    生体認証は、`evaluatePolicy` の真偽値だけを見るのではなく、鍵に結び付けます。侵害された端末では、その真偽値が hook によって書き換えられてしまうからです。登録時に端末で鍵ペアを生成し、秘密鍵は Secure Enclave または Keystore に置き、公開鍵をサーバーに登録します。重要な操作では、サーバーが一度限りの challenge を送り、アプリは生体認証に成功した後に秘密鍵で署名し、サーバーが署名を検証します。iOS は `SecAccessControl`、Android は Keystore と `BiometricPrompt` の `CryptoObject` を使います。生体情報が追加されると鍵が無効になるため、再登録の流れも用意します。

    オートロックは単調な時計で時間を測り、マルチタスク画面では画面を隠し、ロック時にはメモリ上の token と残高を消去します。新しい端末でのログインでは、サーバーがユーザーに通知して追加の認証を求め、App Attest と Play Integrity をサーバー側で検証します。ログイン状態は、有効期限の短い access token と、更新のたびに入れ替わる refresh token で管理し、パスワード変更や端末削除の際はサーバーが無効にします。出金、アドレス追加、パスワード変更、2FA の無効化は step-up とし、サーバーが強制します。challenge には金額とアドレスを含めます。

    経験としては、ソーシャルアプリでジェイルブレイク検知と、root・Play Integrity の端末チェックを扱いました。相場分析アプリでは、iOS は Keychain、Android は Tink と Keystore でログイン状態を保存していました。取引所アプリでは、この構成で 2FA と鍵に結び付けた生体認証を実装します。
  followUps:
    - "使用者換手機時，如何安全地轉移 TOTP 與生物辨識金鑰？"
    - "生物辨識金鑰失效（新增指紋）後的重新註冊流程，如何避免變成繞過 2FA 的後門？"
    - "如何偵測並處理使用者用 root／越獄的裝置？"
  timeLimitSec: 180

- id: exchange-account-security-10
  type: flash
  level: 1
  priority: P1
  tags: [totp]
  front: TOTP 的算法與測試資料、生物辨識綁金鑰的原則
  back: |
    - **算法**：counter ＝ `floor(T ÷ 30)`（轉成 8 個位元組）→ 用秘密算 HMAC-SHA-1 → 取最後一個位元組的低 4 位元當 offset → 從 offset 取 4 個位元組、最高位元清成 0 → 對 `10^digits` 取餘數，不足位數左邊補零。
    - **RFC 測試資料**（秘密 `12345678901234567890`）：T=59 → 8 位數 `94287082`（6 位數 `287082`）；T=1111111109 → `07081804`。
    - **伺服器**：視窗 ±1、記住最後成功的 counter 防止重放、限制嘗試次數、固定時間比較。
    - **生物辨識**要綁金鑰（註冊公鑰，之後用 challenge 簽章），不是只看 `evaluatePolicy` 的布林值；新增生物特徵會讓金鑰失效。
    - **step-up**（高風險操作再驗證一次）由伺服器強制：出金、新增地址、改密碼、關閉 2FA。
