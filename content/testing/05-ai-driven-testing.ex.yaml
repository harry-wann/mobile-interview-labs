- id: testing-ai-01
  type: open
  level: 3
  priority: P0
  tags: [ai, testing]
  prompt: |
    「如果要你建立基於 AI 的自動化測試環境，你會怎麼規劃？前 90 天做什麼？怎麼證明有效？」
  promptJa: |
    「AI を活用したテスト自動化環境の構築を任されたら、どう計画しますか？最初の90日で何をし、効果をどう示しますか？」
  keyPoints:
    - 分層藍圖：好測試的 App → 確定性的測試（單元、截圖比對、Maestro、device farm）→ AI 層 → 指標
    - AI 的三個角色：寫測試的助手、夜間探索 agent（透過 MCP 操作模擬器）、CI 失敗原因分析
    - 把關：pass／fail 由寫死的斷言決定；AI 產生的測試要先證明能抓到錯（故意改壞程式）、連跑多次都穩定；人工 review；探索發現的問題轉成固定測試
    - 安全與成本：不把正式環境的資料送給外部模型；agent 探索放在夜間
    - 30／60／90 天：盤點與訂規範 → 關鍵流程的 Maestro＋AI 寫測試的流程 → 探索 agent＋失敗分析
    - 指標：有效測試數、mutation score、時好時壞的比例、上線後逃過測試的 bug 數、失敗分析省下的時間
    - 連結已經做過的事：AI 撰寫單元測試、規劃→實作→review→修正的循環
  modelAnswer: |
    我會分成四層來建。

    最底層是「好測試的 App」：每個重要元件都有固定的元件 ID、網路和時間可以從外面換掉、UI 測試能用啟動參數換成 stub，測試環境有測試帳號和固定的 TOTP 金鑰。這一層沒做好，AI 也救不了。

    第二層是確定性的測試：每個 PR 跑單元測試和截圖比對；合併後跑 Maestro 寫的關鍵流程，例如登入、下單、撤單、入出金；每天晚上在 device farm 的實機上跑完整的端到端測試。

    第三層才是 AI，分三個角色。一是寫測試的助手：用規則檔和測試清單讓 agent 產生單元測試和 Maestro 流程的草稿，但每個測試都要先證明自己抓得到錯，也就是故意改壞程式或跑 mutation testing，並且連跑幾次確認穩定，再經過人工 review 才合併。二是夜間的探索 agent：透過 MCP 操作模擬器，依目標清單探索，回報 crash、版面跑掉、忘了翻譯的字串，發現的問題再轉成固定的測試。三是 CI 失敗時的原因分析，把失敗分成產品 bug、時好時壞的測試或環境問題。原則是 AI 負責產生和分析，pass 或 fail 一定由程式碼裡的斷言決定。

    時程上，前 30 天盤點現況、訂規範；60 天讓關鍵流程的 Maestro 測試進 CI，AI 撰寫測試的流程開始運作；90 天上線探索 agent 和失敗分析。效果用指標證明：有效測試的數量、mutation score、時好時壞的比例、上線後的 bug 數，以及失敗分析省下的時間。

    這些不是從零開始。在一個社交 App，我把 AI agent 放進開發流程，建立「規劃、實作、review、修正」的循環，也用 AI 撰寫單元測試來提升覆蓋率，最後的驗證由我自己把關；UI 測試則用依賴注入換成 stub，讓結果可以重現。換成交易所 App，我想把這套做法系統化，變成整個團隊都能用的測試環境。
  modelAnswerJa: |
    4つの層で構築したいと考えています。

    一番下は「テストしやすいアプリ」です。主要な要素にアクセシビリティ識別子を付け、通信や時刻を差し替えられるようにし、UI テストでは起動引数でスタブを注入できるようにします。ステージング環境にはテスト用アカウントと固定の TOTP シークレットを用意します。

    二層目は確定的なテストです。PR ごとにユニットテストとスナップショットテスト、マージ後に Maestro でログイン・注文・取消・入出金などの重要導線、夜間にデバイスファームで E2E 全体を実行します。

    三層目が AI です。役割は三つで、一つ目はテスト作成の支援です。ルールファイルとテストカタログをもとにエージェントがテスト案を作りますが、実装をわざと壊したりミューテーションテストを行ったりして、テストが確かに失敗することを確認し、複数回実行して不安定でないことを確かめ、人がレビューしてからマージします。二つ目は夜間の探索エージェントで、MCP 経由でシミュレーターを操作し、クラッシュやレイアウト崩れ、未翻訳の文言を報告させ、見つかった問題は固定のテストにします。三つ目は CI 失敗時の原因分類です。合否は必ずコード上のアサーションで判定します。

    スケジュールは、30日で現状把握とルール整備、60日で重要導線の Maestro を CI に載せて AI によるテスト作成を回し始め、90日で探索エージェントと失敗分析を稼働させます。効果は有効なテスト数、ミューテーションスコア、不安定なテストの割合、リリース後の障害件数で示します。

    これはゼロからのスタートではありません。あるソーシャルアプリでは AI エージェントを開発フローに組み込み、「計画、実装、レビュー、修正」のサイクルを作り、AI でユニットテストを書いてカバレッジを高めました。最終的な検証は自分で行っていました。UI テストは DI でスタブに差し替え、再現できるようにしていました。取引所アプリでは、このやり方を仕組みとして整え、チーム全体で使えるテスト環境にしたいと考えています。
  followUps:
    - 探索 agent 每次走的路徑都不同，你怎麼讓結果可以重現？
    - 你會用哪個模型？成本大概多少？資料安全怎麼處理？
    - 如果團隊對 AI 寫的測試不信任，你怎麼推動？
  timeLimitSec: 300

- id: testing-ai-02
  type: single
  level: 2
  priority: P0
  tags: [ai, oracle]
  prompt: |
    在 AI 驅動的測試中，「下單後可用日圓餘額是否正確扣除」這個檢查，應該由誰判定 pass／fail？
  options:
    - "讓 AI 模型看截圖，判斷數字看起來是否合理"
    - "測試程式碼裡寫死的斷言（依測試資料算出預期值並比對，每次結果都一樣）"
    - "讓兩個不同的 AI 模型投票"
    - "人工每天看一次截圖"
  answer: 1
  explain: |
    跟金額和狀態有關的判斷，必須每次結果都一樣、可以重現。AI 模型的判斷每次可能不同（第 1、3 項），人工每天看截圖（第 4 項）又慢又容易漏看。
    AI 可以幫忙產生測試、分析失敗原因，但「對或錯」的最終判斷要交給寫死的斷言。

- id: testing-ai-03
  type: multi
  level: 2
  priority: P0
  tags: [ai, guardrails]
  prompt: |
    AI 產生的測試在合併前，應該通過哪些把關？（複選）
  options:
    - "刻意改壞被測的實作（或跑 mutation testing），確認測試會失敗"
    - "連續執行多次，確認不會時好時壞"
    - "人工 review，和產品程式碼一樣"
    - "只要測試數量增加就直接合併"
    - "確認沒有用 sleep 等待、沒有依賴真實網路與時間"
  answer: [0, 1, 2, 4]
  explain: |
    第 4 項錯：測試的數量不代表品質。測試必須證明它抓得到錯、結果穩定、讀得懂也好維護。
    這個網站的實作題也用同樣的原則：題目給的起始程式碼（starter），至少要讓一個測試失敗，才證明測試有在檢查。

- id: testing-ai-04
  type: order
  level: 2
  priority: P1
  tags: [ai, exploration]
  prompt: |
    探索 agent 發現一個問題後，到它成為固定保護的流程。
  items:
    - 夜間探索 agent 透過 MCP 操作模擬器，依目標「完成一筆指値買單」探索
    - 發現異常（例如字體放大時確認按鈕被遮住），附上截圖和操作步驟寫成報告
    - 人確認是真的問題，開單並修正
    - 把重現步驟寫成固定的 Maestro 流程或 UI 測試（可以請 agent 產生草稿）
    - 這個測試加入 CI，之後每次都會檢查
  explain: |
    agent 每次探索的路徑都不同，不能拿來當成每天固定檢查的測試。它真正的價值是「發現問題」，發現之後要轉成每次結果都一樣的固定測試。

- id: testing-ai-05
  type: single
  level: 1
  priority: P1
  tags: [mcp]
  prompt: |
    要讓 Claude Code 這類 agent 直接操作 iOS 模擬器或 Android 模擬器（點擊、截圖、讀畫面元素），通常透過什麼機制？
  options:
    - "直接在 prompt 裡貼截圖"
    - "MCP（Model Context Protocol，讓 AI 呼叫外部工具的協定）server，例如 mobile-mcp、XcodeBuildMCP，把裝置操作包成 agent 可以呼叫的工具"
    - "把 App 改寫成網頁版"
    - "用 ADB 的 logcat"
  answer: 1
  explain: |
    MCP server 把「建置、安裝、點擊、輸入、截圖、讀取畫面上的元件資訊」包成工具，agent 可以一步一步操作並觀察結果。
    其他選項：貼截圖只能讓 AI「看」，不能操作；改寫成網頁版不切實際；logcat 只是讀 Android 的 log，不能操作畫面。

- id: testing-ai-06
  type: flash
  level: 1
  priority: P0
  tags: [ai]
  front: AI 自動化測試的四層架構
  back: |
    1. 好測試的 App（元件 ID、依賴注入的 stub、啟動參數、測試帳號＋固定的 TOTP 金鑰）
    2. 確定性的測試（每個 PR：單元測試、截圖比對；合併後：Maestro 關鍵流程；每天晚上：device farm）
    3. AI 層（寫測試的助手＋有效性驗證、夜間探索 agent、CI 失敗原因分析）
    4. 指標（有效測試數、mutation score、時好時壞的比例、上線後逃過測試的 bug 數）
