- id: testing-strategy-01
  type: multi
  level: 2
  priority: P0
  tags: [strategy, risk]
  prompt: |
    交易所 App 剛開始建立自動化測試，資源有限。下列哪些應該**最優先**寫成單元測試？（複選）
  options:
    - "價格與數量的精度、捨入規則"
    - "訂單狀態的事件合併規則（reducer：輸入目前狀態和事件，輸出新狀態）"
    - "設定頁的開關是否能切換"
    - "WebSocket 訊息的解壓縮與解析"
    - "API 簽名字串的產生"
    - "關於我們頁面的版本號顯示"
  answer: [0, 1, 3, 4]
  explain: |
    優先測「錯了就是錢或資料出錯」、而且邏輯複雜的部分。精度、狀態合併、訊息解析、API 簽名都是純邏輯，寫成單元測試又快又穩。
    設定開關和版本號顯示（第 3、6 項）出錯的影響小，可以靠截圖比對或手動確認。

- id: testing-strategy-02
  type: single
  level: 2
  priority: P0
  tags: [metrics, mutation]
  prompt: |
    團隊的覆蓋率已經 85%，但上線後仍常出現金額計算的 bug。下列哪個指標最能揭露「測試其實沒抓到問題」？
  options:
    - "測試檔案數量"
    - "mutation score：故意改壞程式（例如把 `<` 改成 `<=`），測試能抓到的比例"
    - "測試執行時間"
    - "把行覆蓋率（line coverage）提高到 95%"
  answer: 1
  explain: |
    覆蓋率只代表程式碼「被執行過」，不代表結果「被檢查過」，所以再提高覆蓋率（第 4 項）也不一定有用；測試檔案數量和執行時間（第 1、3 項）更看不出測試有沒有抓到錯。
    mutation testing 會自動在程式裡製造小錯誤，如果測試還是全部通過，代表測試的檢查（斷言）不夠。這也是驗證 **AI 產生的測試**是否有效的好方法。

- id: testing-strategy-03
  type: order
  level: 1
  priority: P1
  tags: [pyramid]
  prompt: |
    依「執行速度由快到慢」排列這些測試。
  items:
    - 單元測試（純邏輯、狀態合併規則）
    - 整合測試（Repository 搭配假的伺服器）
    - 截圖比對測試（snapshot test）
    - UI／端到端測試（在模擬器上跑完整流程）
  explain: |
    越底層越快、越穩定，數量應該越多；越上層越接近真實的使用情況，但又慢又容易時好時壞（flaky），數量要節制，集中在關鍵流程。

- id: testing-strategy-04
  type: open
  level: 2
  priority: P0
  tags: [strategy]
  prompt: |
    「如果你加入後負責建立我們 App 的測試策略，你會怎麼排優先順序？」
  promptJa: |
    「入社後にアプリのテスト戦略づくりを任されたら、どのように優先順位を付けますか？」
  keyPoints:
    - 先盤點現況：現有的測試、CI 跑多久、哪些測試時好時壞、最近線上的 bug 集中在哪裡
    - 依風險排序：錢 → 身分與安全 → 即時資料的正確性 → 法規相關 → 一般 UI
    - 每一層的分工：純邏輯大量寫單元測試；整合測試驗證重連、逾時；截圖比對驗證 UI 狀態；端到端測試只放關鍵流程
    - 可測試性：依賴注入、可控制的時間、純函式、錄下來的測試資料
    - 指標：關鍵流程有沒有覆蓋、mutation score、flaky 比例、PR 等多久、上線後逃過測試的 bug 數
    - 連結實務經驗（依賴注入換 stub、禁止 sleep），以及 AI 輔助測試（後面的單元）
  modelAnswer: |
    我會先花一兩週盤點現況：現在有哪些測試、CI 跑多久、哪些測試時好時壞，以及最近線上的缺陷集中在哪裡。

    接著依風險排優先順序。第一是錢：金額精度、下單和撤單、入出金；第二是身分與安全：登入、兩步驟驗證、登入過期；第三是即時資料的正確性：行情、訂單簿、斷線重連；第四是合規相關的畫面。

    每一層的分工是：純邏輯大量寫單元測試，例如精度規則、訂單狀態的合併、WebSocket 的解析和 API 簽名；整合測試驗證重連後有沒有重新訂閱、下單逾時後有沒有查詢對帳；截圖比對驗證訂單簿、深色模式、多種語言和字體放大；端到端測試只放登入、下單、入出金這幾條關鍵流程。

    為了讓測試好寫，設計上要能注入網路、時鐘和儲存。我在一個社交 App 用依賴注入把網路換成 stub，讓 UI 測試每次結果都一樣，也規定測試裡不能用 sleep 等待。

    指標方面，我不只看覆蓋率，也會看關鍵流程有沒有覆蓋、mutation score、時好時壞的測試比例，以及上線後的 bug 有沒有減少。
  modelAnswerJa: |
    まず1〜2週間で現状を把握します。既存のテスト、CI の所要時間、不安定なテスト、最近の本番障害がどこに集中しているかを確認します。

    そのうえでリスク順に優先度を付けます。一番はお金に関わる部分で、金額の精度、注文と取消、入出金です。次にログイン、二段階認証、セッション切れなどの認証とセキュリティ、その次に相場や板、再接続などのリアルタイムデータの正確性、そしてコンプライアンスに関わる画面です。

    層ごとの役割としては、精度ルールや注文状態のマージ、WebSocket の解析、API 署名などの純粋なロジックはユニットテストを厚くし、再接続後の再購読や注文タイムアウト後の照会は結合テスト、板やダークモード、多言語、文字サイズはスナップショットテスト、E2E はログイン・注文・入出金などの重要導線に絞ります。

    テストしやすくするため、通信、時計、ストレージは差し替え可能に設計します。あるソーシャルアプリでは DI でスタブを注入して UI テストを再現可能にし、sleep による待機を禁止していました。

    指標はカバレッジだけでなく、重要導線のカバー状況、ミューテーションスコア、不安定なテストの割合、リリース後の障害件数を見ます。
  timeLimitSec: 180
