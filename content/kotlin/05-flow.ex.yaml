- id: kotlin-flow-01
  type: single
  level: 2
  priority: P0
  tags: [events, stateflow, channel]
  prompt: |
    下單成功後 ViewModel 要通知畫面「導航到訂單詳情」。這個事件只能處理一次，而且畫面可能暫時在背景或被重建（旋轉）。依 Android 官方 UI events 的建議，哪個設計最穩健？
  options:
    - "`MutableSharedFlow<Event>()`（預設參數，replay 0）"
    - "`MutableSharedFlow<Event>(replay = 1)`"
    - "`UiState` 帶一個 `pendingNavigation: OrderId?`；畫面導航後呼叫 `viewModel.onNavigated()`，由 ViewModel 把它清成 `null`"
    - "`Channel<Event>(Channel.BUFFERED)` 搭配 `receiveAsFlow()`"
  answer: 2
  explain: |
    官方建議把 UI 事件**當成 state**（狀態）：ViewModel 保存「待處理的導航」，UI 處理完後明確通知 ViewModel 清除。state 會一直在，畫面在背景或重建都不會遺失，處理完就清掉所以也不會重複處理。
    - 第 1 項錯：預設的 `SharedFlow`（replay 0、沒有 buffer）在沒有訂閱者時 emit 的值直接消失，畫面在背景時事件就丟了。
    - 第 2 項錯：`replay = 1` 的 `SharedFlow` 會把最後一個事件重播給之後的每個訂閱者，旋轉螢幕後新的畫面又收到一次，導航被重複執行。
    - 第 4 項錯：`Channel` 搭配 `receiveAsFlow()` 是常見的次選，事件會暫存到有人收，每個元素只交給一個接收者，寫起來也簡單。但如果收集端在取出事件之後、尚未處理完之前就被取消（畫面被銷毀），這筆事件就沒有人處理了。Toast 這類漏掉也無妨的事件可以接受，導航與下單結果則建議用 state。

- id: kotlin-flow-02
  type: predict
  level: 2
  priority: P0
  tags: [stateflow, conflation]
  prompt: |
    在單執行緒的 `runBlocking` 內執行，依序印出什麼？（2 行輸出）
  codeLang: kotlin
  code: |
    import kotlinx.coroutines.*
    import kotlinx.coroutines.flow.*

    fun main() = runBlocking {
        val s = MutableStateFlow(0)
        val job = launch(start = CoroutineStart.UNDISPATCHED) {
            s.collect { println("got $it") }
        }
        s.value = 1
        s.value = 1
        s.value = 2
        delay(50)
        job.cancel()
    }
  answer: |
    got 0 got 2
  explain: |
    - 第 1 行 `got 0`：`UNDISPATCHED` 讓 collector 立即執行到第一個 suspend 點（暫停點），先收到目前值 `0`。
    - 第 2 行 `got 2`：之後主流程連續設定 `1`、`1`、`2`，期間沒有讓出執行緒，collector 還沒機會執行。`StateFlow` 只保留**最新值**，中間的 `1` 被蓋掉，而且重複設定相同的值本來就不會發射（去重）。所以 collector 下一次醒來只看到 `2`。
    `StateFlow` 適合「畫面狀態」，不適合「每一筆都要處理」的資料（例如 order book 的增量更新）。

- id: kotlin-flow-03
  type: predict
  level: 2
  priority: P1
  tags: [sharedflow, replay]
  prompt: |
    依序印出什麼？（2 行輸出）
  codeLang: kotlin
  code: |
    import kotlinx.coroutines.*
    import kotlinx.coroutines.flow.*

    fun main() = runBlocking {
        val plain = MutableSharedFlow<Int>()
        plain.emit(1)
        val j1 = launch(start = CoroutineStart.UNDISPATCHED) {
            plain.collect { println("plain $it") }
        }
        plain.emit(2)

        val replayed = MutableSharedFlow<Int>(replay = 1)
        replayed.emit(10)
        replayed.emit(11)
        val j2 = launch(start = CoroutineStart.UNDISPATCHED) {
            replayed.collect { println("replay $it") }
        }
        delay(10)
        j1.cancel()
        j2.cancel()
    }
  answer: |
    plain 2 replay 11
  explain: |
    - 第 1 行 `plain 2`：預設的 `MutableSharedFlow()` 沒有 replay（補送給新訂閱者的舊資料）、沒有 buffer。`emit(1)` 發生時沒有訂閱者，值直接消失；之後訂閱者只會收到 `2`。
    - 第 2 行 `replay 11`：`replay = 1` 保留最後一個值給新訂閱者，所以只看到 `11`，`10` 已經被擠掉。
    這是 `SharedFlow` 最常被誤用的地方：以為它像 `StateFlow` 一樣有「目前值」。

- id: kotlin-flow-04
  type: multi
  level: 2
  priority: P0
  tags: [backpressure, conflate, sample, debounce]
  prompt: |
    像交易所這樣的 App 要把 WebSocket 每秒推送很多筆的行情送進 UI。下列哪些敘述正確？（複選）
  options:
    - "對每 50ms 更新一次的價格串流使用 `debounce(300)`，UI 可能長時間得不到更新，因為永遠等不到 300ms 的靜默"
    - "`conflate()` 適合「最新價」「best bid/ask」這種只在意最後狀態的資料，但不適合 order book 的增量更新"
    - "`sample(100)` 會每 100ms 固定發射一次最新值；若這 100ms 內沒有新值就不發"
    - "`buffer(Channel.UNLIMITED)` 是處理突發行情最安全的預設，因為不會丟資料"
  answer: [0, 1, 2]
  explain: |
    - 第 1 項正確：`debounce` 要等到「安靜」才發射，適合搜尋框；每 50 毫秒就來一筆的串流永遠不安靜，UI 幾乎得不到更新。
    - 第 2 項正確：`conflate()` 只留最新的一筆，適合「最新價」「best bid／best ask（最優買價／賣價）」。但增量更新（delta）每一筆都要依序套用，丟掉一筆，本機維護的 order book 就錯了。做法是背景執行緒依序套用，對外發佈快照（某一刻的完整內容），UI 層再 `conflate`／`sample`。
    - 第 3 項正確：`sample` 是時間驅動（固定週期），只發期間內最新的一筆，沒有新值就不發。
    - 第 4 項錯：`UNLIMITED` 沒有上限，上游持續比下游快時記憶體會一路成長，最終 OOM（記憶體用完被系統殺掉）。處理突發流量要設有限的 buffer，或用 `conflate`。

- id: kotlin-flow-05
  type: predict
  level: 3
  priority: P1
  tags: [debounce, virtual-time, runtest]
  prompt: |
    使用 `kotlinx-coroutines-test` 的 `runTest`（虛擬時間，單位毫秒），搜尋框的輸入流依序印出什麼？（`debounce` 是安靜一段時間後才發出最後一筆）
  codeLang: kotlin
  code: |
    import kotlinx.coroutines.*
    import kotlinx.coroutines.flow.*
    import kotlinx.coroutines.test.*

    fun main() = runTest {
        val result = mutableListOf<String>()
        val src = flow {
            emit("b");    delay(100)
            emit("bt");   delay(100)
            emit("btc");  delay(400)
            emit("btcj"); delay(400)
        }
        launch { src.debounce(300).collect { result += "$it@$currentTime" } }
        advanceUntilIdle()
        println(result.joinToString(" "))
    }
  answer: |
    btc@500 btcj@900
  explain: |
    輸入時間線：`b`@0、`bt`@100、`btc`@200、`btcj`@600。
    - `b`、`bt` 後面都在 300 毫秒內又有新值，被丟棄。
    - `btc@500`：`btc` 之後 400 毫秒才有下一個值，安靜滿 300 毫秒時（200 + 300 = 500）發射。
    - `btcj@900`：`btcj`@600 之後安靜滿 300 毫秒（900）發射，這時上游還在 `delay(400)`，尚未結束。
    這是 `debounce` 在搜尋框的正確用法（使用者停止輸入才查詢）；套在持續密集更新的價格串流上，則會因永遠不安靜而幾乎不發射。這段需要 `kotlinx-coroutines-test`，本站 runner 的 classpath 沒有。

- id: kotlin-flow-06
  type: fill
  level: 2
  priority: P0
  tags: [callbackflow, lifecycle]
  prompt: |
    補上兩處：第一處讓 `callbackFlow` 在取消或關閉時解除 listener；第二處讓 Fragment 只在 `STARTED` 狀態收集，離開就取消。
  codeLang: kotlin
  code: |
    fun SocketClient.messages(): Flow<Msg> = callbackFlow {
        val l = Listener { trySend(it) }
        addListener(l)
        ____ { removeListener(l) }
    }

    viewLifecycleOwner.lifecycleScope.launch {
        viewLifecycleOwner.____(Lifecycle.State.STARTED) {
            vm.messages.collect { render(it) }
        }
    }
  blanks:
    - [awaitClose]
    - [repeatOnLifecycle]
  explain: |
    - 第一格 `awaitClose`：讓 producer（發資料的那一側）停在這裡，直到 flow 被取消或 `close()`，並在區塊內解除註冊。沒有它，`callbackFlow` 會直接丟 `IllegalStateException`，這是刻意設計來防止 listener 洩漏的。
    - 第二格 `repeatOnLifecycle`：在進入 `STARTED`（畫面看得到）時啟動區塊、離開時取消，下次回來重新啟動。直接 `lifecycleScope.launch { collect }` 則會一直收集到 destroy，在背景也持續更新、耗電。

- id: kotlin-flow-07
  type: single
  level: 2
  priority: P0
  tags: [stateIn, whilesubscribed]
  prompt: |
    ViewModel 以 `ticker.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), Loading)` 發佈行情。使用者旋轉螢幕時（Activity 重建，collector 短暫消失），下列描述何者正確？
  options:
    - "上游（WebSocket 訂閱）立刻停止，新 Activity 出現後重新訂閱，畫面先閃一下 `Loading`"
    - "上游維持運作，因為 collector 消失的時間小於 5 秒；新 Activity 馬上拿到最近一次的值，不需重建連線"
    - "`5_000` 代表最多每 5 秒才更新一次 UI"
    - "`5_000` 代表 `stateIn` 最多只會收集 5000 筆資料"
  answer: 1
  explain: |
    `WhileSubscribed(stopTimeoutMillis)`：訂閱者（collector）數量降到 0 之後，等 `stopTimeoutMillis` 毫秒才停止上游；期間若有新訂閱者出現，上游不會重啟。5 秒足夠撐過旋轉與短暫切換。
    - 第 1 項錯：上游不會立刻停止，會等滿 5 秒。如果是 `WhileSubscribed(0)`，才會立刻停止。
    - 第 3 項錯：`5_000` 是「沒有訂閱者之後，等多久才停止上游」，和 UI 更新頻率無關。
    - 第 4 項錯：`5_000` 是毫秒，不是資料筆數，和收集幾筆資料無關。
    使用者真的離開 App、超過 5 秒沒有訂閱者，上游才會停，省電也省流量。另外 `stateIn` 保留最後一個值，所以新的 collector 立即拿到它而不是 `Loading`（除非上游從沒發過）。

