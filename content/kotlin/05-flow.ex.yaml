    solution: |
      import kotlinx.coroutines.*
      import kotlinx.coroutines.channels.awaitClose
      import kotlinx.coroutines.flow.*
      import java.util.concurrent.CopyOnWriteArrayList

      interface PriceListener {
          fun onPrice(price: Int)
          fun onError(e: Throwable)
          fun onClosed()
      }

      class PriceSource {
          private val listeners = CopyOnWriteArrayList<PriceListener>()
          val listenerCount: Int get() = listeners.size
          fun register(l: PriceListener) { listeners += l }
          fun unregister(l: PriceListener) { listeners -= l }
          fun emit(p: Int) = listeners.forEach { it.onPrice(p) }
          fun fail(e: Throwable) = listeners.forEach { it.onError(e) }
          fun close() = listeners.forEach { it.onClosed() }
      }

      fun PriceSource.prices(): Flow<Int> = callbackFlow {
          val listener = object : PriceListener {
              override fun onPrice(price: Int) { trySend(price) }
              override fun onError(e: Throwable) { close(e) }
              override fun onClosed() { close() }
          }
          register(listener)
          awaitClose { unregister(listener) }
      }.conflate()
    tests: |
      checkEqual("take(3) 收到前三筆", listOf(1, 2, 3)) {
          val src = PriceSource()
          val d = async { src.prices().take(3).toList() }
          delay(20)
          listOf(1, 2, 3, 4).forEach { src.emit(it); yield() }
          d.await()
      }
      checkEqual("take 結束後已解除註冊", 0) {
          val src = PriceSource()
          val d = async { src.prices().take(1).toList() }
          delay(20)
          src.emit(1)
          d.await()
          src.listenerCount
      }
      checkEqual("收集期間有註冊、取消後解除", "1/0") {
          val src = PriceSource()
          val j = launch { src.prices().collect { } }
          delay(20)
          val during = src.listenerCount
          j.cancelAndJoin()
          "$during/${src.listenerCount}"
      }
      checkEqual("onError 讓 flow 以該例外結束", "error:ws down") {
          val src = PriceSource()
          val d = async {
              try {
                  src.prices().toList()
                  "completed"
              } catch (e: IllegalStateException) {
                  "error:${e.message}"
              }
          }
          delay(20)
          src.emit(1); yield()
          src.fail(IllegalStateException("ws down"))
          d.await()
      }
      checkEqual("onClosed 讓 flow 正常結束", listOf(1, 2)) {
          val src = PriceSource()
          val d = async { src.prices().toList() }
          delay(20)
          src.emit(1); yield()
          src.emit(2); yield()
          src.close()
          d.await()
      }
      checkEqual("慢速 collector 面對瞬間大量價格，最後收到的是最新價", 200) {
          val src = PriceSource()
          val received = mutableListOf<Int>()
          val j = launch { src.prices().collect { received += it; delay(50) } }
          delay(20)
          for (i in 1..200) src.emit(i)
          delay(300)
          j.cancelAndJoin()
          received.last()
      }

- id: kotlin-flow-09
  type: open
  level: 3
  priority: P0
  tags: [market-data, architecture, field]
  prompt: |
    設計 Android 端行情畫面的資料流：WebSocket 推送大量 ticker（幾十筆／秒），畫面要顯示自選清單；點進單一交易對後還要看 order book 增量更新。請說明你的 Flow pipeline、背壓策略與生命週期處理，並說明和單一交易對的即時 K 線（SSE）相比，整個行情列表需要多做什麼。
  promptJa: |
    Android の相場画面のデータフローを設計してください。WebSocket から高頻度のティッカー（毎秒数十件）が届き、画面にはウォッチリストを表示します。個別銘柄に入ると板（order book）の差分更新も見られます。Flow のパイプライン、バックプレッシャー戦略、ライフサイクルの扱いを説明し、1 銘柄だけのリアルタイムローソク足（SSE）と比べて、相場一覧では何を追加で行う必要があるかも説明してください。
  keyPoints:
    - 資料源：WebSocket 包成 callbackFlow（trySend ＋ awaitClose），訊息在 IO／Default 解析，不在主執行緒
    - 最新價型資料：conflate 或 sample 壓到畫面可承受的頻率（例如 100ms），StateFlow 發佈快照
    - order book 增量不能丟：背景單執行緒依序套用 delta、維護本地簿，對外發佈快照；偵測序號斷層就重新抓快照
    - 以 stateIn(WhileSubscribed(5000)) 讓訂閱隨畫面啟停；Compose 用 collectAsStateWithLifecycle，View 用 repeatOnLifecycle
    - 切換交易對用 flatMapLatest 取消舊訂閱；清單用 key 與 contentType，避免整個列表重組
    - 重連與補資料：斷線後指數退避加 jitter，重連後重新訂閱並抓快照對齊
    - 和單一交易對 K 線的差別：即時 K 線是單一交易對的 SSE，事件量小；行情列表有很多檔、頻率高很多，所以要加上 conflate／sample 與 stateIn(WhileSubscribed(5000))
  modelAnswer: |
    我會分三層。資料源：WebSocket 用 `callbackFlow` 包起來，callback 裡 `trySend`，`awaitClose` 解除註冊；訊息解析放在 IO 或 Default 的 dispatcher，不碰主執行緒。

    清單畫面的 ticker 是「只在意最新值」的資料，所以在 repository 內先 `conflate`（collector 忙就只留最新），再用 `sample(100)` 壓到畫面能承受的頻率（每 100 毫秒取一筆最新的），用 `stateIn(WhileSubscribed(5000))` 發佈給 ViewModel；5 秒能撐過旋轉，離開畫面超過 5 秒才停掉訂閱。Compose 端用 `collectAsStateWithLifecycle`。

    order book 不一樣，增量更新（delta）每筆都不能丟，所以不能 `conflate`。我會在單一背景執行緒依序套用 delta、維護本機的 order book，偵測到序號斷層就重新抓快照；對外只發佈快照，UI 層再 `conflate` 或 `sample`。切換交易對用 `flatMapLatest` 取消舊的訂閱。

    和單一交易對的即時 K 線比較：K 線是 SSE，事件量小，直接更新資料就夠用。行情列表有很多檔、頻率高很多，所以我會用共享的 repository 加上 `stateIn`，並用指數退避加 jitter（重連間隔每次加倍、再加一點隨機）處理重連。
  modelAnswerJa: |
    三つの層で考えます。まずデータソースです。WebSocket は `callbackFlow` で包み、コールバック内では `trySend`、`awaitClose` でリスナーを解除します。メッセージの解析は IO か Default の dispatcher で行い、メインスレッドでは行いません。

    ウォッチリストのティッカーは「最新値だけが重要」なデータなので、repository 内でまず `conflate` し、さらに `sample(100)` で画面が処理できる頻度に落とし、`stateIn(WhileSubscribed(5000))` で ViewModel に公開します。5 秒あれば画面回転を乗り切れ、画面を離れて 5 秒を超えたときだけ購読を止められます。Compose 側は `collectAsStateWithLifecycle` で収集します。

    板（order book）は別です。差分更新は 1 件も落とせないので `conflate` は使えません。単一のバックグラウンドスレッドで差分を順番に適用してローカルの板を維持し、シーケンスの欠落を検知したらスナップショットを取り直します。外にはスナップショットだけを公開し、UI 側で `conflate` か `sample` をかけます。銘柄切り替えは `flatMapLatest` で古い購読をキャンセルします。

    1 銘柄だけのリアルタイムローソク足は SSE で、イベント量が少ないため、そのままデータを更新すれば十分です。相場一覧は銘柄数が多く更新頻度もずっと高いので、共有 repository と `stateIn` を使い、再接続は指数バックオフと jitter で扱います。
  followUps:
    - delta 的序號出現斷層時怎麼處理？
    - WebSocket 在背景被系統斷線，回前景怎麼補資料？
    - 清單有 200 個交易對，每個都在更新，UI 層怎麼避免整個列表重組？

- id: kotlin-flow-10
  type: flash
  level: 2
  priority: P0
  tags: [lifecycle, compose]
  front: Compose 與 View 各自該用什麼收集 Flow，才不會在背景持續更新？
  back: |
    Compose：`collectAsStateWithLifecycle()`（`lifecycle-runtime-compose`，預設 `STARTED` 才收集）；`collectAsState()` 不知道 lifecycle，在背景還會繼續收集。
    View／Fragment：`viewLifecycleOwner.lifecycleScope.launch { viewLifecycleOwner.repeatOnLifecycle(STARTED) { flow.collect { } } }`。
    搭配上游 `stateIn(WhileSubscribed(5000))`，畫面離開超過 5 秒，連 WebSocket 訂閱都會停。
