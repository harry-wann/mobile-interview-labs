    画面上の銘柄を唯一の基準にして、派生するリクエストはすべてそれに紐付けます。SwiftUI では `.task(id: symbol)` を使い、銘柄が変わるとフレームワークが古い Task をキャンセルして再起動します。UIKit では Task のハンドルを保持し、切り替え前に `cancel()` します。

    キャンセルは協調的、つまり「旗を立てて相手に止まってもらう」方式なので、次の 3 点が必要です。URLSession の async API は標準でキャンセルを検査します。自前の重いループには `checkCancellation` を入れます。コールバックを async に包む箇所では、`withTaskCancellationHandler` で下位のリクエストを止めます。相場の WebSocket では unsub（購読解除）の送信も必要で、古い AsyncStream も終了させます。キャンセルしても処理中の応答が届く可能性があるため、受信時に銘柄を再確認し、古いデータが新しい画面を上書きしないようにします。

    ticker、板情報、資産を同時に取得するときは `async let`、多数の銘柄をまとめて取得するときは並行数を制限した TaskGroup を使います。公開 REST には IP あたりのレート制限（たとえば毎秒 10 回）があることが多いためです。`CancellationError` はエラー表示せず静かに扱います。

    キャンセルの扱いは、二つのプロジェクトで実装しました。あるソーシャルアプリでは Rx と async のブリッジで、Rx 側が破棄されたときに Task もキャンセルされるようにしています。ウォレット作成フローでは Task を保持し、sleep の後に `Task.isCancelled` を確認しています。あるリアルタイム相場アプリの SSE クライアントでも Task の中で `Task.isCancelled` を確認しています。取引所アプリでは、注文画面と相場画面から、上記の方法で銘柄切り替えを処理します。
