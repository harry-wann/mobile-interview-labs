- id: "swift-asyncsequence-combine-01"
  type: "predict"
  level: 2
  priority: "P0"
  tags: [asyncstream, buffering]
  prompt: |
    生產者連續送出 1 到 5，消費者還沒開始讀，之後才開始 `for await`。印出什麼？
  codeLang: "swift"
  code: |
    let (stream, continuation) = AsyncStream.makeStream(
        of: Int.self,
        bufferingPolicy: .bufferingNewest(2)
    )
    for i in 1...5 { continuation.yield(i) }
    continuation.finish()

    var out: [Int] = []
    for await v in stream { out.append(v) }
    print(out.map(String.init).joined(separator: " "))
  answer: |
    4 5
  explain: |
    `.bufferingNewest(2)` 的緩衝區只放得下最新的兩筆，新資料進來時就把最舊的擠掉，所以消費到 `4 5`。換成 `.bufferingOldest(2)` 會是 `1 2`，`.unbounded` 則是全部五筆（本機皆實測）。

    行情顯示用 `.bufferingNewest(1)`，就是 conflation（只留最新一筆）：慢的消費者只會看到最新價，記憶體用量固定。成交回報這類不能丟的事件，就不能這樣用。

- id: "swift-asyncsequence-combine-02"
  type: "single"
  level: 2
  priority: "P0"
  tags: [combine, throttle, debounce]
  prompt: |
    行情 WebSocket 每秒推送數十筆價格，畫面想要「每 200 ms 最多更新一次，顯示當下最新價」。哪個 Combine 做法正確？
  options:
    - "`.debounce(for: .milliseconds(200), scheduler: DispatchQueue.main)`"
    - "`.throttle(for: .milliseconds(200), scheduler: DispatchQueue.main, latest: true)`"
    - "`.throttle(for: .milliseconds(200), scheduler: DispatchQueue.main, latest: false)`，因為 false 代表取最新"
    - "`.delay(for: .milliseconds(200), scheduler: DispatchQueue.main)`"
  answer: 1
  explain: |
    `throttle` 以固定間隔送出一次，`latest: true` 送出該區間內**最新**的值，正好符合需求。

    其他選項錯在哪裡：
    - `debounce`：要等資料「安靜 200 ms」才送出，行情持續進來，計時就一直被重置，永遠送不出去（餓死）。
    - `latest: false`：送出的是區間內**第一個**值，顯示的會是比較舊的價格，不是最新價。
    - `delay`：只是把每個值整體往後延遲，沒有降低更新頻率。

- id: "swift-asyncsequence-combine-03"
  type: "predict"
  level: 2
  priority: "P1"
  tags: [combine, share]
  prompt: |
    下列程式印出什麼？（兩行輸出）
  codeLang: "swift"
  code: |
    import Combine

    var mapCalls = 0
    let subject = PassthroughSubject<Int, Never>()
    let shared = subject
        .map { v -> Int in mapCalls += 1; return v * 2 }
        .share()

    var a: [Int] = []
    var b: [Int] = []
    var late: [Int] = []

    let c1 = shared.sink { a.append($0) }
    let c2 = shared.sink { b.append($0) }
    subject.send(1)
    subject.send(2)
    let c3 = shared.sink { late.append($0) }
    subject.send(3)

    print(mapCalls, a.count, b.count, late.count)
    print(late[0])
  answer: |
    3 3 3 1 6
  explain: |
    - `share()` 讓上游的 `map` 對每個值只執行一次（共 3 次）。沒有 `share()` 時，兩個訂閱者會各自觸發一次 `map`，次數會翻倍。
    - `a`、`b` 都在一開始就訂閱，所以各收到 3 筆。
    - `late` 是在 `send(2)` 之後才訂閱的，而 **`share()` 不重播**，所以它只收到之後的 `6`（`send(3)` 的結果 3 × 2），第二行印的就是這個 6。
    - 需要讓晚到的訂閱者也拿到最新值時，用 `multicast` 搭配 `CurrentValueSubject`。

- id: "swift-asyncsequence-combine-04"
  type: "multi"
  level: 2
  priority: "P0"
  tags: [asyncstream, onTermination]
  prompt: |
    關於 `AsyncStream`，哪些敘述正確？（複選）
  options:
    - "`.bufferingNewest(1)` 在消費者較慢時丟掉舊值，適合只關心最新價格的顯示"
    - "兩個 Task 同時對同一個 stream 做 `for await`，每個 Task 都會收到全部的元素"
    - "`continuation.onTermination` 會在 stream 結束時被呼叫（消費者取消，或結束迭代），適合在這裡退訂 WebSocket topic 或移除 observer"
    - "`.unbounded` 緩衝有上限，超過時會自動丟棄最舊的元素"
    - "先對行情做 `bufferingNewest(1)` conflation，再累積每分鐘的高低價，結果與直接累積原始 tick 相同"
  answer: [0, 2]
  explain: |
    正確的兩項：
    - `.bufferingNewest(1)` 只留最新一筆，慢消費者永遠看到最新價，適合顯示用。
    - `onTermination` 是消費者取消或結束時，唯一可靠的清理時機，退訂要放在這裡。

    錯誤的三項：
    - `AsyncStream` 是單一消費者模型：官方不支援多個地方同時迭代同一個 stream，它也不是廣播。新的 runtime 會「分食」元素（本機實測一個收到 1、3、5，另一個收到 2、4、6），舊的 runtime 可能直接 crash，不要依賴這個行為。需要多個訂閱者就要自己做 fan-out。
    - `.unbounded` 沒有上限，也不會自動丟東西，慢的消費者會讓記憶體持續成長。
    - conflation 會丟掉中間的值，其中可能有最高點或最低點，結果就不相同了。所以聚合（高低價、成交量）要在 conflate **之前**做，conflate 只用在「顯示最新值」。

- id: "swift-asyncsequence-combine-05"
  type: "fill"
  level: 2
  priority: "P0"
  tags: [asyncstream, bridging]
  prompt: |
    把 callback 風格的 `MarketSocket.subscribe` 包成只保留最新一筆的 `AsyncStream`，並且在 stream 結束時退訂（取消訂閱）。
  codeLang: "swift"
  code: |
    func prices(socket: some MarketSocket) -> AsyncStream<Tick> {
        AsyncStream(Tick.self, bufferingPolicy: .____(1)) { continuation in
            let token = socket.subscribe("btcjpy") { tick in
                continuation.yield(tick)
            }
            continuation.____ = { _ in
                socket.unsubscribe(token)
            }
        }
    }
  blanks:
    - [bufferingNewest]
    - [onTermination]
  explain: |
    - `bufferingNewest(1)` 做到 conflation（只留最新一筆）。
    - `onTermination` 是 stream 結束時（Task 被取消、離開 `for await`）唯一可靠的清理時機，沒有它，WebSocket 的 topic 會一直訂閱下去。

    另外要記得：建立 stream 的 closure 會**同步、立刻**執行，所以訂閱在呼叫 `prices(socket:)` 的時候就已經發生了，不是等到開始迭代才訂閱。

- id: "swift-asyncsequence-combine-06"
  type: "single"
  level: 2
  priority: "P0"
  tags: [combine, switchToLatest]
  prompt: |
    使用者在下單頁快速切換交易對，舊交易對的深度回應有時比新的晚到，把新畫面蓋掉。下列 Combine 管線中，最合適的修正是？
  codeLang: "swift"
  code: |
    $symbol
        .removeDuplicates()
        .map { fetchDepth($0).replaceError(with: Book.empty) }
        // ← 這裡要接什麼，才能讓舊請求被取消、只採用最新交易對的結果？
        .receive(on: DispatchQueue.main)
        .assign(to: &$book)
  options:
    - ".flatMap { $0 }"
    - ".merge(with: Empty())"
    - ".switchToLatest()"
    - ".zip(Just(1)).map { $0.0 }"
  answer: 2
  explain: |
    `switchToLatest()` 在收到新的內層 publisher（每次 `map` 產生的那個請求）時，會取消前一個，所以舊交易對的請求被取消，晚到的回應不會進來。

    其他選項錯在哪裡：
    - `.flatMap { $0 }`：所有內層 publisher 會同時存活，晚到的舊回應仍然會輸出，問題沒有解決。
    - `.merge(with: Empty())`：`merge` 只是把兩個串流合在一起，不會取消任何請求。
    - `.zip(Just(1)).map { $0.0 }`：`zip` 只是把兩個串流的值配對，同樣沒有取消舊請求的效果。

    async/await 版本是 SwiftUI 的 `.task(id: symbol)`；兩種做法的共同概念是「新的一個來，舊的一個被取消」。

- id: "swift-asyncsequence-combine-07"
  type: "multi"
  level: 3
  priority: "P1"
  tags: [combine, scheduler, published]
  prompt: |
    關於 Combine 的行為，哪些敘述正確？（複選）
  options:
    - "`debounce` 用在每 100 ms 就送一次的串流上，時限設 300 ms，在串流停止前不會送出任何值"
    - "`throttle(for:scheduler:latest: true)` 在每個區間結束時送出該區間內最新的值"
    - "`share()` 會把最後一個值重播給晚到的訂閱者"
    - "`receive(on: DispatchQueue.main)` 即使已經在主執行緒，也會把值 async 排到之後才送出"
    - "`vm.$price.sink { _ in print(vm.price) }` 收到新值時，`vm.price` 已經是新值"
  answer: [0, 1, 3]
  explain: |
    正確的三項：
    - `debounce`：串流每 100 ms 送一次、時限是 300 ms，計時一直被重置，所以在串流停止前不會送出任何值。
    - `throttle(latest: true)`：每個區間結束時，送出該區間內最新的值。
    - `receive(on: DispatchQueue.main)` 永遠是 async 排程，本機實測 `send` 之後的語句會先執行，值才送達。同步的斷言測試要改用 `ImmediateScheduler`，或等候一下。

    錯誤的兩項：
    - `share()` 不重播，晚到的訂閱者只收到之後的值。
    - `@Published` 在 `willSet`（值即將存入、還沒存入的時間點）發送，所以 sink 收到新值時，屬性本身仍然是舊值（本機實測 `sink 5 prop 0`）。需要新值時，要用傳進來的參數，不要回頭讀屬性。

