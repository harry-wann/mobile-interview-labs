    solution: |
      import Foundation

      final class PriceTicker: @unchecked Sendable {
          private let lock = NSLock()
          private var handlers: [UUID: (Decimal) -> Void] = [:]

          func addHandler(_ handler: @escaping (Decimal) -> Void) -> UUID {
              lock.lock(); defer { lock.unlock() }
              let id = UUID()
              handlers[id] = handler
              return id
          }

          func removeHandler(_ id: UUID) {
              lock.lock(); defer { lock.unlock() }
              handlers[id] = nil
          }

          func emit(_ price: Decimal) {
              lock.lock()
              let current = Array(handlers.values)
              lock.unlock()
              for handler in current { handler(price) }
          }

          var handlerCount: Int {
              lock.lock(); defer { lock.unlock() }
              return handlers.count
          }
      }

      func prices(from ticker: PriceTicker, conflate: Bool) -> AsyncStream<Decimal> {
          AsyncStream(Decimal.self, bufferingPolicy: conflate ? .bufferingNewest(1) : .unbounded) { continuation in
              let id = ticker.addHandler { price in continuation.yield(price) }
              continuation.onTermination = { _ in ticker.removeHandler(id) }
          }
      }
    tests: |
      func D(_ s: String) -> Decimal { Decimal(string: s)! }

      func waitUntil(timeoutMs: Int = 1000, _ cond: @escaping @Sendable () -> Bool) async -> Bool {
          var waited = 0
          while waited < timeoutMs {
              if cond() { return true }
              try? await Task.sleep(nanoseconds: 10_000_000)
              waited += 10
          }
          return cond()
      }

      await checkAsync("emit 的價格依序從 stream 收到") {
          let ticker = PriceTicker()
          let stream = prices(from: ticker, conflate: false)
          ticker.emit(D("100")); ticker.emit(D("101")); ticker.emit(D("102"))
          var got: [Decimal] = []
          for await p in stream {
              got.append(p)
              if got.count == 3 { break }
          }
          return got == [D("100"), D("101"), D("102")]
      }
      await checkAsync("建立 stream 時註冊 handler") {
          let ticker = PriceTicker()
          let stream = prices(from: ticker, conflate: false)
          let count = ticker.handlerCount
          withExtendedLifetime(stream) {}
          return count == 1
      }
      await checkAsync("consumer break 之後移除 handler") {
          let ticker = PriceTicker()
          do {
              let stream = prices(from: ticker, conflate: false)
              ticker.emit(D("1"))
              for await _ in stream { break }
          }
          return await waitUntil { ticker.handlerCount == 0 }
      }
      await checkAsync("consumer 的 Task 被取消後移除 handler") {
          let ticker = PriceTicker()
          let task = Task {
              for await _ in prices(from: ticker, conflate: false) {}
          }
          let registered = await waitUntil { ticker.handlerCount == 1 }
          task.cancel()
          await task.value
          let removed = await waitUntil { ticker.handlerCount == 0 }
          return registered && removed
      }
      await checkAsync("conflate 只保留最新一筆") {
          let ticker = PriceTicker()
          let stream = prices(from: ticker, conflate: true)
          for i in 1...5 { ticker.emit(Decimal(i)) }
          var got: [Decimal] = []
          for await p in stream {
              got.append(p)
              break
          }
          return got == [Decimal(5)]
      }
      await checkAsync("不 conflate 時保留全部") {
          let ticker = PriceTicker()
          let stream = prices(from: ticker, conflate: false)
          for i in 1...5 { ticker.emit(Decimal(i)) }
          var got: [Decimal] = []
          for await p in stream {
              got.append(p)
              if got.count == 5 { break }
          }
          return got == (1...5).map { Decimal($0) }
      }

- id: "swift-asyncsequence-combine-09"
  type: "open"
  level: 2
  priority: "P0"
  tags: [market-data, architecture, field]
  prompt: |
    設計交易所 App 的行情資料管線，從 WebSocket 到畫面。你會用 AsyncStream、Combine 還是 Rx？怎麼做 conflation？哪些資料不能丟？並說明你實際用過什麼。
  promptJa: |
    取引所アプリの相場データのパイプライン（WebSocket から画面まで）を設計してください。AsyncStream、Combine、Rx のどれを使いますか。コンフレーション（間引き）はどうしますか。落としてはいけないデータは何ですか。実際に使ったものも説明してください。
  keyPoints:
    - "分層：socket 層（gzip 二進位 frame、ping／pong、重連與重新訂閱）、解碼、每個 topic 一個 stream、ViewModel、畫面"
    - "新的程式用 `AsyncStream`：`bufferingNewest(1)` 做 conflation，`onTermination` 退訂；畫面以固定頻率（約 100–250 ms）取最新資料，只更新看得到的列"
    - "不能丟的資料：成交回報、訂單狀態用 `.unbounded` 加序號或 ack 補漏；K 線的高低價、成交量要在 conflate 之前聚合"
    - "多個訂閱者：`AsyncStream` 是單一消費者，需要 fan-out 層，或由 ViewModel 集中分發"
    - "選型：請求回應用 async/await；iOS 15／16 的畫面綁定仍用 `@Published`；既有的 Rx 保留，橋接點寫清楚"
    - "重連用指數退避加 jitter；斷線時畫面標示資料過期，並禁止用過期的價格下單"
    - "實務上的相關經驗：社交 App 以 Rx 與 Combine 處理資料流並橋接 async；即時行情 App 用 `for await` 消費 SSE 事件流、用 Combine 綁定畫面狀態"
  modelAnswer: |
    我會把管線分層：socket 層處理 gzip 二進位 frame、ping／pong、重連和重新訂閱；解碼之後，每個 topic 對外是一個 `AsyncStream`；ViewModel 再把它轉成畫面狀態。

    顯示用的資料（ticker、最佳買賣價）我用 `bufferingNewest(1)` 做 conflation（只留最新一筆），`onTermination` 負責退訂，畫面以固定頻率（大約 100 到 250 ms）取最新資料，只更新看得到的列。**不能丟的資料**是成交回報和訂單狀態，用 `.unbounded` 搭配序號或 ack（對方的確認回應）補漏；K 線的高低價與成交量，要在 conflate 之前先聚合。

    選型上，請求回應用 async/await，新的串流用 `AsyncStream`；如果最低支援 iOS 15，畫面綁定仍然是 `@Published`，沒有 Observation 可用。既有的 Rx 不急著重寫，橋接的地方寫清楚。重連要用指數退避加 jitter（隨機抖動），斷線時畫面要標示價格已過期，並禁止用過期的價格下單。

    經驗上，在一個社交 App 裡，資料流以 Rx 和 Combine 為主，並且處理過 Rx 與 async 的橋接；在一個即時行情 App 裡，即時 K 線用 SSE，iOS 端用 `for await` 消費事件流，畫面狀態用 Combine 的 `@Published`。對交易所 App，我會把這些經驗延伸成：用 `AsyncStream` 包 WebSocket 的 topic、固定頻率更新畫面，並把重連改成指數退避加 jitter。
  modelAnswerJa: |
    パイプラインは層に分けます。socket 層は gzip のバイナリフレーム、ping/pong、再接続と再購読を担当し、デコード後は topic ごとに `AsyncStream` として公開します。ViewModel がそれを画面の状態に変換します。

    表示用のデータ（ticker、最良気配）は `bufferingNewest(1)` でコンフレーション（最新の 1 件だけを残す処理）し、`onTermination` で購読を解除します。画面は一定間隔（約 100〜250 ms）で最新データを取り、表示中の行だけ更新します。**落としてはいけないデータ**は約定通知と注文状態で、`.unbounded` にシーケンス番号や ack を組み合わせて欠落を補います。ローソク足の高値・安値や出来高は、コンフレーションの前に集計します。

    選定は、リクエスト・レスポンスは async/await、新しいストリームは `AsyncStream` です。最低バージョンが iOS 15 なら、画面のバインディングは `@Published` で、Observation は使えません。既存の Rx はすぐには書き換えず、ブリッジ部分を明確にします。再接続は指数バックオフと jitter を使い、切断時は価格が古いことを画面に表示して、古い価格での発注は禁止します。

    経験としては、あるソーシャルアプリではデータフローを Rx と Combine で扱い、Rx と async のブリッジも実装しました。あるリアルタイム相場アプリのローソク足は SSE で、iOS 側では `for await` でイベントストリームを消費し、画面の状態は Combine の `@Published` で管理しています。取引所アプリでは、この経験を発展させて、`AsyncStream` で WebSocket の topic を包み、一定間隔で画面を更新し、再接続を指数バックオフと jitter にします。
  followUps:
    - "conflation で捨てた tick の中に高値があったらどうなる？"
    - "画面が 3 つの銘柄を同時に表示するとき、socket の購読はどう共有する？"
    - "再接続後に抜けた約定履歴はどう補う？"
  timeLimitSec: 150

- id: "swift-asyncsequence-combine-10"
  type: "flash"
  level: 1
  priority: "P0"
  tags: [asyncstream]
  front: |
    AsyncStream 的三種 buffering policy 與行情 conflation 的用法
  back: |
    buffering policy 決定「消費者來不及讀時，多出來的資料怎麼存」：
    - `.unbounded`（預設）：全部存起來，慢的消費者會讓記憶體成長；用於不能丟的事件（成交、訂單）。
    - `.bufferingNewest(n)`：只留最新 n 筆；`n = 1` 就是 conflation（只留最新一筆），行情顯示用。
    - `.bufferingOldest(n)`：只留最舊 n 筆。

    注意：
    - 只支援單一消費者（多個 `for await` 不受支援：新的 runtime 會分食元素，舊的 runtime 可能 crash）。
    - 聚合（高低價、成交量）要在 conflate 之前做。
    - 用 `onTermination` 退訂。
